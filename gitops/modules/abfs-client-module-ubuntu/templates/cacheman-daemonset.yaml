{{- if .Values.cacheman.enabled }}
{{- if not .Values.cacheman.hostDir }}
{{- fail "cacheman.enabled=true requires cacheman.hostDir (node directory shared with the build pods)" }}
{{- end }}
{{- if not .Values.cacheman.server }}
{{- fail "cacheman.enabled=true requires cacheman.server (ABFS server host:port)" }}
{{- end }}
# Shared cacheman: one `abfs cacheman run` per node of the build pool. Build
# pods on the node do not start their own cacheman; they mount the same node
# directory (instance directory with the cacheman socket, and the cache) and
# run only `abfs mount` / `abfs setup` (builder chart, spec.abfs.sharedCacheman).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: abfs-cacheman
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/name: abfs
    app.kubernetes.io/component: cacheman
    horizon-sdv.io/module: {{ .Values.moduleName | default "abfs-client-module-ubuntu" | quote }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: abfs
      app.kubernetes.io/component: cacheman
  updateStrategy:
    # A restart of cacheman breaks the builds running on the node, so a change
    # of this DaemonSet reaches a node only when its pod is deleted by hand or
    # the node is replaced.
    type: OnDelete
  template:
    metadata:
      labels:
        {{- include "abfs.labels" . | nindent 8 }}
        app.kubernetes.io/name: abfs
        app.kubernetes.io/component: cacheman
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # cacheman needs no Kubernetes API: no service account token.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Host side: cacheman listens in the node's network namespace, so the
      # listen backlog set below is the node's net.core.somaxconn.
      hostPID: true
      hostNetwork: {{ .Values.cacheman.hostNetwork }}
      {{- if .Values.cacheman.hostNetwork }}
      # Keep cluster DNS: the ABFS server is addressed by its Service name.
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The node directory belongs to the build user: abfs creates its config,
      # sockets and cache files with fixed modes (0600, 0755) whatever the
      # umask, so build pods (user builder) can use them only when cacheman
      # runs as that same user, as the per-pod cacheman did. Only the
      # preparation below needs root.
      initContainers:
        - name: prepare
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
            runAsUser: 0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              DIR={{ .Values.cacheman.hostDir | quote }}
              echo "waiting for the casfs kernel module (casfs installer DaemonSet)"
              until [ -d /sys/module/casfs ]; do sleep 5; done
              # ninja of every build on the node asks cacheman for cache hits
              # over its unix socket; the default backlog is too small.
              echo {{ .Values.cacheman.somaxconn | int }} > /proc/sys/net/core/somaxconn || \
                echo "WARNING: could not raise net.core.somaxconn"
              echo "net.core.somaxconn=$(cat /proc/sys/net/core/somaxconn)"
              mkdir -p "${DIR}/instances" "${DIR}/cache" "${DIR}/home"
              # Also takes over files left by an earlier cacheman that ran as root.
              chown -R "${BUILD_UID}:${BUILD_GID}" "${DIR}"
              chmod 0770 "${DIR}" "${DIR}/instances" "${DIR}/cache" "${DIR}/home"
              # abfs looks its user up by uid; the image has no build user, so
              # cacheman gets passwd/group files that add it.
              grep -v "^[^:]*:[^:]*:${BUILD_UID}:" /etc/passwd > /identity/passwd
              echo "builder:x:${BUILD_UID}:${BUILD_GID}::${DIR}/home:/bin/bash" >> /identity/passwd
              grep -v "^[^:]*:[^:]*:${BUILD_GID}:" /etc/group > /identity/group
              echo "builder:x:${BUILD_GID}:" >> /identity/group
              chmod 0644 /identity/passwd /identity/group
          env:
            - name: BUILD_UID
              value: {{ .Values.cacheman.buildUserId | int | quote }}
            - name: BUILD_GID
              value: {{ .Values.cacheman.buildGroupId | int | quote }}
          volumeMounts:
            - name: abfs-shared
              mountPath: {{ .Values.cacheman.hostDir | quote }}
            - name: identity
              mountPath: /identity
      containers:
        - name: cacheman
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Privileged for the Bidirectional mount propagation below; runs as
          # the build user, so it has no capabilities (same as the per-pod
          # cacheman of the builder image).
          securityContext:
            privileged: true
            runAsUser: {{ .Values.cacheman.buildUserId | int }}
            runAsGroup: {{ .Values.cacheman.buildGroupId | int }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              DIR={{ .Values.cacheman.hostDir | quote }}
              SRV={{ .Values.cacheman.server | quote }}
              FLAGS="--abfs-base-dir ${DIR}/instances --cache-dir ${DIR}/cache"
              CLIENT={{ .Values.cacheman.clientFlags | quote }}
              # shellcheck disable=SC2086
              abfs ${FLAGS} init
              # shellcheck disable=SC2086
              abfs ${FLAGS} ${CLIENT} --remote-servers "${SRV}" --tunnel-ports 0 \
                --manifest-server {{ .Values.cacheman.manifestServer | quote }} config -w
              echo "starting cacheman for the node (server ${SRV}) as uid $(id -u)"
              # shellcheck disable=SC2086
              exec abfs ${FLAGS} ${CLIENT} cacheman run
          env:
            - name: HOME
              value: "{{ .Values.cacheman.hostDir }}/home"
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - abfs --abfs-base-dir "{{ .Values.cacheman.hostDir }}/instances" --cache-dir "{{ .Values.cacheman.hostDir }}/cache" cacheman ping -t 10s
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 15
          volumeMounts:
            - name: abfs-shared
              mountPath: {{ .Values.cacheman.hostDir | quote }}
              # Mounts made by cacheman under this directory must reach the
              # node and, through it, the build pods.
              mountPropagation: Bidirectional
            - name: identity
              mountPath: /etc/passwd
              subPath: passwd
              readOnly: true
            - name: identity
              mountPath: /etc/group
              subPath: group
              readOnly: true
          resources:
            {{- toYaml .Values.cacheman.resources | nindent 12 }}
      volumes:
        - name: identity
          emptyDir:
            sizeLimit: 1Mi
        - name: abfs-shared
          hostPath:
            path: {{ .Values.cacheman.hostDir | quote }}
            type: DirectoryOrCreate
{{- end }}
