# Child Application: KCC ContainerNodePool abfs-build-node-pool-ubuntu.
# Applied when Module Manager enables abfs-client-module-ubuntu.

{{- if not (default false .Values.config.isSubEnvironment) }}
{{- $_ := required "config.gcpComputeSaEmail must be set (MODULE_CONFIG / Terraform sdv_gcp_compute_sa_email)" .Values.config.gcpComputeSaEmail -}}
{{- $abfsPool := default dict .Values.config.abfsBuildNodePool }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-node-pool
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.moduleName }}
    horizon-sdv.io/module: {{ .Values.moduleName }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/abfs-client-module-ubuntu/node-pool
    helm:
      values: |
        namespace: {{ .Values.overviewNamespace | quote }}
        parentModuleName: {{ .Values.moduleName | quote }}
        gcpProjectId: {{ .Values.config.projectID | quote }}
        clusterName: {{ .Values.config.clusterName | default "sdv-cluster" | quote }}
        location: {{ .Values.config.region | quote }}
        gcpComputeSaEmail: {{ .Values.config.gcpComputeSaEmail | quote }}
        releaseChannel: {{ .Values.config.releaseChannel | default "" | quote }}
        nodeLocations:
{{ .Values.config.nodeLocations | default list | toYaml | nindent 10 }}
        nodePool:
          name: {{ .Values.nodePool.name | quote }}
          version: {{ $abfsPool.version | default "" | quote }}
          machineType: {{ .Values.nodePool.machineType | quote }}
          diskSizeGb: {{ .Values.nodePool.diskSizeGb }}
          imageType: {{ .Values.nodePool.imageType | quote }}
          initialNodeCount: {{ .Values.nodePool.initialNodeCount }}
          minNodeCount: {{ .Values.nodePool.minNodeCount }}
          maxNodeCount: {{ .Values.nodePool.maxNodeCount }}
          workloadLabel: {{ .Values.nodePool.workloadLabel | quote }}
          workloadType: {{ .Values.nodePool.workloadType | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.overviewNamespace }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
{{- end }}
