# Created when abfs-client-module-ubuntu is enabled

{{- $_ := required "gcpComputeSaEmail must be set (MODULE_CONFIG config.gcpComputeSaEmail / Terraform sdv_gcp_compute_sa_email); refusing empty serviceAccountRef.external" .Values.gcpComputeSaEmail -}}
{{- /* autoUpgrade true unless releaseChannel is explicitly UNSPECIFIED (empty => true for channel-enrolled clusters). */ -}}
{{- $autoUpgrade := ne .Values.releaseChannel "UNSPECIFIED" }}
apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: {{ .Values.nodePool.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: abfs-build-node-pool-ubuntu
    horizon-sdv.io/module: {{ .Values.parentModuleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Wait for the cnrm finalizer when Argo prunes this CR.
    argocd.argoproj.io/sync-options: PrunePropagationPolicy=foreground
    cnrm.cloud.google.com/project-id: {{ .Values.gcpProjectId | quote }}
spec:
  resourceID: {{ .Values.nodePool.name }}
  location: {{ .Values.location | quote }}
  clusterRef:
    external: projects/{{ .Values.gcpProjectId }}/locations/{{ .Values.location }}/clusters/{{ .Values.clusterName }}
  {{- /* Version pin is only meaningful with autoUpgrade false (UNSPECIFIED channel). With autoUpgrade
       true (channel-enrolled clusters), GKE may upgrade past this value — omit it so we do not imply a pin. */}}
  {{- if and (not $autoUpgrade) .Values.nodePool.version }}
  version: {{ .Values.nodePool.version | quote }}
  {{- end }}
  initialNodeCount: {{ .Values.nodePool.initialNodeCount }}
  {{- with .Values.nodeLocations }}
  nodeLocations:
{{ toYaml . | nindent 4 }}
  {{- end }}
  autoscaling:
    minNodeCount: {{ .Values.nodePool.minNodeCount }}
    maxNodeCount: {{ .Values.nodePool.maxNodeCount }}
  management:
    autoRepair: true
    # Explicit UNSPECIFIED => autoUpgrade false (CASFS version pin). Otherwise true (channel-enrolled safe).
    autoUpgrade: {{ $autoUpgrade }}
  nodeConfig:
    preemptible: false
    machineType: {{ .Values.nodePool.machineType | quote }}
    diskSizeGb: {{ .Values.nodePool.diskSizeGb }}
    imageType: {{ .Values.nodePool.imageType | quote }}
    serviceAccountRef:
      external: {{ .Values.gcpComputeSaEmail | quote }}
    oauthScopes:
      - https://www.googleapis.com/auth/cloud-platform
    labels:
      workloadLabel: {{ .Values.nodePool.workloadLabel | quote }}
    taint:
      - key: workloadType
        value: {{ .Values.nodePool.workloadType | quote }}
        effect: NO_SCHEDULE
    metadata:
      disable-legacy-endpoints: "true"
    workloadMetadataConfig:
      mode: GKE_METADATA
    # Pin Secure Boot off so a future GKE default change cannot break out-of-tree CASFS
    # (immutable after pool create). Integrity monitoring stays on (usual GKE default).
    shieldedInstanceConfig:
      enableSecureBoot: false
      enableIntegrityMonitoring: true
