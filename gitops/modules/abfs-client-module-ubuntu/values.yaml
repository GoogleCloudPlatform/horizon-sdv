moduleName: ""
moduleManagerNamespace: module-manager
argocd:
  namespace: argocd
  project: horizon-sdv
repo:
  url: ""
  revision: HEAD
overviewServiceName: mod-abfs-client-module-ubuntu-overview
overviewNamespace: abfs-client-module-ubuntu-overview
# Defaults for KCC abfs-build-node-pool-ubuntu (version / locations / SA from MODULE_CONFIG).
nodePool:
  name: abfs-build-node-pool-ubuntu
  machineType: c2d-highcpu-112
  diskSizeGb: 500
  imageType: UBUNTU_CONTAINERD
  initialNodeCount: 0
  minNodeCount: 0
  maxNodeCount: 20
  workloadLabel: android-abfs-build
  workloadType: android-abfs-build

# =============================== SCHEDULING ==================================
nodeSelector:
  cloud.google.com/gke-nodepool: abfs-build-node-pool-ubuntu
  workloadLabel: android-abfs-build
tolerations:
  - key: workloadType
    operator: Equal
    value: android-abfs-build
    effect: NoSchedule
# =============================== METADATA ====================================
# -- commonLabels -- extra labels added to every object + pod (non-selector).
commonLabels: {}
# -- commonAnnotations -- annotations added to every object's metadata.
commonAnnotations: {}
# -- podAnnotations -- annotations added to every ABFS pod template.
podAnnotations: {}
# -- podLabels -- extra labels added to every ABFS pod template.
podLabels: {}

# GKE (the node pool service account authenticates to Artifact Registry).
imagePullSecrets: []

# -- priorityClassName -- optional PriorityClass for pods.
priorityClassName: ""

# --- CASFS container image ----------------------------------------------------
image:
  # -- image.repository -- container image repository (no tag/digest).
  repository: europe-docker.pkg.dev/abfs-binaries/abfs-containers-alpha/abfs-alpha
  # -- image.tag -- image tag; empty falls back to Chart.appVersion.
  tag: "0.1.14"
  # -- image.digest -- optional immutable digest ("sha256:..."); pins the image
  # and overrides tag. Recommended for production.
  digest: ""
  # -- image.pullPolicy -- IfNotPresent | Always | Never.
  pullPolicy: IfNotPresent

# Compile casfs from source on each Ubuntu build node (same DaemonSet pattern as
# abfs-service-module on the data pool). Targeting uses nodePool labels/taints.
casfs:
  provider: daemonset
  daemonset:
    # casfs-kmod package version. The source tarball is <sourceUrl>/casfs-<version>.tar.gz.
    version: "0.1.14"
    image: "gcr.io/google.com/cloudsdktool/google-cloud-cli:slim"
    imagePullPolicy: IfNotPresent
    sourceUrl: "gs://cos-localmirror/distfiles"
    # Prebuilt package tried before the source build. Package name is
    # casfs-kmod-<kernel>_<version> in this Artifact Registry apt repository.
    aptProject: abfs-binaries
    aptLocation: us
    aptRepository: abfs-apt-alpha-public
    script: ""
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 1Gi
    # -- casfs.daemonset.nodeSelector -- where the loader runs
    # (empty = the global nodeSelector).
    nodeSelector: {}
    # -- casfs.daemonset.tolerations -- loader tolerations
    # (empty = the global tolerations).
    tolerations: []

# Shared cacheman: one `abfs cacheman run` per node of the build pool (DaemonSet
# abfs-cacheman), used by every build pod on that node. This is the target
# setup and is on by default, together with spec.abfs.sharedCacheman.enabled in
# the builder chart (values-abfs.yaml); the values below must match that chart.
# Off: each build pod starts its own cacheman, one build pod per node.
cacheman:
  enabled: true
  # Node directory shared with the build pods: instances/ (config and the
  # cacheman socket), cache/ (the local ABFS cache, on the node boot disk).
  hostDir: /var/lib/abfs
  # Group of the build pods (the builder image user is uid/gid 1000). Only root
  # and this group can use hostDir (mode 2770), so another user on the node
  # cannot reach the cacheman socket or write into the shared cache.
  buildGroupId: 1000
  # ABFS server and client flags, as spec.abfs.server / spec.abfs.clientFlags
  # in the builder chart.
  server: abfs-server.abfs.svc.cluster.local:50051
  clientFlags: "--disable-tls=true --auth-type none"
  # `abfs config -w` now runs once per node here instead of in every build pod,
  # and it needs the manifest host. Same value as
  # spec.abfs.uploaderManifestServer in the builder chart.
  manifestServer: android.googlesource.com
  # Listen backlog of the node (net.core.somaxconn), the value the builds need.
  somaxconn: 8192
  # Run cacheman in the node's network namespace.
  hostNetwork: true
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      memory: 32Gi
config: {}
