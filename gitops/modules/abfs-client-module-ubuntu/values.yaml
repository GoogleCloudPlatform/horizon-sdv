moduleName: ""
moduleManagerNamespace: module-manager
argocd:
  namespace: argocd
  project: horizon-sdv
repo:
  url: ""
  revision: HEAD
overviewServiceName: mod-abfs-client-module-ubuntu-overview
overviewNamespace: abfs-client-module-ubuntu-overview
# Defaults for KCC abfs-build-node-pool-ubuntu (version / locations / SA from MODULE_CONFIG).
nodePool:
  name: abfs-build-node-pool-ubuntu
  machineType: c2d-highcpu-112
  diskSizeGb: 500
  imageType: UBUNTU_CONTAINERD
  initialNodeCount: 0
  minNodeCount: 0
  maxNodeCount: 20
  workloadLabel: android-abfs-build
  workloadType: android-abfs-build

# =============================== SCHEDULING ==================================
nodeSelector:
  cloud.google.com/gke-nodepool: abfs-build-node-pool-ubuntu
  workloadLabel: android-abfs-build
tolerations:
  - key: workloadType
    operator: Equal
    value: android-abfs-build
    effect: NoSchedule
# =============================== METADATA ====================================
# -- commonLabels -- extra labels added to every object + pod (non-selector).
commonLabels: {}
# -- commonAnnotations -- annotations added to every object's metadata.
commonAnnotations: {}
# -- podAnnotations -- annotations added to every ABFS pod template.
podAnnotations: {}
# -- podLabels -- extra labels added to every ABFS pod template.
podLabels: {}

# GKE (the node pool service account authenticates to Artifact Registry).
imagePullSecrets: []

# -- priorityClassName -- optional PriorityClass for pods.
priorityClassName: ""

# --- CASFS container image ----------------------------------------------------
image:
  # -- image.repository -- container image repository (no tag/digest).
  repository: europe-docker.pkg.dev/abfs-binaries/abfs-containers-alpha/abfs-alpha
  # -- image.tag -- image tag; empty falls back to Chart.appVersion.
  tag: "0.1.14"
  # -- image.digest -- optional immutable digest ("sha256:..."); pins the image
  # and overrides tag. Recommended for production.
  digest: ""
  # -- image.pullPolicy -- IfNotPresent | Always | Never.
  pullPolicy: IfNotPresent

# Compile casfs from source on each Ubuntu build node (same DaemonSet pattern as
# abfs-service-module on the data pool). Targeting uses nodePool labels/taints.
casfs:
  provider: daemonset
  daemonset:
    # casfs-kmod package version. The source tarball is <sourceUrl>/casfs-<version>.tar.gz.
    version: "0.1.14"
    image: "gcr.io/google.com/cloudsdktool/google-cloud-cli:slim"
    imagePullPolicy: IfNotPresent
    sourceUrl: "gs://cos-localmirror/distfiles"
    # Prebuilt package tried before the source build. Package name is
    # casfs-kmod-<kernel>_<version> in this Artifact Registry apt repository.
    aptProject: abfs-binaries
    aptLocation: us
    aptRepository: abfs-apt-alpha-public
    script: ""
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 1Gi
    # -- casfs.daemonset.nodeSelector -- where the loader runs
    # (empty = the global nodeSelector).
    nodeSelector: {}
    # -- casfs.daemonset.tolerations -- loader tolerations
    # (empty = the global tolerations).
    tolerations: []
config: {}
