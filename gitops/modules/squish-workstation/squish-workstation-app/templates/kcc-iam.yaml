#
# Workstation VM service account and its IAM bindings.
# The license secret and Artifact Registry bindings are scoped to those resources, so Config Connector never needs
# resourcemanager.projects.setIamPolicy for them (no Terraform change for this module).
# Project-level bindings (roles/logging.logWriter for the VM and the squish.creators self-service roles) need
# resourcemanager.projects.setIamPolicy and are therefore opt-in (squish.kcc.projectIamBindings.enabled);
# when disabled an administrator pre-provisions them (see README).
# The service account and the VM bindings follow squish.deletionPolicy so that abandoned WorkstationConfigs and
# user workstations keep working. Creator bindings never carry it: removing a creator must revoke access.
# IAMPolicyMember spec is immutable: names include a hash of member and role so that changing
# squish.creators creates new bindings and Argo CD prunes the old ones.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: {{ .Values.squish.serviceAccountId }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    cnrm.cloud.google.com/project-id: "{{ .Values.gcpProjectId }}"
    cnrm.cloud.google.com/deletion-policy: {{ .Values.squish.deletionPolicy | quote }}
  labels:
    {{- include "squish-workstation-app.labels" . | nindent 4 }}
spec:
  displayName: "Squish Cloud Workstation VM"
  description: "Runs Squish Cloud Workstation VMs (Horizon SDV module {{ .Values.parentModuleName }})"
---
# License key read at workstation start (/etc/workstation-startup.d/200_setting-squish.sh).
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ .Values.parentModuleName }}-vm-license-secret-accessor
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cnrm.cloud.google.com/project-id: "{{ .Values.gcpProjectId }}"
    cnrm.cloud.google.com/deletion-policy: {{ .Values.squish.deletionPolicy | quote }}
  labels:
    {{- include "squish-workstation-app.labels" . | nindent 4 }}
spec:
  memberFrom:
    serviceAccountRef:
      name: {{ .Values.squish.serviceAccountId }}
  role: roles/secretmanager.secretAccessor
  resourceRef:
    apiVersion: secretmanager.cnrm.cloud.google.com/v1beta1
    kind: SecretManagerSecret
    external: projects/{{ .Values.gcpProjectId }}/secrets/{{ .Values.squish.licenseSecretName }}
---
# Pull the Squish image from Artifact Registry when a workstation starts.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ .Values.parentModuleName }}-vm-artifactregistry-reader
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cnrm.cloud.google.com/project-id: "{{ .Values.gcpProjectId }}"
    cnrm.cloud.google.com/deletion-policy: {{ .Values.squish.deletionPolicy | quote }}
  labels:
    {{- include "squish-workstation-app.labels" . | nindent 4 }}
spec:
  memberFrom:
    serviceAccountRef:
      name: {{ .Values.squish.serviceAccountId }}
  role: roles/artifactregistry.reader
  resourceRef:
    apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
    kind: ArtifactRegistryRepository
    name: {{ .Values.squish.artifactRepository }}
{{- if .Values.squish.kcc.projectIamBindings.enabled }}
---
# Cloud Logging from the workstation VM (Horizon GNOME base: /google/scripts/cloud_logging_setup.sh).
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ .Values.parentModuleName }}-vm-log-writer
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cnrm.cloud.google.com/project-id: "{{ .Values.gcpProjectId }}"
    cnrm.cloud.google.com/deletion-policy: {{ .Values.squish.deletionPolicy | quote }}
  labels:
    {{- include "squish-workstation-app.labels" . | nindent 4 }}
spec:
  memberFrom:
    serviceAccountRef:
      name: {{ .Values.squish.serviceAccountId }}
  role: roles/logging.logWriter
  resourceRef:
    kind: Project
    external: projects/{{ .Values.gcpProjectId }}
{{- range $member := .Values.squish.creators }}
{{- range $role := list "roles/workstations.workstationCreator" "roles/workstations.operationViewer" }}
---
# Self-service: {{ $member }} may create (and then use) their own workstations.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: {{ $.Values.parentModuleName }}-creator-{{ printf "%s|%s" $member $role | sha256sum | trunc 12 }}
  namespace: {{ $.Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cnrm.cloud.google.com/project-id: "{{ $.Values.gcpProjectId }}"
  labels:
    {{- include "squish-workstation-app.labels" $ | nindent 4 }}
spec:
  member: {{ $member | quote }}
  role: {{ $role }}
  resourceRef:
    kind: Project
    external: projects/{{ $.Values.gcpProjectId }}
{{- end }}
{{- end }}
{{- end }}
