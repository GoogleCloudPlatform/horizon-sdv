# Docker repository for the Squish workstation image (built and pushed by squish-workstation-init).
# Follows squish.deletionPolicy (default abandon: the built image survives a module disable/re-enable).
apiVersion: artifactregistry.cnrm.cloud.google.com/v1beta1
kind: ArtifactRegistryRepository
metadata:
  name: {{ .Values.squish.artifactRepository }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    cnrm.cloud.google.com/project-id: "{{ .Values.gcpProjectId }}"
    cnrm.cloud.google.com/deletion-policy: {{ .Values.squish.deletionPolicy | quote }}
  labels:
    {{- include "squish-workstation-app.labels" . | nindent 4 }}
spec:
  format: DOCKER
  location: {{ .Values.squish.region | quote }}
  description: "Squish Cloud Workstation images (Horizon SDV module {{ .Values.parentModuleName }})"
