# All values are set by the parent squish-workstation Application; see ../values.yaml for documentation.
# Defaults below only allow standalone `helm lint` / `helm template`.

# Namespace for the Config Connector resources.
namespace: squish-workstation-app

# GCP project ID (cnrm.cloud.google.com/project-id annotation and resource references).
gcpProjectId: ""

parentModuleName: squish-workstation

squish:
  region: ""
  network: sdv-network
  subnetwork: sdv-subnet
  clusterName: squish-workstation-cluster
  configName: squish-workstation-config
  artifactRepository: squish-workstation
  imageName: squish
  imageTag: latest
  serviceAccountId: squish-workstation-vm
  licenseSecretName: squish-license-key
  creators: []
  workstation:
    machineType: e2-standard-8
    poolSize: 1
    bootDiskSizeGB: 50
    enableNestedVirtualization: false
    disablePublicIPAddresses: false
    idleTimeout: 1200s
    runningTimeout: 43200s
    persistentDisk:
      mountPath: /home
      sizeGB: 500
      diskType: pd-balanced
      reclaimPolicy: RETAIN
  deletionPolicy: abandon
  build:
    baseImage: ""
