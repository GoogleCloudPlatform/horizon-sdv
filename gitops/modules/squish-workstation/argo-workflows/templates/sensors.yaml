# Argo Events Sensors for squish-workstation-init and squish-workstation-execute
# (EventSource `webhook`, event `workflow-dispatch`, filtered by body.workflowTemplateName).
# Parameter indexes (spec.arguments.parameters.N) follow the WorkflowTemplate argument order.
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-{{ .Values.parentModuleName }}-init
  namespace: {{ .Values.eventsNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - "{{ .Values.parentModuleName }}-init"
  triggers:
    - template:
        name: submit-init
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: webhook-{{ .Values.parentModuleName }}-init-
                namespace: {{ .Values.workflowNamespace }}
              spec:
                workflowTemplateRef:
                  name: {{ .Values.parentModuleName }}-init
                arguments:
                  parameters:
                    - name: horizonSubmittedFrom
                    - name: baseImage
                    - name: imageTag
                    - name: dryRun
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.baseImage
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.imageTag
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.dryRun
              dest: spec.arguments.parameters.3.value
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-{{ .Values.parentModuleName }}-execute
  namespace: {{ .Values.eventsNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - "{{ .Values.parentModuleName }}-execute"
  triggers:
    - template:
        name: submit-execute
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: webhook-{{ .Values.parentModuleName }}-execute-
                namespace: {{ .Values.workflowNamespace }}
              spec:
                workflowTemplateRef:
                  name: {{ .Values.parentModuleName }}-execute
                arguments:
                  parameters:
                    - name: horizonSubmittedFrom
                    - name: workstationId
                    - name: verifySquish
                    - name: deleteWorkstation
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.workstationId
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.verifySquish
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.deleteWorkstation
              dest: spec.arguments.parameters.3.value
