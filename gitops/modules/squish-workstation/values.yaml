# Module name (injected by Module Manager when enabling). Used to derive child Application names.
moduleName: ""

# Namespace where Module Manager runs.
moduleManagerNamespace: module-manager

# ArgoCD namespace and project for child applications (passed by Module Manager when enabling).
argocd:
  namespace: argocd
  project: horizon-sdv

# Source repository URL and revision (passed by Module Manager). Also used as the
# git source for the Squish image build in the squish-workstation-init workflow.
repo:
  url: ""
  revision: HEAD

# Namespace for the Config Connector resources (WorkstationCluster, WorkstationConfig, IAM, Artifact Registry)
# and the Developer Portal overview service.
appNamespace: squish-workstation-app
overviewServiceName: mod-squish-workstation-overview
overviewNamespace: squish-workstation-app

# Environment config injected by Module Manager (projectID, region, namespacePrefix, scm.authMethod, nginx, ...).
config: {}

# Soft feature flags injected by Module Manager (none used by this module).
softFeaturesEnabled: {}

# Squish Cloud Workstation settings. Edit these to tune the deployment.
squish:
  # GCP region for the Workstation cluster/config and the Artifact Registry repository.
  # Empty uses config.region (the Horizon platform region).
  region: ""

  # VPC network and subnetwork for the Workstation cluster. Defaults match the Horizon platform network
  # created by Terraform (terraform/env/main.tf: sdv_network / sdv_subnetwork). config.network /
  # config.subnetwork take precedence if Module Manager ever injects them.
  network: sdv-network
  subnetwork: sdv-subnet

  # GCP resource IDs. The cluster name must not clash with the Jenkins-managed sdv-cloud-ws-cluster.
  clusterName: squish-workstation-cluster
  configName: squish-workstation-config
  # Artifact Registry repository (DOCKER) that receives the Squish image built by squish-workstation-init.
  artifactRepository: squish-workstation
  imageName: squish
  imageTag: latest

  # Workstation VM service account (account ID, 6-30 characters).
  serviceAccountId: squish-workstation-vm

  # Secret Manager secret holding the Squish license key. Must exist before squish-workstation-init runs.
  # Read at image build time (installer) and at workstation start (~/.squish-license).
  licenseSecretName: squish-license-key

  # Principals allowed to create their own Squish workstations (granted project-wide
  # roles/workstations.workstationCreator and roles/workstations.operationViewer via Config Connector when
  # squish.kcc.projectIamBindings.enabled is true; otherwise pre-provisioned by an administrator).
  # Creators are automatically granted roles/workstations.user on workstations they create.
  # Example: ["group:qa-team@example.com", "user:alice@example.com"]
  creators: []

  workstation:
    machineType: e2-standard-8
    # Number of pre-started VMs kept ready for fast startup (billed while idle).
    poolSize: 1
    bootDiskSizeGB: 50
    enableNestedVirtualization: false
    disablePublicIPAddresses: false
    idleTimeout: 1200s
    runningTimeout: 43200s
    persistentDisk:
      mountPath: /home
      sizeGB: 500
      diskType: pd-balanced
      # RETAIN keeps user home disks when a workstation is deleted.
      reclaimPolicy: RETAIN

  # Config Connector deletion policy for the Artifact Registry repository, workstation VM service account and its
  # IAM bindings, WorkstationCluster and WorkstationConfig. "abandon" keeps them (and users' workstations/disks) in
  # GCP when the module is disabled (no data loss), so abandoned workstations keep their service account; clean up
  # manually with gcloud. Set to "delete" to remove them together with the module. squish.creators bindings are
  # always deleted when removed.
  deletionPolicy: abandon

  # Config Connector options.
  kcc:
    # Project-level IAMPolicyMembers (roles/logging.logWriter for the workstation VM service account and the
    # squish.creators roles). Off by default: Config Connector runs in cluster mode, and granting its service account
    # roles/resourcemanager.projectIamAdmin would let any chart create arbitrary project IAM bindings. When false,
    # an administrator pre-provisions these bindings (see README "Prerequisites").
    projectIamBindings:
      enabled: false

  build:
    # Base image for the Squish layer (Horizon GNOME desktop). Empty uses
    # <region>-docker.pkg.dev/<projectID>/horizon-sdv/cloud-ws-images/horizon-gnome:latest, which is published by
    # the Jenkins job "Cloud Workstations > Workstation Images > Horizon GNOME" (or the image chain job).
    baseImage: ""
