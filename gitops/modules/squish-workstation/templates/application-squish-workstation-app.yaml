# Child Application: Config Connector resources for the Squish Cloud Workstation
# (Artifact Registry repository, workstation service account, IAM, WorkstationCluster, WorkstationConfig).
# No HTTPRoute: workstations are opened through the Cloud Workstations URL, not the GKE Gateway.
{{- include "squish-workstation.requireMainEnv" . }}
{{- $config := .Values.config | default dict }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-squish-workstation-app
  namespace: {{ $config.namespacePrefix }}{{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.moduleName }}
    horizon-sdv.io/module: {{ .Values.moduleName }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $config.namespacePrefix }}{{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/squish-workstation/squish-workstation-app
    helm:
      values: |
        namespace: {{ .Values.appNamespace }}
        gcpProjectId: {{ $config.projectID | default "" | quote }}
        parentModuleName: {{ .Values.moduleName | quote }}
        squish:
{{ include "squish-workstation.settings" . | indent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.appNamespace }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
