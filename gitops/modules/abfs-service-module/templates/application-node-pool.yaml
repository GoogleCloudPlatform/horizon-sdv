# Child Application for the ABFS node pools. Separate from the licence-gated
# workloads so the pools can exist before licence activation.

{{- if not (default false .Values.config.isSubEnvironment) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-node-pool
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.moduleName }}
    horizon-sdv.io/module: {{ .Values.moduleName }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  annotations:
    # Negative wave so the pool is reconciled before the data-plane Application,
    # which is where the pods that must land on it are rendered.
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/abfs-service-module/node-pool
    helm:
      values: |
        namespace: {{ .Values.abfsNamespace }}
        parentModuleName: {{ .Values.moduleName | quote }}
        gcpProjectId: {{ .Values.config.projectID | quote }}
        clusterName: {{ .Values.config.clusterName | default "sdv-cluster" | quote }}
        location: {{ .Values.config.region | quote }}
        releaseChannel: {{ .Values.config.releaseChannel | default "" | quote }}
        nodeLocations:
{{ .Values.config.nodeLocations | default list | toYaml | nindent 10 }}
        license:
          secretNamespace: {{ .Values.config.namespacePrefix }}horizon
          secretName: abfs-license
          metadataKey: abfs-license
          statusConfigMapName: abfs-license-metadata-status
          workflowsNamespace: {{ .Values.config.namespacePrefix }}workflows
          jobServiceAccountName: workflow-executor-elevated
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.abfsNamespace }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Keep PostSync-injected abfs-license on the CR when Helm lookup is empty.
      - RespectIgnoreDifferences=true
    automated:
      # prune deletes the ContainerNodePool — and with it the GCP node pool —
      # when the module is disabled and the Application is removed.
      prune: true
      # Recreate pools when licence metadata changes.
      selfHeal: true
  # Preserve injected licence metadata and Config Connector status during sync.
  ignoreDifferences:
    - group: container.cnrm.cloud.google.com
      kind: ContainerNodePool
      name: abfs-data-server-node-pool
      jsonPointers:
        - /spec/nodeConfig/metadata/abfs-license
        - /metadata/annotations/cnrm.cloud.google.com~1state-into-spec
        - /status
      jqPathExpressions:
        - .spec.nodeConfig.metadata["abfs-license"]
        - .metadata.annotations["cnrm.cloud.google.com/state-into-spec"]
        - .status
    - group: container.cnrm.cloud.google.com
      kind: ContainerNodePool
      name: abfs-data-uploader-node-pool
      jsonPointers:
        - /spec/nodeConfig/metadata/abfs-license
        - /metadata/annotations/cnrm.cloud.google.com~1state-into-spec
        - /status
      jqPathExpressions:
        - .spec.nodeConfig.metadata["abfs-license"]
        - .metadata.annotations["cnrm.cloud.google.com/state-into-spec"]
        - .status
{{- end }}
