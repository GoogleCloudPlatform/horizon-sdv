# Build the git tree the pusher-config Job stores in the ABFS ref "config".
# Prints the tree hash. The Job and the uploader startup check both call this
# so the two hashes are comparable.


apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-data-plane
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.moduleName }}
    horizon-sdv.io/module: {{ .Values.moduleName }}
    horizon-sdv.io/app-role: child
    # false hides the ABFS Data Plane tile. The Application still syncs.
    horizon-sdv.io/expose: {{ .Values.dataPlane.expose | quote }}
    horizon-sdv.io/module-manager-managed: "true"
  annotations:
    horizon-sdv.io/portal-url: "/abfs"
    horizon-sdv.io/portal-title: "ABFS Data Plane"
    horizon-sdv.io/portal-id: abfs-data-plane
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/abfs-service-module/abfs
    helm:
      values: |
        namespace: {{ .Values.abfsNamespace }}
        gcpProjectId: {{ .Values.config.projectID | quote }}
        parentModuleName: {{ .Values.moduleName | quote }}
        licensed: {{ .Values.licensed | default false }}
        pusher:
          uploaderConfigNamespace: {{ .Values.config.namespacePrefix }}horizon
          uploaderConfigMapName: abfs-uploader-config
        license:
          autoDetect: {{ if and .Values.license (kindIs "map" .Values.license) (hasKey .Values.license "autoDetect") }}{{ .Values.license.autoDetect }}{{ else }}true{{ end }}
          secretNamespace: {{ .Values.config.namespacePrefix }}horizon
          secretName: abfs-license
          validation:
            enabled: {{ if and .Values.license (kindIs "map" .Values.license) .Values.license.validation (hasKey .Values.license.validation "enabled") }}{{ .Values.license.validation.enabled }}{{ else }}true{{ end }}
            namespace: {{ .Values.abfsNamespace }}
            serviceAccountName: {{ if and .Values.license (kindIs "map" .Values.license) .Values.license.validation }}{{ .Values.license.validation.serviceAccountName | default "abfs-license-validator" }}{{ else }}abfs-license-validator{{ end }}
            image: {{ if and .Values.license (kindIs "map" .Values.license) .Values.license.validation }}{{ .Values.license.validation.image | default "gcr.io/google.com/cloudsdktool/google-cloud-cli:debian_component_based" | quote }}{{ else }}"gcr.io/google.com/cloudsdktool/google-cloud-cli:debian_component_based"{{ end }}
        ui:
          enabled: {{ if and .Values.ui (kindIs "map" .Values.ui) (hasKey .Values.ui "enabled") }}{{ .Values.ui.enabled }}{{ else }}false{{ end }}
        tests:
          enabled: {{ if and .Values.tests (kindIs "map" .Values.tests) (hasKey .Values.tests "enabled") }}{{ .Values.tests.enabled }}{{ else }}true{{ end }}
        vpa:
          enabled: {{ if and .Values.vpa (kindIs "map" .Values.vpa) (hasKey .Values.vpa "enabled") }}{{ .Values.vpa.enabled }}{{ else }}true{{ end }}
          updateMode: {{ if and .Values.vpa (kindIs "map" .Values.vpa) .Values.vpa.updateMode }}{{ .Values.vpa.updateMode | quote }}{{ else }}"Off"{{ end }}
        kcc:
          iamBindings:
            enabled: true
          secretManager:
            enabled: false
        config:
{{ .Values.config | toYaml | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.abfsNamespace }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
  # Job controller mutates selector/status; ignore so Completed Jobs do not flap
  # OutOfSync. TTL was removed for the same reason (Missing after GC).
  ignoreDifferences:
    - group: batch
      kind: Job
      name: abfs-pusher-config
      jsonPointers:
        - /status
        - /spec/selector
        - /spec/template/metadata/labels
    - group: batch
      kind: Job
      name: abfs-license-validate
      jsonPointers:
        - /status
        - /spec/selector
        - /spec/template/metadata/labels
    - group: batch
      kind: Job
      name: abfs-server-test-connection
      jsonPointers:
        - /status
        - /spec/selector
        - /spec/template/metadata/labels
