# Module name (injected by Module Manager when enabling). Used to derive child Application names.

moduleName: "abfs-service-module"

# Namespace where Module Manager runs.
moduleManagerNamespace: module-manager

# ArgoCD namespace and project for the child app-of-apps Application.
argocd:
  namespace: argocd
  project: horizon-sdv

# Repo URL and revision for the child Application (passed by Module Manager).
repo:
  url: ""
  revision: HEAD

# Namespaces
abfsNamespace: abfs
overviewServiceName: mod-abfs-service-module-overview
overviewNamespace: abfs
overview:
  # Read-only HTTP service that injects live Kubernetes readiness into the
  # static overview. No Secret access.
  image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a

# abfs-data overview Service that serves /license-status.
dataOverview:
  serviceName: mod-abfs-data-overview
  namespace: abfs-data-overview

# Desired mobilisation state. The data-plane PreSync validator still
# blocks sync unless Secret abfs-license exists and data.license is non-empty;
# this boolean alone is not treated as proof of a valid licence.
licensed: true
license:
  autoDetect: true
  validation:
    enabled: true
    namespace: abfs
    serviceAccountName: abfs-license-validator
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:debian_component_based

# VPA objects render when licensed; requires GKE vertical_pod_autoscaling addon.
vpa:
  enabled: true
  updateMode: "Off"

# the ABFS UI is not functional yet (it should show statistics for
# already executed builds). Hide the ABFS Data Plane portal tile and do not
# render abfs-ui until that is fixed. Set both back to true to restore them.
dataPlane:
  expose: false
# mobilise UI + connectivity test with licensed workloads.
ui:
  enabled: false
tests:
  enabled: true

# Environment config injected dynamically by Module Manager (projectID, region, zone, namespacePrefix, etc.).
config: {}
