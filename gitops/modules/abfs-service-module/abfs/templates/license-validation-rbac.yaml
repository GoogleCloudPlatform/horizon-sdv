{{- if and .Values.licensed .Values.license.validation.enabled }}
# Least-privilege RBAC for the PreSync licence validator. Retained across syncs
# (BeforeHookCreation only) so the Job at wave -10 can assume the SA.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.license.validation.serviceAccountName }}
  namespace: {{ .Values.license.validation.namespace }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: license-validation
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-20"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-license-validate-secret
  namespace: {{ .Values.license.secretNamespace }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: license-validation
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-20"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.license.secretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-license-validate-secret
  namespace: {{ .Values.license.secretNamespace }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: license-validation
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-20"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-license-validate-secret
subjects:
  - kind: ServiceAccount
    name: {{ .Values.license.validation.serviceAccountName }}
    namespace: {{ .Values.license.validation.namespace }}
{{- end }}
