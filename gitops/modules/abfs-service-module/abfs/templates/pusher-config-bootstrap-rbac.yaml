{{- if include "abfs.licensed" . }}
# PreSync RBAC for abfs-pusher-config-presync.
#
# Do NOT create a custom ServiceAccount as a PreSync hook: the Job pod is
# rejected before start if the SA is missing, and PreSync runs before Sync so a
# same-app SA is never ready on the first (or any) PreSync. Use the namespace
# default SA (always present) and only create Role + RoleBinding.
# Wave -10 before the Job at -5. BeforeHookCreation only so Role survives.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-pusher-config-bootstrap
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pusher-config
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-pusher-config-bootstrap
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pusher-config
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-10"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-pusher-config-bootstrap
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.namespace }}
{{- end }}
