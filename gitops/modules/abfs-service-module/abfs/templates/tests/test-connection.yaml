{{- if and (include "abfs.licensed" .) .Values.tests.enabled .Values.server.enabled }}
# Connectivity check for ABFS Server confirms the server gRPC port is reachable.
# Rendered as an Argo PostSync Job (GitOps runs it on sync) and keeps the helm
# test annotation for `helm test` when used outside Argo.
apiVersion: batch/v1
kind: Job
metadata:
  name: abfs-server-test-connection
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "30"
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.tests.activeDeadlineSeconds | default 180 }}
  template:
    metadata:
      labels:
        {{- include "abfs.labels" . | nindent 8 }}
        app.kubernetes.io/component: test
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: test-connection
          image: {{ include "abfs.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.restrictedSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              HOST="{{ include "abfs.server.name" . }}"
              PORT="{{ .Values.server.service.port }}"
              echo "checking ABFS server $HOST:$PORT"
              for i in $(seq 1 30); do
                if (exec 3<>/dev/tcp/$HOST/$PORT) 2>/dev/null; then
                  echo "OK: server reachable"; exit 0
                fi
                echo "...not reachable yet ($i)"; sleep 2
              done
              echo "FAIL: server not reachable after 60s"; exit 1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
{{- end }}
