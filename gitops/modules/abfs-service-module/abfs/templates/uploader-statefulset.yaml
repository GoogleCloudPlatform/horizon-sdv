{{- if include "abfs.licensed" . }}
# Gerrit uploaders. StatefulSet gives stable pod identities
# (<namePrefix>-<ordinal>) that match the pusher-config pusher names, and per-pod
# PVCs provide each uploader's data disk (the PD CSI driver handles format/mount).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "abfs.uploader.name" . }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.uploader.selectorLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "abfs.uploader.name" . }}
  replicas: {{ .Values.uploader.count }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  podManagementPolicy: Parallel
  # Default K8s behaviour retains volumeClaimTemplates PVCs after STS delete,
  # so disks survived module disable. Map deletePvcWhenDisabled / WhenScaled.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ if .Values.uploader.dataDisk.deletePvcWhenDisabled }}Delete{{ else }}Retain{{ end }}
    whenScaled: {{ if .Values.uploader.dataDisk.deletePvcWhenScaled }}Delete{{ else }}Retain{{ end }}
  selector:
    matchLabels:
      {{- include "abfs.uploader.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "abfs.labels" . | nindent 8 }}
        {{- include "abfs.uploader.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.uploader.preStartHooks .Values.podAnnotations }}
      annotations:
        {{- if .Values.uploader.preStartHooks }}
        checksum/pre-start-hooks: {{ .Values.uploader.preStartHooks | toYaml | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.uploader }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      hostPID: {{ .Values.hostPID }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uploader.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uploader.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.casfs.requireReady }}
        # Gate on the casfs kernel module being loaded on the node first.
        {{- include "abfs.waitForCasfsInit" . | nindent 8 }}
        {{- end }}
        # Read the active row, then pod 0 runs a copy of Job abfs-pusher-config.
        # That Job exits 0 when the row matches the ABFS ref and writes the ref
        # when it does not. The ConfigMap is in another namespace, so kubectl
        # loads it.
        - name: select-uploader-config
          image: {{ .Values.license.validation.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- with .Values.restrictedSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: UPLOADER_CONFIG_NAMESPACE
              value: {{ .Values.pusher.uploaderConfigNamespace | quote }}
            - name: UPLOADER_CONFIGMAP
              value: {{ .Values.pusher.uploaderConfigMapName | quote }}
            - name: PUSHER_CONFIG
              value: /etc/pusher-config/default
            - name: TABLE_PATH
              value: /tmp/table.yaml
            - name: FALLBACK_TABLE_PATH
              value: /etc/pusher-seed/fallback-table.yaml
            - name: SEED_OUT
              value: /seed/repos.yaml
            - name: SOURCE_PATH
              value: /tmp/pusher-config-job.json
            - name: OUTPUT_PATH
              value: /tmp/pusher-config-sync-job.json
            - name: SYNC_JOB_NAME
              value: abfs-pusher-config-sync
          command: ["/bin/bash", "-euo", "pipefail", "-c"]
          args:
            - |
              if ! command -v kubectl >/dev/null 2>&1; then
                echo "Installing kubectl (gcloud components)..."
                gcloud components install kubectl --quiet
              fi
              if ! python3 -c 'import yaml' >/dev/null 2>&1; then
                python3 -m pip install --quiet --break-system-packages pyyaml
              fi
              # A missing ConfigMap (abfs-data disabled) must not block startup:
              # leave the table empty and the script uses the fallback row.
              if ! kubectl get configmap "${UPLOADER_CONFIGMAP}" \
                -n "${UPLOADER_CONFIG_NAMESPACE}" \
                -o jsonpath='{.data.table}' > "${TABLE_PATH}"; then
                echo "WARNING: cannot read ConfigMap ${UPLOADER_CONFIG_NAMESPACE}/${UPLOADER_CONFIGMAP}; using the fallback row" >&2
                : > "${TABLE_PATH}"
              fi
              python3 /etc/pusher-seed/modify_pusher_config.py
              if [[ "$(hostname)" != "{{ include "abfs.uploader.name" . }}-0" ]]; then
                exit 0
              fi
              kubectl get job abfs-pusher-config -o json > "${SOURCE_PATH}"
              python3 /etc/pusher-seed/recreate-pusher-job.py
              kubectl delete job "${SYNC_JOB_NAME}" --ignore-not-found --wait=true
              kubectl create -f "${OUTPUT_PATH}"
              echo "Waiting for ${SYNC_JOB_NAME}"
              complete=""
              for _ in $(seq 1 360); do
                complete="$(kubectl get job "${SYNC_JOB_NAME}" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' || true)"
                failed="$(kubectl get job "${SYNC_JOB_NAME}" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' || true)"
                if [[ "${complete}" == "True" ]]; then
                  exit 0
                fi
                if [[ "${failed}" == "True" ]]; then
                  kubectl logs "job/${SYNC_JOB_NAME}" --tail=100 || true
                  echo "ERROR: ${SYNC_JOB_NAME} failed" >&2
                  exit 1
                fi
                sleep 15
              done
              echo "ERROR: timed out waiting for ${SYNC_JOB_NAME}" >&2
              exit 1
          volumeMounts:
            - name: pusher-config
              mountPath: /etc/pusher-config
              readOnly: true
            - name: pusher-seed-script
              mountPath: /etc/pusher-seed
              readOnly: true
            - name: uploader-seed
              mountPath: /seed
        # Don't start an uploader until the ABFS server is reachable AND the
        # ref tree matches the active row. Plain ABFS client, no casfs mount.
        - name: wait-for-server
          image: {{ include "abfs.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.restrictedSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: HOME
              value: /tmp
            - name: PUSHER_CONFIG
              value: /etc/pusher-config/default
            - name: SEED_REPOS
              value: /seed/repos.yaml
            - name: CONCURRENT_UPLOADS
              value: {{ .Values.pusher.concurrentUploads | quote }}
            - name: GIT_EMAIL
              value: {{ include "abfs.runtimeServiceAccount" . | default "abfs-bootstrap@localhost" | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -eu
              SRV="{{ include "abfs.server.name" . }}:{{ .Values.server.service.port }}"
              echo "waiting for ABFS server $SRV"
              until (exec 3<>/dev/tcp/{{ include "abfs.server.name" . }}/{{ .Values.server.service.port }}) 2>/dev/null; do
                echo "...server not reachable yet"; sleep 5;
              done
              CLIENT="abfs --remote-servers $SRV --tunnel-ports 0 {{ include "abfs.clientFlags" . }}"
              $CLIENT init
              updated_ref="$(sh /etc/pusher-seed/build-pusher-tree.sh /tmp/workspace)"
              echo "updated_ref: ${updated_ref}"
              cat "${SEED_REPOS}"
              echo "waiting for ABFS ref config to match ${updated_ref}"
              for _ in $(seq 1 40); do
                current_ref="$(echo config | $CLIENT test-client get-ref -p abfs-meta -s default-server 2>/dev/null || true)"
                echo "current ref: ${current_ref:-<empty>}"
                current_ref_hash="$(printf '%s\n' "${current_ref}" | awk 'NR==1 { print $1 }')"
                if [[ -n "${current_ref_hash}" && "${current_ref_hash}" == "${updated_ref}" ]]; then
                  echo "pusher-config ref matches the active row"
                  exit 0
                fi
                echo "...pusher-config ref differs"; sleep 15;
              done
              echo "ERROR: timed out waiting for the ABFS ref to match the active row" >&2
              exit 1
          volumeMounts:
            - name: pusher-config
              mountPath: /etc/pusher-config
              readOnly: true
            - name: pusher-seed-script
              mountPath: /etc/pusher-seed
              readOnly: true
            - name: uploader-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: abfs-uploader
          image: {{ include "abfs.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Image entrypoint reads RUN_MODE; args are the uploader ABFS command.
          args:
            - --tunnel-ports
            - "0"
            - --remote-servers
            - {{ include "abfs.server.name" . }}:{{ .Values.server.service.port }}
            - --lfs={{ .Values.gitLfsEnabled }}
            {{- include "abfs.clientArgsYaml" . | nindent 12 }}
            {{- range .Values.extraParams }}
            - {{ . | quote }}
            {{- end }}
            - git-pusher
            - --config
            - config:git-pusher/default
            - --storage-path
            - {{ .Values.uploader.dataDisk.mountPath }}
            {{- range .Values.uploader.extraParams }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "abfs.gomaxprocsEnv" . | nindent 12 }}
            - name: RUN_MODE
              value: "uploader"
            - name: NEEDS_GIT
              value: "true"
            - name: GIT_LFS_ENABLED
              value: {{ .Values.gitLfsEnabled | quote }}
            - name: HOME
              value: "/home/abfs-server"
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "abfs-uploader"
            {{- end }}
          ports:
            - name: pusher
              containerPort: {{ .Values.pusher.defaults.port }}
          # --privileged --cap-add=all to use the casfs mount (module loaded on the
          # node per casfs.provider — see docs/02 §1b).
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.uploader.resources | nindent 12 }}
          {{- if .Values.uploader.probes.readiness.enabled }}
          readinessProbe:
            {{- include "abfs.probe" (dict "cfg" .Values.uploader.probes.readiness "port" .Values.pusher.defaults.port) | nindent 12 }}
          {{- end }}
          {{- if .Values.uploader.probes.liveness.enabled }}
          livenessProbe:
            {{- include "abfs.probe" (dict "cfg" .Values.uploader.probes.liveness "port" .Values.pusher.defaults.port) | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: abfs-server-storage
              mountPath: {{ .Values.uploader.dataDisk.mountPath }}
            # Writable HOME ($HOME=/home/abfs-server): git-cookie-authdaemon + abfs
            # config/cache write here, and the dir is not present in the image.
            - name: home
              mountPath: /home/abfs-server
            {{- if .Values.uploader.preStartHooks }}
            - name: pre-start-hooks
              mountPath: /etc/abfs/pre-start.d
              readOnly: true
            {{- end }}
      volumes:
        - name: home
          emptyDir: {}
        - name: pusher-config
          configMap:
            name: abfs-pusher-config
            items:
              - key: default
                path: default
        - name: pusher-seed-script
          configMap:
            name: abfs-pusher-config
            items:
              - key: modify_pusher_config.py
                path: modify_pusher_config.py
              - key: build-pusher-tree.sh
                path: build-pusher-tree.sh
              - key: fallback-table.yaml
                path: fallback-table.yaml
              - key: recreate-pusher-job.py
                path: recreate-pusher-job.py
        - name: uploader-seed
          emptyDir: {}
        {{- if .Values.uploader.preStartHooks }}
        - name: pre-start-hooks
          configMap:
            name: abfs-uploader-pre-start-hooks
            defaultMode: 0755
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        # Stable PVC name for each uploader's data disk.
        name: abfs-server-storage
        # volumeClaimTemplates are immutable, so use only the stable selector label subset
        # here — version/chart labels from abfs.labels (helm.sh/chart, app.../version)
        # cannot change on an existing StatefulSet.
        labels:
          {{- include "abfs.uploader.selectorLabels" . | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.uploader.dataDisk.storageClass }}
        resources:
          requests:
            storage: {{ .Values.uploader.dataDisk.size }}
{{- end }}
