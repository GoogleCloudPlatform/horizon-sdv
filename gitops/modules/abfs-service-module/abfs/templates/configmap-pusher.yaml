# Pusher configuration consumed by the bootstrap Job. The bootstrap Job copies the
# "default" key to git-pusher/default and pushes it into ABFS.
#
# The pusher names MUST equal the uploader pod hostnames (<namePrefix>-<ordinal>).
apiVersion: v1
kind: ConfigMap
metadata:
  name: abfs-pusher-config
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.uploader.selectorLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  default: |
    name: default

    pushers-count: {{ .Values.uploader.count }}

    defaults:
      port: {{ .Values.pusher.defaults.port }}
      max-remote-pushes: {{ .Values.pusher.defaults.maxRemotePushes }}
      max-projects-syncs: {{ .Values.pusher.defaults.maxProjectsSyncs }}

    pushers:
    {{- range $i := until (int .Values.uploader.count) }}
      - name: {{ $.Values.uploader.namePrefix }}-{{ $i }}
        workers: {{ $.Values.pusher.workers }}
    {{- end }}
  # Same shape as the abfs-data uploader-config table, one active row. Read only
  # when that table is missing or invalid.
  fallback-table.yaml: |
    - name: Fallback
      repo:
        url: {{ .Values.pusher.fallbackRepo.url | quote }}
        branch: {{ .Values.pusher.fallbackRepo.branch | quote }}
        file: {{ .Values.pusher.fallbackRepo.file | quote }}
        fetch-ref-spec:
        {{- range .Values.pusher.fallbackRepo.fetchRefSpec }}
          - {{ . | quote }}
        {{- end }}
      active: true
      synced: true
  modify_pusher_config.py: |
{{ .Files.Get "scripts/modify_pusher_config.py" | nindent 4 }}
  build-pusher-tree.sh: |
{{ .Files.Get "scripts/build_pusher_tree.sh" | nindent 4 }}
  recreate-pusher-job.py: |
{{ .Files.Get "scripts/recreate_pusher_job.py" | nindent 4 }}
