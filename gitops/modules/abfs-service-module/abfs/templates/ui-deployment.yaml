{{- if and (include "abfs.licensed" .) .Values.ui.enabled }}
# ABFS UI Deployment. Reverse-proxies to each uploader and talks to the server.
# Sync-wave 25: after server (5), pusher bootstrap (10), and uploaders (20).
# Init waits for server gRPC + every uploader proxy port so do_ui does not
# CrashLoop while backends are still starting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "abfs.ui.name" . }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    {{- include "abfs.ui.selectorLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.ui.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "abfs.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "abfs.labels" . | nindent 8 }}
        {{- include "abfs.ui.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.ui }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.casfs.requireReady }}
        {{- include "abfs.waitForCasfsInit" . | nindent 8 }}
        {{- end }}
        - name: wait-for-backends
          image: {{ include "abfs.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.restrictedSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              wait_tcp() {
                local host="$1" port="$2" label="$3"
                echo "waiting for ${label} ${host}:${port}"
                until (exec 3<>/dev/tcp/"${host}"/"${port}") 2>/dev/null; do
                  echo "...${label} not reachable yet"; sleep 5
                done
                echo "${label} reachable"
              }
              wait_tcp "{{ include "abfs.server.name" . }}" "{{ .Values.server.service.port }}" "abfs-server"
              {{- $prefix := .Values.uploader.namePrefix }}
              {{- $port := .Values.pusher.defaults.port }}
              {{- range $i := until (int .Values.uploader.count) }}
              wait_tcp "{{ $prefix }}-{{ $i }}.{{ $prefix }}" "{{ $port }}" "uploader-{{ $i }}"
              {{- end }}
              echo "server and all uploaders reachable; starting UI"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      hostPID: {{ .Values.hostPID }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uploader.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uploader.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: abfs-ui
          image: {{ include "abfs.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Bypass image do_ui: it runs `abfs --remote-servers … config` without
          # --disable-tls, so cacheman fails TLS against plaintext abfs-server
          # ("first record does not look like a TLS handshake") and never creates
          # http.socket. Same clientFlags as uploader / pusher-config.
          # cacheman here is an in-pod process (not a separate Horizon Deployment).
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              SRV="{{ include "abfs.server.name" . }}:{{ .Values.server.service.port }}"
              ARGS="--remote-servers ${SRV} --tunnel-ports 0 {{ include "abfs.clientFlags" . }}"
              echo "configuring ABFS client (plaintext) against ${SRV}"
              # shellcheck disable=SC2086
              abfs $ARGS config -w
              abfs init
              # shellcheck disable=SC2086
              abfs $ARGS cacheman run &
              if ! abfs cacheman ping -t 2m; then
                echo "cacheman ping failed; dumping tail"
                abfs cacheman tail -a || true
                exit 1
              fi
              echo "starting ui-server"
              # shellcheck disable=SC2086
              exec abfs $ARGS ui-server --port "{{ .Values.ui.port }}" -s /abfsui/browser {{- $prefix := .Values.uploader.namePrefix }}{{- $port := .Values.pusher.defaults.port }}{{- range $i := until (int .Values.uploader.count) }} --proxy "pusher{{ $i }}:{{ $prefix }}-{{ $i }}.{{ $prefix }}:{{ $port }}"{{- end }}{{- range .Values.ui.extraParams }} {{ . | quote }}{{- end }}
          env:
            {{- include "abfs.gomaxprocsEnv" . | nindent 12 }}
            - name: NEEDS_GIT
              value: "false"
            - name: HOME
              value: "/home/abfs-server"
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_SERVICE_NAME
              value: "abfs-ui"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          {{- if .Values.ui.probes.readiness.enabled }}
          readinessProbe:
            {{- include "abfs.probe" (dict "cfg" .Values.ui.probes.readiness "port" .Values.ui.port) | nindent 12 }}
          {{- end }}
          {{- if .Values.ui.probes.liveness.enabled }}
          livenessProbe:
            {{- include "abfs.probe" (dict "cfg" .Values.ui.probes.liveness "port" .Values.ui.port) | nindent 12 }}
          {{- end }}
          # Writable HOME for client config + local cacheman socket.
          volumeMounts:
            - name: home
              mountPath: /home/abfs-server
      volumes:
        - name: home
          emptyDir: {}
{{- end }}
