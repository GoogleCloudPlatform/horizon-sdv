# Build the git tree the pusher-config Job stores in the ABFS ref "config".
# Prints the tree hash. The Job and the uploader startup check both call this
# so the two hashes are comparable.


{{- if include "abfs.licensed" . }}
# Uploader pod 0 copies Job abfs-pusher-config and runs that copy on startup.
# create cannot be limited by resourceNames. Pod logs are for a failed seed.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-pusher-config-rerun
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pusher-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["abfs-pusher-config", "abfs-pusher-config-sync"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["abfs-pusher-config-sync"]
    verbs: ["delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-pusher-config-rerun
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pusher-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-pusher-config-rerun
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.uploader }}
    namespace: {{ .Values.namespace }}
{{- end }}
