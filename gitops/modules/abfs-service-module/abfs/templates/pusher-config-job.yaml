{{- if include "abfs.licensed" . }}
# Pusher-config bootstrap Job. Applied at Argo sync-wave 10 (after the server at
# wave 5, before uploaders at wave 20). Uploaders initContainers poll until the
# config ref exists. PreSync hook abfs-pusher-config-presync deletes a stale Job
# so failed bootstraps can retry. No ttlSecondsAfterFinished by default — a 1h
# TTL made Argo OutOfSync after GC even though the ABFS ref was already written.
# The uploader seeding configuration comes from the active row of
# ConfigMap abfs-uploader-config in the horizon namespace.
# The Job writes the ABFS ref only when that row differs from the stored tree.
# The same tree exits 0. Uploader startup runs a copy of this Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: abfs-pusher-config
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pusher-config
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: Replace=true
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: {{ .Values.pusher.job.backoffLimit }}
  {{- /* Do NOT default a TTL. ttlSecondsAfterFinished: 3600 deleted the Job
       after 1h → Argo Missing/OutOfSync → manual sync loop. Omit the field so
       the Completed Job stays and the app stays Synced; PreSync still deletes
       it when a real re-bootstrap is needed. */}}
  {{- with .Values.pusher.job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  {{- if .Values.pusher.job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ .Values.pusher.job.activeDeadlineSeconds }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "abfs.labels" . | nindent 8 }}
        app.kubernetes.io/component: pusher-config
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-pusher.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.serviceAccounts.uploader }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      # The bootstrap runs `abfs cacheman`, which mounts the casfs cache → hostPID + privileged.
      hostPID: {{ .Values.hostPID }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uploader.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.uploader.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Read the active uploader row before waiting for the server.
        # Uploader ConfigMap is in another namespace, so this container loads it with kubectl.
        - name: select-uploader-config
          image: {{ .Values.license.validation.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.restrictedSecurityContext | nindent 12 }}
          env:
            - name: UPLOADER_CONFIG_NAMESPACE
              value: {{ .Values.pusher.uploaderConfigNamespace | quote }}
            - name: UPLOADER_CONFIGMAP
              value: {{ .Values.pusher.uploaderConfigMapName | quote }}
            - name: PUSHER_CONFIG
              value: /etc/pusher-config/default
            - name: TABLE_PATH
              value: /tmp/table.yaml
            - name: FALLBACK_TABLE_PATH
              value: /etc/pusher-seed/fallback-table.yaml
            - name: SEED_OUT
              value: /seed/repos.yaml
          command: ["/bin/bash", "-euo", "pipefail", "-c"]
          args:
            - |
              if ! command -v kubectl >/dev/null 2>&1; then
                echo "Installing kubectl (gcloud components)..."
                gcloud components install kubectl --quiet
              fi
              if ! python3 -c 'import yaml' >/dev/null 2>&1; then
                python3 -m pip install --quiet --break-system-packages pyyaml
              fi
              # A missing ConfigMap (abfs-data disabled) must not block startup:
              # leave the table empty and the script uses the fallback row.
              if ! kubectl get configmap "${UPLOADER_CONFIGMAP}" \
                -n "${UPLOADER_CONFIG_NAMESPACE}" \
                -o jsonpath='{.data.table}' > "${TABLE_PATH}"; then
                echo "WARNING: cannot read ConfigMap ${UPLOADER_CONFIG_NAMESPACE}/${UPLOADER_CONFIGMAP}; using the fallback row" >&2
                : > "${TABLE_PATH}"
              fi
              python3 /etc/pusher-seed/modify_pusher_config.py
          volumeMounts:
            - name: pusher-config
              mountPath: /etc/pusher-config
              readOnly: true
            - name: pusher-seed-script
              mountPath: /etc/pusher-seed
              readOnly: true
            - name: uploader-seed
              mountPath: /seed
        {{- if .Values.casfs.requireReady }}
        # cacheman mounts casfs, so gate on the module being loaded on the node first.
        {{- include "abfs.waitForCasfsInit" . | nindent 8 }}
        {{- end }}
        # Wait for the ABFS server to be reachable (plain TCP check → hardened context).
        - name: wait-for-server
          image: {{ include "abfs.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.restrictedSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/bash
            - -c
            - |
              until (exec 3<>/dev/tcp/{{ include "abfs.server.name" . }}/{{ .Values.server.service.port }}) 2>/dev/null; do
                echo "waiting for ABFS server..."; sleep 5;
              done
      containers:
        - name: pusher-config
          image: {{ include "abfs.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # privileged + cap-add=all: `abfs cacheman` mounts the casfs cache.
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex
              # Use the in-cluster server endpoint.
              ARGS="--remote-servers {{ include "abfs.server.name" . }}:{{ .Values.server.service.port }} --tunnel-ports 0 {{ include "abfs.clientFlags" . }}"

              abfs $ARGS init
              # Same tree the uploader startup check builds. Equal hashes mean the
              # active row is already the ABFS ref, so this run does not write it.
              DESIRED="$(sh /etc/pusher-seed/build-pusher-tree.sh /tmp/workspace)"
              CURRENT="$(echo config | abfs $ARGS test-client get-ref -p abfs-meta -s default-server 2>/dev/null | awk 'NR==1 { print $1 }')"
              if [[ -n "${CURRENT}" && "${CURRENT}" == "${DESIRED}" ]]; then
                echo "active uploader config matches the ABFS ref; exiting"
                exit 0
              fi
              echo "active uploader config differs from the ABFS ref; writing it"

              cd /tmp/workspace
              abfs $ARGS cacheman run &
              if ! abfs cacheman ping -t 1m; then
                abfs cacheman tail -a
                exit 1
              fi
              abfs $ARGS push -r "$PWD"
              abfs cacheman wait

              # Point the ABFS ref at the tree object we just created.
              echo "$DESIRED" config | abfs $ARGS test-client put-ref -p abfs-meta -s default-server
              echo "pusher-config ref written"
              echo config | abfs $ARGS test-client get-ref -p abfs-meta -s default-server
          env:
            {{- include "abfs.gomaxprocsEnv" . | nindent 12 }}
            - name: PUSHER_CONFIG
              value: /etc/pusher-config/default
            - name: SEED_REPOS
              value: /seed/repos.yaml
            - name: CONCURRENT_UPLOADS
              value: {{ .Values.pusher.concurrentUploads | quote }}
            - name: GIT_EMAIL
              value: {{ include "abfs.runtimeServiceAccount" . | default "abfs-bootstrap@localhost" | quote }}
          volumeMounts:
            - name: pusher-config
              mountPath: /etc/pusher-config
              readOnly: true
            - name: pusher-seed-script
              mountPath: /etc/pusher-seed
              readOnly: true
            - name: uploader-seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: pusher-config
          configMap:
            name: abfs-pusher-config
            items:
              - key: default
                path: default
        - name: pusher-seed-script
          configMap:
            name: abfs-pusher-config
            items:
              - key: modify_pusher_config.py
                path: modify_pusher_config.py
              - key: build-pusher-tree.sh
                path: build-pusher-tree.sh
              - key: fallback-table.yaml
                path: fallback-table.yaml
        - name: uploader-seed
          emptyDir: {}
{{- end }}
