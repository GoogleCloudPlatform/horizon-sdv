# Secret Manager "pusher-config" secret + accessor binding (grants the ABFS runtime
# SA secretAccessor on the secret).
#
# NOTE ON GKE: the pusher-config CONTENT is rendered by the Helm chart as a
# ConfigMap that the bootstrap Job mounts directly (no Secret Manager round-trip
# needed in-cluster). This SecretManagerSecret is created for any ABFS component
# that expects the config in Secret Manager. The secret VERSION (actual data) is
# intentionally not managed here; populate it out-of-band if you rely on it,
# otherwise the chart's ConfigMap is the operative source.
#
# Replication is user-managed (not automatic/global): org policy
# constraints/gcp.resourceLocations rejects global Secret Manager secrets.
{{- if .Values.kcc.secretManager.enabled }}
{{- $secretLoc := .Values.config.storageLocation | default .Values.config.region | default "" }}
{{- if not $secretLoc }}
{{- fail "abfs pusher-config SecretManagerSecret needs config.storageLocation or config.region (user-managed replication; automatic/global is blocked by org policy)" }}
{{- end }}
---
apiVersion: secretmanager.cnrm.cloud.google.com/v1beta1
kind: SecretManagerSecret
metadata:
  name: pusher-config
  namespace: {{ .Values.namespace }}
  annotations:
    # Required in cluster-mode KCC. Without this, KCC defaults project-id to the
    # Kubernetes namespace name ("abfs") and fails with CONSUMER_INVALID on
    # projects/abfs/secrets/….
    cnrm.cloud.google.com/project-id: {{ .Values.gcpProjectId | quote }}
spec:
  replication:
    userManaged:
      replicas:
        - location: {{ $secretLoc | quote }}
---
# Grant the ABFS runtime SA access to read the secret.
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: pusher-config-accessor
  namespace: {{ .Values.namespace }}
  annotations:
    cnrm.cloud.google.com/project-id: {{ .Values.gcpProjectId | quote }}
spec:
  # Runtime SA referenced by email ({{ .Values.runtimeServiceAccountName }}) so the grant works whether
  # the SA is created by 10-* or is a pre-existing (already-licensed) SA.
  member: "serviceAccount:{{ .Values.runtimeServiceAccountName }}@{{ .Values.gcpProjectId }}.iam.gserviceaccount.com"
  role: roles/secretmanager.secretAccessor
  resourceRef:
    apiVersion: secretmanager.cnrm.cloud.google.com/v1beta1
    kind: SecretManagerSecret
    name: pusher-config
{{- end }}
