{{- if include "abfs.licensed" . }}
# Delete any previous abfs-pusher-config Job so a failed bootstrap can retry on
# the next sync (completed Jobs block re-create with the same name).
#
# Uses the namespace default SA (always exists). Custom SA cannot work for
# PreSync — see pusher-config-bootstrap-rbac.yaml. Role/RoleBinding are PreSync
# wave -10; this Job is wave -5.
apiVersion: batch/v1
kind: Job
metadata:
  name: abfs-pusher-config-presync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pusher-config
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-5"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "abfs.labels" . | nindent 8 }}
        app.kubernetes.io/component: pusher-config
    spec:
      restartPolicy: Never
      serviceAccountName: default
      automountServiceAccountToken: true
      containers:
        - name: cleanup
          # Official kubectl image is distroless — no /bin/sh. Invoke kubectl
          # as argv (do not use shell -c).
          image: {{ .Values.pusher.job.kubectlImage | default "registry.k8s.io/kubectl:v1.29.2" | quote }}
          command:
            - kubectl
            - delete
            - job
            - abfs-pusher-config
            - -n
            - {{ .Values.namespace | quote }}
            - --ignore-not-found
            - --wait=true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
{{- end }}
