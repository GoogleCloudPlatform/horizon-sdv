# Build the git tree the pusher-config Job stores in the ABFS ref "config".
# Prints the tree hash. The Job and the uploader startup check both call this
# so the two hashes are comparable.


{{- if include "abfs.licensed" . }}
# Read access for Job abfs-pusher-config. The uploader table is owned by
# abfs-data in the horizon namespace, so the uploader ServiceAccount in this
# namespace needs get on that one ConfigMap. get is enough: the seed does not
# patch the table or the synced flag.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-pusher-config-seed
  namespace: {{ .Values.pusher.uploaderConfigNamespace }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pusher-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.pusher.uploaderConfigMapName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-pusher-config-seed
  namespace: {{ .Values.pusher.uploaderConfigNamespace }}
  labels:
    {{- include "abfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: pusher-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-pusher-config-seed
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.uploader }}
    namespace: {{ .Values.namespace }}
{{- end }}
