# ABFS data-plane Helm values. Parent Application values override these defaults.

# Parent Application values override these standalone Helm defaults.

# -- namespace -- namespace the data plane reconciles into.
namespace: abfs
# -- gcpProjectId -- GCP project.
gcpProjectId: ""
# -- parentModuleName -- injected by the parent; read by no template (F9).
parentModuleName: abfs-service-module
# -- config -- Horizon environment config injected by Module Manager
# (projectID, region, namespacePrefix, networkName, subnetCidr, ...).
# Every consumer guards with `| default`, so an empty map still renders.
config: {}

# Optional Config Connector resources. IAM bindings require projectIamAdmin;
# disable them if platform IAM already grants the required roles.
kcc:
  # -- kcc.iamBindings.enabled -- render kcc/12-iam-project-roles.yaml.
  # Requires KCC SA roles/resourcemanager.projectIamAdmin (now on sbx).
  iamBindings:
    enabled: true
  # -- kcc.secretManager.enabled -- render kcc/22-secretmanager.yaml (needs
  # config.region or config.storageLocation for user-managed replication).
  secretManager:
    enabled: false

# Image digest takes precedence over the tag. An empty tag uses Chart.appVersion.
image:
  # -- image.repository -- container image repository without tag or digest.
  repository: europe-docker.pkg.dev/abfs-binaries/abfs-containers-alpha/abfs-alpha
  # -- image.tag -- image tag; empty falls back to Chart.appVersion.
  tag: "0.1.14"
  # -- image.digest -- optional immutable digest ("sha256:..."); pins the image
  # and overrides tag. Recommended for production.
  digest: ""
  # -- image.pullPolicy -- IfNotPresent | Always | Never.
  pullPolicy: IfNotPresent
# -- imagePullSecrets -- pre-created docker-registry Secrets. Usually empty on
# GKE (the node pool service account authenticates to Artifact Registry).
imagePullSecrets: []

# Licence-dependent workloads require a valid licence Secret.
# -- licensed -- force-enable licence-dependent workloads.
licensed: true

# Secret is owned by abfs-data-module. The PreSync validator checks it before sync.
license:
  # When licensed is false, look up Secret data.license; non-empty → mobilise.
  autoDetect: true
  secretNamespace: horizon
  secretName: abfs-license
  # PreSync hook verifies Secret data.license is present and non-empty before
  # Sync applies server/uploaders. abfs-data remains the Secret owner.
  validation:
    enabled: true
    # Job runs in the ABFS namespace (always exists when this chart syncs).
    namespace: abfs
    serviceAccountName: abfs-license-validator
    # Needs bash + kubectl; google-cloud-cli:stable has no kubectl.
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:debian_component_based

# Spanner and GCS are managed by abfs-data-module. These values configure
# the ABFS server connection; keep them aligned with that module.
spanner:
  # -- spanner.instance -- Spanner instance ID.
  instance: abfs
  # -- spanner.database -- Spanner database ID.
  database: abfs

# -- storage -- GCS blob bucket the server reads and writes.
storage:
# -- storage.bucket -- existing bucket name. Empty derives <gcpProjectId>-abfs.
  bucket: ""

# -- gitLfsEnabled -- enable Git LFS.
gitLfsEnabled: false

# -- extraParams -- extra params appended to the abfs command on server+uploader.
extraParams: []

# In-cluster clients use plaintext gRPC without client authentication by default.
client:
  # -- client.tls -- when false, pass --disable-tls=true to client commands.
  tls: false
  # -- client.authType -- --auth-type: none | gcpuser | gcpsa.
  authType: none

# The runtime service account is owned by abfs-data-module. Do not recreate it:
# the licence is bound to its numeric identity as well as its email.
# -- runtimeServiceAccountName -- local part of the licensed runtime GSA.
runtimeServiceAccountName: abfs-license
serviceAccounts:
  # -- serviceAccounts.server -- KSA name for the server.
  server: abfs-server
  # -- serviceAccounts.uploader -- KSA name for the uploaders.
  uploader: abfs-uploader
  # -- serviceAccounts.ui -- KSA name for the UI.
  ui: abfs-ui
# -- createServiceAccounts -- render the KSAs from this chart. False if they are
# managed elsewhere, to avoid ownership conflicts.
createServiceAccounts: true
# -- automountServiceAccountToken -- mount the SA token (k8s API/RBAC).
automountServiceAccountToken: true

# Select and tolerate the dedicated ABFS node pools.
# -- nodeSelector -- default node selector for server-pool workloads.
nodeSelector:
  cloud.google.com/gke-nodepool: abfs-data-server-node-pool
  workloadLabel: android-abfs-data
# -- tolerations -- default tolerations for server-pool workloads.
tolerations:
  - key: workloadType
    operator: Equal
    value: android-abfs-data-server
    effect: NoSchedule
# -- affinity -- pod/node affinity for all ABFS pods (free-form).
affinity: {}
# -- topologySpreadConstraints -- spread constraints for multi-replica components.
topologySpreadConstraints: []
# -- priorityClassName -- optional PriorityClass for ABFS pods.
priorityClassName: ""
# -- hostPID -- share the host PID namespace for CASFS-dependent workloads.
hostPID: true

# CASFS can be included in the node image or built for the running kernel.
casfs:
  # -- casfs.provider -- image | daemonset.
  provider: daemonset
  # -- casfs.requireReady -- inject a wait-for-casfs initContainer so pods do not
  # start before casfs is loaded on their node.
  requireReady: true
  # -- casfs.requireReadyTimeoutSeconds -- how long that initContainer waits; the
  # daemonset loader compiles casfs on a node's first boot (~1-2 min).
  requireReadyTimeoutSeconds: 600
  daemonset:
    # -- casfs.daemonset.image -- loader base image; needs gcloud + chroot.
    image: "gcr.io/google.com/cloudsdktool/google-cloud-cli:slim"
    # -- casfs.daemonset.sourceUrl -- casfs kernel-module source tarball.
    # REQUIRED when provider=daemonset; the chart calls fail without it.
    # Required when provider is daemonset.
    sourceUrl: "gs://cos-localmirror/distfiles/casfs-0.1.14.tar.gz"
    # -- casfs.daemonset.script -- override the loader script entirely
    # (empty = the chart default in casfs-installer-configmap.yaml).
    script: ""
    # -- casfs.daemonset.resources -- loader resources.
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        memory: 1Gi
    # -- casfs.daemonset.nodeSelector -- target the uploader pool only.
    nodeSelector:
      cloud.google.com/gke-nodepool: abfs-data-uploader-node-pool
      workloadLabel: android-abfs-data
    # -- casfs.daemonset.tolerations -- tolerate the uploader pool taint.
    tolerations:
      - key: workloadType
        operator: Equal
        value: android-abfs-data-uploader
        effect: NoSchedule

# =============================== METADATA ====================================
# -- commonLabels -- extra labels added to every object + pod (non-selector).
commonLabels: {}
# -- commonAnnotations -- annotations added to every object's metadata.
commonAnnotations: {}
# -- podAnnotations -- annotations added to every ABFS pod template.
podAnnotations: {}
# -- podLabels -- extra labels added to every ABFS pod template.
podLabels: {}

# =============================== SECURITY ====================================
# fsGroup is intentionally NOT set: the data containers run as root, and an
# fsGroup would trigger a recursive chown of the multi-TiB uploader PVCs on
# every start.
# -- podSecurityContext -- pod-level securityContext for ABFS pods.
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
# CASFS-dependent workloads require privileged
# access to mount the filesystem. The server does not use CASFS.
# -- securityContext -- container securityContext for the main ABFS containers.
securityContext:
  privileged: true
# Helper containers that do not need the casfs mount (init "wait" containers and
# the bootstrap Job) are plain ABFS clients and get hardened defaults.
# -- restrictedSecurityContext -- securityContext for non-privileged helpers.
restrictedSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# -- revisionHistoryLimit -- old ReplicaSet/ControllerRevision history to retain.
revisionHistoryLimit: 3
# -- terminationGracePeriodSeconds -- graceful shutdown window for ABFS pods.
terminationGracePeriodSeconds: 60

# =============================== SERVER ======================================
# Licence-gated: nothing below renders while licensed=false.
server:
  # -- server.enabled -- render the server Deployment + Service.
  enabled: true
  # -- server.replicas -- the ABFS server is a singleton; keep 1.
  replicas: 1
  # Sized for one pod per n2-highmem-64 node, with headroom for kubelet and CASFS.
  # Memory limit = request; no CPU limit (CPU limits cause throttling).
  resources:
    requests:
      cpu: "32"
      memory: 256Gi
    limits:
      memory: 256Gi
  service:
    # -- server.service.internalLoadBalancer -- internal L4 LB for out-of-cluster
    # clients (Cloud Workstations / CI). In-cluster uploaders use the Service DNS
    # name regardless.
    internalLoadBalancer: true
    # -- server.service.port -- gRPC port.
    port: 50051
    # -- server.service.annotations -- extra Service annotations.
    annotations: {}
  # The server attaches no data disk by default; the cache is ephemeral.
  cache:
    # -- server.cache.enabled -- attach a persistent cache PVC.
    enabled: false
    # -- server.cache.size -- cache PVC size.
    size: 500Gi
    # -- server.cache.storageClass -- cache PVC StorageClass.
    # premium-rwo (pd-ssd): data pool is n2-highmem-64; hyperdisk-balanced
    # cannot attach to N2 (Error 400). Use Hyperdisk only with N4/C3/C4-class nodes.
    storageClass: premium-rwo
    # -- server.cache.mountPath -- cache mount path.
    mountPath: /abfs-storage
    # -- server.cache.retainOnDelete -- keep the PVC on uninstall
    # (helm.sh/resource-policy: keep). Avoids silent cache loss.
    retainOnDelete: true
  # startup gates the slow casfs/cache warm-up; readiness gates traffic; liveness
  # restarts a wedged process. type: tcpSocket | grpc | httpGet | exec.
  probes:
    startup:
      enabled: true
      type: tcpSocket
      periodSeconds: 10
      failureThreshold: 30   # ~5 min budget for casfs + cache warm-up
    readiness:
      enabled: true
      type: tcpSocket
      initialDelaySeconds: 15
      periodSeconds: 10
    liveness:
      enabled: true
      type: tcpSocket
      initialDelaySeconds: 60
      periodSeconds: 20
      failureThreshold: 3
  # Default off: the server is a singleton, so any PDB blocks voluntary drains.
  pdb:
    enabled: false
    minAvailable: ""
    maxUnavailable: ""

# ============================== UPLOADERS ====================================
# Licence-gated.
uploader:
  # -- uploader.count -- uploader replicas. MUST match the number of pusher
  # entries (the pusher config is generated from this count).
  count: 3
  # -- uploader.namePrefix -- StatefulSet + headless Service name. Pod hostnames
  # become <namePrefix>-<ordinal>, which MUST equal the pusher-config names.
  namePrefix: abfs-gerrit-uploader
  # -- uploader.nodeSelector -- required placement for CASFS-dependent workloads.
  nodeSelector:
    cloud.google.com/gke-nodepool: abfs-data-uploader-node-pool
    workloadLabel: android-abfs-data
  # -- uploader.tolerations -- uploader pool taint.
  tolerations:
    - key: workloadType
      operator: Equal
      value: android-abfs-data-uploader
      effect: NoSchedule
  # Sized to fit the dedicated n2-standard-32 uploader pool (32 vCPU / 128 GiB)
  # while leaving headroom for kubelet and CASFS. No CPU limit avoids throttling.
  # Data PVC is 1 Ti (was 4 Ti).
  resources:
    requests:
      cpu: "24"
      memory: 96Gi
    limits:
      memory: 96Gi
  dataDisk:
    # -- uploader.dataDisk.size -- per-pod data PVC size (1 Ti each).
    size: 1024Gi
    # -- uploader.dataDisk.storageClass -- data PVC StorageClass.
    # premium-rwo (pd-ssd): required while the ABFS pools use their default shapes.
    # hyperdisk-balanced is incompatible with N2.
    storageClass: premium-rwo
    # -- uploader.dataDisk.mountPath -- data mount path.
    mountPath: /abfs-storage
    # -- uploader.dataDisk.deletePvcWhenDisabled -- when true, StatefulSet
    # persistentVolumeClaimRetentionPolicy.whenDeleted=Delete so module disable /
    # Argo prune of the STS also removes the per-pod data PVCs (and underlying
    # disks). Kubernetes default is Retain, which left 1 Ti disks after disable.
    # Staging only — durable ABFS content lives in Spanner/GCS via the server.
    deletePvcWhenDisabled: true
    # -- uploader.dataDisk.deletePvcWhenScaled -- also delete PVCs when
    # uploader.count decreases (whenScaled=Delete). Default Retain keeps data if
    # a replica is scaled down temporarily.
    deletePvcWhenScaled: false
  # -- uploader.extraParams -- extra params appended to the uploader command.
  extraParams: []
  # -- uploader.preStartHooks -- map of filename -> script content, mounted at
  # /etc/abfs/pre-start.d on each uploader pod.
  preStartHooks: {}
  # No startup probe: the initContainer already gates on server + pusher-config.
  probes:
    readiness:
      enabled: true
      type: tcpSocket
      initialDelaySeconds: 20
      periodSeconds: 10
    liveness:
      enabled: true
      type: tcpSocket
      initialDelaySeconds: 60
      periodSeconds: 20
      failureThreshold: 3
  # maxUnavailable 1 keeps at least count-1 pushers up during voluntary
  # disruptions.
  pdb:
    enabled: true
    minAvailable: ""
    maxUnavailable: 1

# ============================ PUSHER CONFIG ==================================
pusher:
  # -- pusher.uploaderConfigNamespace / uploaderConfigMapName -- ConfigMap owned
  # by abfs-data-module whose single active row selects what the uploaders seed.
  uploaderConfigNamespace: horizon
  uploaderConfigMapName: abfs-uploader-config
  # -- pusher.fallbackRepo -- used only when that ConfigMap cannot be read or
  # does not have exactly one active row (e.g. abfs-data disabled or the table
  # corrupted). Keep in line with the Android15 row in abfs-data-module.
  fallbackRepo:
    url: https://android.googlesource.com/platform/manifest
    branch: android-15.0.0_r36
    file: default.xml
    fetchRefSpec:
      - refs/*:refs/*
      - ^refs/changes/*/meta
      - ^refs/changes/*/robot-comments
      - ^refs/cache-automerge/*
  defaults:
    # -- pusher.defaults.port -- uploader/pusher serving port.
    port: 8086
    # -- pusher.defaults.maxRemotePushes -- per-pusher remote push cap.
    maxRemotePushes: 5000
    # -- pusher.defaults.maxProjectsSyncs -- per-pusher project sync cap.
    maxProjectsSyncs: 1000
  # -- pusher.workers -- project worker count.
  workers: 200
  # -- pusher.concurrentUploads -- concurrent uploads written to clients/defaults.
  concurrentUploads: 200
  job:
    # -- pusher.job.backoffLimit -- Job retry budget.
    backoffLimit: 3
    # -- pusher.job.activeDeadlineSeconds -- overall Job timeout (empty = none).
    activeDeadlineSeconds: ""
    # -- pusher.job.ttlSecondsAfterFinished -- optional Job GC after success.
    # Empty = keep the Completed Job (recommended). A finite TTL (e.g. 3600)
    # deletes the Job and Argo reports OutOfSync/Missing until the next sync.
    ttlSecondsAfterFinished: ""
    # -- pusher.job.kubectlImage -- image for the PreSync cleanup Job.
    kubectlImage: registry.k8s.io/kubectl:v1.29.2

# ================================= UI ========================================
# Stateless front-end and reverse proxy to the uploaders (Deployment name
# abfs-ui). Licence-gated. NOT the module overview page (parent
# templates/module-overview-http.yaml / mobilisation status).
#
# The UI waits for the server gRPC port before starting.
ui:
  # -- ui.enabled -- render the UI Deployment + Service (abfs-ui).
  # -- ui.replicas -- UI replica count.
  replicas: 1
  # -- ui.port -- UI HTTP port.
  port: 8080
  # -- ui.extraParams -- extra params appended to the UI command.
  extraParams: []
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      memory: 8Gi
  service:
    # -- ui.service.internalLoadBalancer -- internal L4 LB for browser access;
    # ClusterIP when false.
    internalLoadBalancer: false
    # -- ui.service.annotations -- extra Service annotations.
    annotations: {}
  probes:
    readiness:
      enabled: true
      type: tcpSocket
      initialDelaySeconds: 30
      periodSeconds: 10
    liveness:
      enabled: true
      type: tcpSocket
      # Give do_ui / cacheman time after backends are up (was 45; still short under load).
      initialDelaySeconds: 120
      periodSeconds: 20
      failureThreshold: 6
  pdb:
    enabled: true
    minAvailable: ""
    maxUnavailable: 1

# ============================ OBSERVABILITY ==================================
# Injects OTLP exporter env into the server/uploader/ui containers. Requires the
# GKE managed OpenTelemetry collector at cluster level; a harmless no-op until
# the ABFS image emits OTLP.
otel:
  # -- otel.enabled -- inject OTLP exporter env into the containers.
  enabled: true
  # -- otel.endpoint -- OTLP HTTP endpoint.
  endpoint: "http://opentelemetry-collector.gke-managed-otel.svc.cluster.local:4318"

# =========================== VPA (right-sizing) ==============================
# Requires the cluster VPA add-on. Off mode provides recommendations only.
vpa:
  # -- vpa.enabled -- render VerticalPodAutoscaler objects (requires VPA CRD/add-on).
  # Cluster addon: terraform/modules/sdv-gke-cluster vertical_pod_autoscaling.
  enabled: true
  # -- vpa.updateMode -- Off | Initial | Auto | Recreate.
  # Off = recommendations only (safe with HPA-incompatible StatefulSets).
  updateMode: "Off"

# ============================ NETWORK POLICY =================================
networkPolicy:
  # -- networkPolicy.enabled -- render NetworkPolicies.
  enabled: true
  # -- networkPolicy.extraEgress -- extra egress rules merged into each policy.
  # Egress defaults to open: ABFS reaches Spanner, GCS, Gerrit and Artifact
  # Registry.
  extraEgress: []

# ============================ HELM / ARGO TEST ================================
tests:
  # -- tests.enabled -- render connectivity check (Argo PostSync Job + helm test).
  enabled: true
  # -- tests.kubectlImage -- unused; test uses the ABFS image for /dev/tcp.
  activeDeadlineSeconds: 180
