# The workflows namespace is default-deny (gitops/templates/argo-workflows.yaml)
# and only allows listed egress. Without this rule an ABFS build started from
# Argo cannot reach the ABFS server: cacheman fails its health check against
# abfs-server.<abfsNamespace>.svc:50051 and the build stops at initialise.
# Jenkins build pods are not affected: the jenkins namespace has no
# default-deny policy.
#
# Rendered only when the platform enforces network policies. An Egress policy
# selecting the workflow pods would otherwise switch them from allow-all to
# allow-listed egress and cut their other traffic.

{{- if .Values.networkPolicies }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-workflow-pods-egress-to-abfs-server
  namespace: {{ .Values.workflowNamespace }}
  labels:
    horizon-sdv.io/module: abfs-service-module
spec:
  podSelector:
    matchExpressions:
      - key: workflows.argoproj.io/workflow
        operator: Exists
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.abfsNamespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: abfs
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 50051
{{- end }}
