# ABFS server and uploader node-pool defaults.
# The parent Application overrides these values in the cluster.

# -- namespace -- namespace for the ContainerNodePool resources.
namespace: abfs
# -- parentModuleName -- owning module, recorded as a label for provenance.
parentModuleName: abfs-service-module
# -- gcpProjectId -- target GCP project.
gcpProjectId: ""
# -- clusterName -- name of the existing GKE cluster (Terraform-owned).
clusterName: sdv-cluster
# -- location -- cluster location (region). Injected from config.region.
location: ""
# -- nodeLocations -- zones the pool spans. Empty = let GKE choose from the
# cluster's own node locations.
nodeLocations: []

# Nodes use the licensed runtime service account owned by abfs-data-module.
# Do not recreate it; the licence is bound to its numeric identity.

# -- runtimeServiceAccountName -- local part of the licensed runtime GSA.
runtimeServiceAccountName: abfs-license
# -- nodeServiceAccountEmail -- full email, overriding the composed value. Only
# needed when the licensed account lives in a different project from the pool.
# Empty composes <runtimeServiceAccountName>@<gcpProjectId>.iam.gserviceaccount.com.
nodeServiceAccountEmail: ""

# -- releaseChannel -- cluster channel; an empty value enables auto-upgrades.
releaseChannel: ""

serverNodePool:
  # -- serverNodePool.name -- GCP node pool name and KCC resourceID.
  name: abfs-data-server-node-pool

  # -- nodePool.version -- optional version pin; supported only without a release channel.
  version: ""

  # -- nodePool.machineType -- server pool shape; see the README sizing table.
  machineType: n2-highmem-64

  # -- nodePool.diskSizeGb -- node boot disk. Uploader data uses PVCs.
  diskSizeGb: 100

  # -- nodePool.imageType -- node image.
  imageType: UBUNTU_CONTAINERD

  # -- nodePool.initialNodeCount -- start at zero; autoscaling adds nodes on demand.
  initialNodeCount: 0
  # -- nodePool.minNodeCount -- scale-to-zero when no ABFS pod is scheduled.
  minNodeCount: 0
  # -- serverNodePool.maxNodeCount -- server capacity.
  maxNodeCount: 2

  # -- nodePool.workloadLabel -- label used to select ABFS nodes.
  workloadLabel: android-abfs-data
  # -- serverNodePool.workloadType -- taint value.
  workloadType: android-abfs-data-server

uploaderNodePool:
  # -- uploaderNodePool.name -- GCP node pool name and KCC resourceID.
  name: abfs-data-uploader-node-pool
  version: ""
  machineType: n2-standard-32
  diskSizeGb: 100
  imageType: UBUNTU_CONTAINERD
  initialNodeCount: 0
  minNodeCount: 0
  maxNodeCount: 5
  # -- uploaderNodePool.workloadLabel -- label used to select uploader nodes.
  workloadLabel: android-abfs-data
  workloadType: android-abfs-data-uploader

# Licence metadata comes from the abfs-data Secret and is applied when pools
# are created. The parent Application ignores this field to preserve the value.
license:
  secretNamespace: horizon
  secretName: abfs-license
  metadataKey: abfs-license
  statusConfigMapName: abfs-license-metadata-status
  workflowsNamespace: workflows
  # WI → gke-argo-workflows-elevated-sa (roles/container.admin for gcloud describe).
  jobServiceAccountName: workflow-executor-elevated
  cloudSdkImage: gcr.io/google.com/cloudsdktool/google-cloud-cli:debian_component_based
