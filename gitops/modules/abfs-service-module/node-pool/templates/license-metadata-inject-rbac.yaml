# RBAC for licence metadata sync jobs.
# Grants access to the licence Secret, node pools, and status ConfigMap.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-license-metadata-inject-secret
  namespace: {{ .Values.license.secretNamespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.parentModuleName | quote }}
    app.kubernetes.io/name: abfs-license-metadata-inject
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.license.secretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-license-metadata-inject-secret
  namespace: {{ .Values.license.secretNamespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.parentModuleName | quote }}
    app.kubernetes.io/name: abfs-license-metadata-inject
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-license-metadata-inject-secret
subjects:
  - kind: ServiceAccount
    name: {{ .Values.license.jobServiceAccountName | quote }}
    namespace: {{ .Values.license.workflowsNamespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-license-metadata-inject-pool
  namespace: {{ .Values.namespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.parentModuleName | quote }}
    app.kubernetes.io/name: abfs-license-metadata-inject
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: ["container.cnrm.cloud.google.com"]
    resources: ["containernodepools"]
    resourceNames:
      - {{ .Values.serverNodePool.name | quote }}
      - {{ .Values.uploaderNodePool.name | quote }}
    verbs: ["get", "delete", "list", "watch", "update", "patch"]
  - apiGroups: ["container.cnrm.cloud.google.com"]
    resources: ["containernodepools"]
    verbs: ["list", "watch", "create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.license.statusConfigMapName | quote }}]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-license-metadata-inject-pool
  namespace: {{ .Values.namespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.parentModuleName | quote }}
    app.kubernetes.io/name: abfs-license-metadata-inject
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-license-metadata-inject-pool
subjects:
  - kind: ServiceAccount
    name: {{ .Values.license.jobServiceAccountName | quote }}
    namespace: {{ .Values.license.workflowsNamespace | quote }}
