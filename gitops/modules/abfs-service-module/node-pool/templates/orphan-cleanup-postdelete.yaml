# PostDelete: after abfs-service-module is disabled and Argo CD pruned both ContainerNodePool CRs,
# delete the server and uploader GKE pools with gcloud if they are still there.
# Config Connector deletes the GKE pool with the CR when the CR carries the cluster name in clusterRef.
# A CR written by an earlier release (full cluster path) is removed without the pool ("underlying
# resource does not exist; no API call necessary"), and a delete can also fail on the GKE side; such
# a pool makes the next enable fail with "already exists". The PreSync licence job
# (license-metadata-inject-job.yaml) removes such orphans on enable; this hook removes them at disable time.
# - It never fails and its waits end well before the Job deadline, so it cannot block the module disable.
# - A pool is deleted only when its ContainerNodePool is confirmed absent and the pool was read from GKE.
#   A CR that still exists, or any read that fails, leaves the pool alone (a warning is logged; the next
#   enable removes a real orphan).
apiVersion: batch/v1
kind: Job
metadata:
  name: abfs-data-pools-orphan-postdelete
  namespace: {{ .Values.license.workflowsNamespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.parentModuleName | quote }}
    app.kubernetes.io/name: abfs-nodepool-orphan-cleanup
  annotations:
    argocd.argoproj.io/hook: PostDelete
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        horizon-sdv.io/module: {{ .Values.parentModuleName | quote }}
        app.kubernetes.io/name: abfs-nodepool-orphan-cleanup
    spec:
      serviceAccountName: {{ .Values.license.jobServiceAccountName | quote }}
      restartPolicy: Never
      containers:
        - name: cleanup
          image: {{ required "license.cloudSdkImage is set by the abfs-service-module Application" .Values.license.cloudSdkImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PROJECT_ID
              value: {{ .Values.gcpProjectId | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: LOCATION
              value: {{ .Values.location | quote }}
            - name: NODE_POOL_NAMES
              value: {{ printf "%s %s" .Values.serverNodePool.name .Values.uploaderNodePool.name | quote }}
            - name: CR_NS
              value: {{ .Values.namespace | quote }}
          command: [bash, -uo, pipefail, -c]
          args:
            - |
              G=(--cluster="${CLUSTER_NAME}" --location="${LOCATION}" --project="${PROJECT_ID}")
              BUDGET=1200   # seconds for all waits; the Job deadline is 1800
              warn() { echo "WARNING: $*" >&2; }
              # present | absent; any gcloud error other than NOT_FOUND returns 1.
              pool_state() {
                local err
                if err="$(gcloud container node-pools describe "$1" "${G[@]}" --format='value(name)' 2>&1 >/dev/null)"; then echo present; return 0; fi
                if grep -qiE 'code=404|NOT_FOUND|not found|No node pool named' <<<"${err}"; then echo absent; return 0; fi
                warn "cannot read GKE node pool $1: ${err}"
                return 1
              }
              if ! command -v kubectl >/dev/null 2>&1; then gcloud components install kubectl --quiet || true; fi

              pending=()
              for P in ${NODE_POOL_NAMES}; do
                if out="$(kubectl get containernodepool "${P}" -n "${CR_NS}" -o name 2>&1)"; then
                  warn "ContainerNodePool ${CR_NS}/${P} still exists — the pool is managed, not deleted."
                  continue
                elif ! grep -qi 'not found' <<<"${out}"; then
                  warn "cannot read ContainerNodePool ${CR_NS}/${P} (${out}) — ${P} not deleted; the next enable removes an orphan (PreSync licence job)."
                  continue
                fi
                state="$(pool_state "${P}")" || { warn "${P} not deleted; the next enable removes an orphan (PreSync licence job)."; continue; }
                if [[ "${state}" == "absent" ]]; then echo "PostDelete: GKE node pool ${P} is already gone."; continue; fi
                echo "PostDelete: GKE node pool ${P} has no ContainerNodePool — deleting it."
                pending+=("${P}")
              done

              # Ask GKE to delete without waiting for the operation (--async) and poll within the budget.
              # GKE refuses a delete while another operation runs on the cluster, so the request is repeated.
              while (( ${#pending[@]} > 0 && SECONDS < BUDGET )); do
                next=()
                for P in "${pending[@]}"; do
                  state="$(pool_state "${P}")" || { next+=("${P}"); continue; }
                  if [[ "${state}" == "absent" ]]; then echo "PostDelete: ${P} deleted."; continue; fi
                  gcloud container node-pools delete "${P}" "${G[@]}" --async --quiet >/dev/null 2>&1 || true
                  next+=("${P}")
                done
                pending=(${next[@]+"${next[@]}"})
                if (( ${#pending[@]} > 0 )); then sleep 15; fi
              done
              for P in ${pending[@]+"${pending[@]}"}; do
                warn "${P} is not confirmed deleted after ${BUDGET}s; the delete may still be running. The next enable removes an orphan (PreSync licence job)."
              done
              exit 0
