# Argo Events Sensors for the Storage Mirror WorkflowTemplates (sensor-submit-workflow pattern of sample-module).
# The filter body.workflowTemplateName equals the template name; body fields map onto the parameters by index
# (order in templates/_helpers.tpl, shared with the controller). Missing fields default to "".
{{- range $op := list "create" "sync" "delete" "volume-init" }}
{{- $params := include (printf "smw.params.%s" (ternary "mirror" $op (or (eq $op "create") (eq $op "sync")))) $ | splitList " " }}
{{- $template := printf "storage-mirror-%s" $op }}
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-{{ $template }}
  namespace: {{ $.Values.eventsNamespace }}
  labels:
    {{- include "smw.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - {{ $template | quote }}
  triggers:
    - template:
        name: submit-{{ $template }}
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: {{ $template }}-
                namespace: {{ $.Values.workflowNamespace }}
                labels:
                  horizon-sdv.io/module: storage-mirror
              spec:
                workflowTemplateRef:
                  name: {{ $template }}
                arguments:
                  parameters:
                    {{- range $params }}
                    - name: {{ . }}
                    {{- end }}
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
                value: ""
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
                value: api
              dest: metadata.labels.horizon-sdv\.io/submitted-from
            - src:
                dependencyName: webhook-dep
                dataKey: body.requestId
                value: ""
              dest: metadata.labels.storagemirror\.horizon-sdv\.io/request-id
            {{- if has "mirror" $params }}
            - src:
                dependencyName: webhook-dep
                dataKey: body.mirror
                value: ""
              dest: metadata.labels.storagemirror\.horizon-sdv\.io/mirror
            {{- end }}
            {{- range $i, $p := $params }}
            - src:
                dependencyName: webhook-dep
                {{- /* submittedBy carries the Horizon submitter (Horizon API and the controller both set horizonSubmittedBy). */}}
                dataKey: body.{{ ternary "horizonSubmittedBy" $p (eq $p "submittedBy") }}
                value: ""
              dest: spec.arguments.parameters.{{ $i }}.value
            {{- end }}
{{- end }}
