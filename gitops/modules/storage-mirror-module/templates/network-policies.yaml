# The workflows-side egress (allow-workflow-pods-to-storage-mirror-module) and the argo-events webhook ingress are
# platform policies in gitops/templates/argo-workflows.yaml and gitops/templates/argo-events.yaml.
{{- if and (include "storage-mirror-module.mainEnv" . | eq "true") .Values.config.enableNetworkPolicies }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storage-mirror-module-egress
  namespace: {{ include "storage-mirror-module.horizonNS" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: storage-mirror-module
  policyTypes:
    - Egress
  egress:
    # Kubernetes API (private control plane endpoint is outside the pod ranges).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
    # Argo Events webhook EventSource (run dispatch).
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "storage-mirror-module.eventsNS" . }}
      ports:
        - protocol: TCP
          port: 12000
---
# Kubelet probes (node subnet), Horizon API and labelled mirror workflow pods. No ports-only rule (default deny).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-storage-mirror-module-ingress
  namespace: {{ include "storage-mirror-module.horizonNS" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: storage-mirror-module
  policyTypes:
    - Ingress
  ingress:
    {{- range (.Values.config.probeSourceCIDRs | default (list "10.1.0.0/24" "10.2.0.0/24")) }}
    - from:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "storage-mirror-module.workflowsNS" . }}
          podSelector:
            matchLabels:
              horizon-sdv.io/storage-mirror-api-client: "true"
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "storage-mirror-module.horizonApiNS" . }}
      ports:
        - protocol: TCP
          port: 8443
{{- end }}
