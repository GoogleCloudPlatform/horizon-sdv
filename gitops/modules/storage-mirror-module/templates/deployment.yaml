{{- if include "storage-mirror-module.mainEnv" . | eq "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-mirror-module
  namespace: {{ include "storage-mirror-module.horizonNS" . }}
  labels:
    app.kubernetes.io/name: storage-mirror-module
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-mirror-module
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-mirror-module
    spec:
      serviceAccountName: storage-mirror-module
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ .Values.config.containerImages.storageMirrorModule | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          env:
            - name: MANAGER_NAMESPACE
              value: {{ include "storage-mirror-module.horizonNS" . }}
            - name: WORKFLOW_NAMESPACE
              value: {{ include "storage-mirror-module.workflowsNS" . }}
            - name: JENKINS_NAMESPACE
              value: {{ if .Values.mirror.consumers.jenkins.enabled }}{{ include "storage-mirror-module.jenkinsNS" . }}{{ end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.config.projectID | quote }}
            - name: EVENTS_WEBHOOK_URL
              value: "http://webhook-eventsource-svc.{{ include "storage-mirror-module.eventsNS" . }}.svc.cluster.local:12000/events/workflow"
            # The controller creates these Secrets on first start and reuses them (internal/secrets); they are not
            # rendered by the chart, so Argo CD neither regenerates nor deletes them.
            - name: API_TOKEN_SECRET
              value: {{ .Values.api.tokenSecretName | quote }}
            - name: API_TLS_SECRET
              value: {{ .Values.api.tlsSecretName | quote }}
            - name: HORIZON_API_NAMESPACE
              value: {{ include "storage-mirror-module.horizonApiNS" . }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: storage-mirror-module
  namespace: {{ include "storage-mirror-module.horizonNS" . }}
  labels:
    app.kubernetes.io/name: storage-mirror-module
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: storage-mirror-module
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-mirror-module
  namespace: {{ include "storage-mirror-module.horizonNS" . }}
  labels:
    app.kubernetes.io/name: storage-mirror-module
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}
