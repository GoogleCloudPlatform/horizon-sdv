# Only the mirror workflow identity may mount the read-write mirror claim; build workflows use the read-only claim.
{{- if include "storage-mirror-module.mainEnv" . | eq "true" }}
{{- $rw := .Values.mirror.consumers.workflows.rwClaimName }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Values.config.namespacePrefix }}storage-mirror-rw-claim
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  validations:
    - expression: >-
        !has(object.spec.volumes) ||
        !object.spec.volumes.exists(v, has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == '{{ $rw }}') ||
        (has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'storage-mirror-sync')
      message: >-
        only the storage-mirror-sync service account may mount claim {{ $rw }}; mount storage-mirror-ro read-only instead
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Values.config.namespacePrefix }}storage-mirror-rw-claim
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  policyName: {{ .Values.config.namespacePrefix }}storage-mirror-rw-claim
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ include "storage-mirror-module.workflowsNS" . | quote }}
{{- end }}
