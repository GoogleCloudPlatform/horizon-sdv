# Child Application with the mirror WorkflowTemplates and their Argo Events Sensors.
# Its own Application so Argo CD validates WorkflowTemplate and Sensor resources after their CRDs exist.
{{- if include "storage-mirror-module.mainEnv" . | eq "true" }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-argo-workflows
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.moduleName }}
    horizon-sdv.io/module: {{ .Values.moduleName }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/storage-mirror-module/argo-workflows
    helm:
      values: |
        workflowNamespace: {{ include "storage-mirror-module.workflowsNS" . }}
        eventsNamespace: {{ include "storage-mirror-module.eventsNS" . }}
        projectID: {{ .Values.config.projectID | quote }}
        syncImage: {{ .Values.config.containerImages.storageMirrorSync | quote }}
        controllerUrl: "https://{{ include "storage-mirror-module.apiHost" . }}:8443"
        apiTokenSecretName: {{ .Values.api.tokenSecretName | quote }}
        apiTlsSecretName: {{ .Values.api.tlsSecretName | quote }}
        rwClaimName: {{ .Values.mirror.consumers.workflows.rwClaimName | quote }}
        mountPath: {{ .Values.mirror.layout.mountPath | quote }}
        rootSubdir: {{ .Values.mirror.layout.rootSubdir | quote }}
        maxParallelSyncs: {{ .Values.mirror.concurrency.maxParallelSyncs | default 1 }}
        defaults:
          {{- toYaml .Values.mirror.defaults | nindent 10 }}
        retention:
          {{- toYaml .Values.mirror.retention | nindent 10 }}
        {{- toYaml .Values.workflows | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ include "storage-mirror-module.workflowsNS" . }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
{{- end }}
