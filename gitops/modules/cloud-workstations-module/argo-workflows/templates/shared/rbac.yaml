# Lets Cloud Workstations workflow steps (ServiceAccount workflow-executor) manage Horizon CRs only.
# No Config Connector kinds, no status or finalizers: the module controller owns those and all GCP calls.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cws-workflows
  namespace: {{ .Values.resourceNamespace }}
  labels:
    {{- include "cws.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups:
      - workstations.horizon-sdv.io
    resources:
      - workstationconfigs
      - workstations
    verbs:
      - get
      - list
      - create
      - patch
      - delete
  - apiGroups:
      - workstations.horizon-sdv.io
    resources:
      - workstationclusters
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cws-workflows
  namespace: {{ .Values.resourceNamespace }}
  labels:
    {{- include "cws.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cws-workflows
subjects:
  - kind: ServiceAccount
    name: workflow-executor
    namespace: {{ .Values.workflowNamespace }}
---
# Start and stop (ServiceAccount cws-workstation-power) only read Horizon CRs to check that the parent
# config is Ready and to resolve the GCP resource name. Their GCP calls use their own Google identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cws-workflows-read
  namespace: {{ .Values.resourceNamespace }}
  labels:
    {{- include "cws.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups:
      - workstations.horizon-sdv.io
    resources:
      - workstationconfigs
      - workstations
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cws-workflows-read
  namespace: {{ .Values.resourceNamespace }}
  labels:
    {{- include "cws.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cws-workflows-read
subjects:
  - kind: ServiceAccount
    name: {{ .Values.powerServiceAccount }}
    namespace: {{ .Values.workflowNamespace }}
