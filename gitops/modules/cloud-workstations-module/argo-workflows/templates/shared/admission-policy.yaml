# RBAC cannot see which template a Workflow uses, so this policy limits what the module controller
# (cloud-workstations-module-sa) may create with its create permission on Workflows: a run of the
# namespaced cws-image-build template, with no inline templates and no ServiceAccount override.
# Other callers are not affected: matchConditions skips every request that is not from that account.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cws-module-controller-workflow-create
  labels:
    {{- include "cws.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE"]
        resources: ["workflows"]
  matchConditions:
    - name: module-controller-only
      expression: >-
        request.userInfo.username == 'system:serviceaccount:{{ .Values.resourceNamespace }}:cloud-workstations-module-sa'
  validations:
    - expression: >-
        has(object.spec) && has(object.spec.workflowTemplateRef) &&
        has(object.spec.workflowTemplateRef.name) &&
        object.spec.workflowTemplateRef.name == 'cws-image-build'
      message: "The module controller may only create Workflows from the cws-image-build WorkflowTemplate."
    - expression: >-
        !has(object.spec) || !has(object.spec.workflowTemplateRef) ||
        !has(object.spec.workflowTemplateRef.clusterScope)
      message: "spec.workflowTemplateRef.clusterScope must not be set."
    - expression: >-
        !has(object.spec) || !has(object.spec.templates)
      message: "spec.templates must not be set. The module controller cannot attach inline templates."
    - expression: >-
        !has(object.spec) || !has(object.spec.serviceAccountName)
      message: "spec.serviceAccountName must not be set. The run keeps the template's ServiceAccount."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cws-module-controller-workflow-create
  labels:
    {{- include "cws.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  policyName: cws-module-controller-workflow-create
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Values.workflowNamespace }}
