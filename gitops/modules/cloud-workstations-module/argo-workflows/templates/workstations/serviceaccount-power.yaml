# Identity for cws-user-start-workstation and cws-user-stop-workstation only.
# The Google service account holds the custom role horizonCloudWorkstationsPower (start, stop and
# operations.get) from terraform/modules/base. It is deliberately neither gke-cws-module-sa (the
# controller) nor gke-argo-workflows-sa (every other workflow and the Horizon API).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.powerServiceAccount }}
  namespace: {{ .Values.workflowNamespace }}
  labels:
    {{- include "cws.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: gke-cws-workstation-power-sa@{{ required "config.projectID is required" .Values.config.projectID }}.iam.gserviceaccount.com
    argocd.argoproj.io/sync-wave: "6"
---
# Argo writes a WorkflowTaskResult with the pod identity; without this the steps hang or 403 near the end.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cws-workstation-power-workflowtaskresults
  namespace: {{ .Values.workflowNamespace }}
  labels:
    {{- include "cws.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-workflowtaskresults
subjects:
  - kind: ServiceAccount
    name: {{ .Values.powerServiceAccount }}
    namespace: {{ .Values.workflowNamespace }}
