# Child Application: Cloud Workstations Argo Workflows (WorkflowTemplates, Sensors).
# Main environment only (gated by isSubEnvironment == false).
# cloud-workstations, workflows, and argo-events are intentionally unprefixed:
# this module never renders on a sub-environment, and the main environment prefix is empty.
{{- if not (default false .Values.config.isSubEnvironment) }}
{{- if and .Values.repo.url .Values.repo.revision }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-cloud-workstations-argo-workflows
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: cloud-workstations-module
    horizon-sdv.io/module: {{ .Values.moduleName | default "cloud-workstations" }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/cloud-workstations-module/argo-workflows
    helm:
      values: |
        workflowNamespace: workflows
        eventsNamespace: argo-events
        moduleName: {{ .Values.moduleName | default "cloud-workstations" | quote }}
        pipelineRepoUrl: {{ .Values.repo.url | quote }}
        pipelineRepoRevision: {{ .Values.repo.revision | quote }}
        config:
{{ .Values.config | toYaml | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: workflows
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
{{- end }}
{{- end }}

