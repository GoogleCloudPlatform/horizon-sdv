# Child Application: Cloud Workstations core (controller, RBAC, CRDs, workstation cluster).
# Destination is the dedicated un-prefixed cloud-workstations namespace (LLD D7, D8).
# Main environment only (gated by isSubEnvironment == false).
{{- if not (default false .Values.config.isSubEnvironment) }}
{{- if and .Values.repo.url .Values.repo.revision }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-cloud-workstations-core
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: cloud-workstations-module
    horizon-sdv.io/module: {{ .Values.moduleName | default "cloud-workstations" }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/cloud-workstations-module/core
    helm:
      values: |
        moduleName: {{ .Values.moduleName | default "cloud-workstations" | quote }}
        config:
{{ .Values.config | toYaml | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: cloud-workstations
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      # Module Manager pauses this Application during disable, then turns self-heal off before
      # resuming it for parent-Application pruning. Outside that drain, repair manual changes.
      selfHeal: true
{{- end }}
{{- end }}

