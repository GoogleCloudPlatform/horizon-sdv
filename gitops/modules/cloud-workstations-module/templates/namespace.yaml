# Dedicated cloud-workstations namespace for the Cloud Workstations controller,
# Horizon custom resources, and owner-linked KCC objects (LLD D7, D8).
# Created at Sync Wave 0 so that it exists and is secured before child applications sync.
{{- if not (default false .Values.config.isSubEnvironment) }}
apiVersion: v1
kind: Namespace
metadata:
  name: cloud-workstations
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | default "cloud-workstations" | quote }}
    horizon-sdv.io/module-managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{- end }}

