moduleName: cloud-workstations

# Requests only: a memory limit could OOM-kill the controller mid-reconcile.
resources:
  requests:
    cpu: 100m
    memory: 128Mi

config:
  namespacePrefix: ""
  projectID: ""
  enableNetworkPolicies: true
  isSubEnvironment: false
  probeSourceCIDRs:
    - "10.1.0.0/24"
    - "10.2.0.0/24"
  # Full image ref; Module Manager MODULE_CONFIG merges config.containerImages.cloudWorkstationsModule at enable time.
  containerImages:
    cloudWorkstationsModule: ""

# Namespace of the cws-image-build WorkflowTemplate (argo-workflows chart).
workflowNamespace: workflows

# Environment step image built on enable. Same path and tag as argo-workflows images.environment.
environmentImage:
  path: horizon-sdv/cloud-ws-workloads/cws-workflow
  tag: latest
