{{- if include "cloud-workstations-core.mainEnv" . | eq "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-workstations-role
  namespace: cloud-workstations
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups:
      - workstations.horizon-sdv.io
    resources:
      - workstationclusters
      - workstationclusters/status
      - workstationclusters/finalizers
      - workstationconfigs
      - workstationconfigs/status
      - workstationconfigs/finalizers
      - workstations
      - workstations/status
      - workstations/finalizers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - workstations.cnrm.cloud.google.com
    resources:
      - workstationclusters
      - workstationclusters/status
      - workstationconfigs
      - workstationconfigs/status
      - workstations
      - workstations/status
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
{{- end }}

