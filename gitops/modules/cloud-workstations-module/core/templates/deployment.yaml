{{- if include "cloud-workstations-core.mainEnv" . | eq "true" }}
{{- $project := required "config.projectID is required" .Values.config.projectID }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-workstations-module
  namespace: cloud-workstations
  labels:
    app.kubernetes.io/name: cloud-workstations-module
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloud-workstations-module
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloud-workstations-module
    spec:
      serviceAccountName: cloud-workstations-module-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ .Values.config.containerImages.cloudWorkstationsModule | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          ports:
            - name: healthz
              containerPort: 8080
          env:
            - name: MANAGER_NAMESPACE
              value: cloud-workstations
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST_SERVICE_ACCOUNT
              value: {{ printf "gke-cws-host-vm-sa@%s.iam.gserviceaccount.com" $project | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
{{- end }}
