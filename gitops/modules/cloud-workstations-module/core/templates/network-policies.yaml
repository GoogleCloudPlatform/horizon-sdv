{{- if include "cloud-workstations-core.mainEnv" . | eq "true" }}
{{- if .Values.config.enableNetworkPolicies }}
---
# Controller pod: GKE Workload Identity metadata (:988) + Google APIs (443)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloud-workstations-module-egress
  namespace: cloud-workstations
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloud-workstations-module
  policyTypes:
    - Egress
  egress:
    # GKE Workload Identity: metadata server on 169.254.169.252:988 (not 169.254.169.254:80)
    - to:
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 988
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
---
# Controller pod: Kubelet HTTP health probes from node primary subnets
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloud-workstations-module-ingress
  namespace: cloud-workstations
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloud-workstations-module
  policyTypes:
    - Ingress
  ingress:
    # Kubelet HTTP probes originate from the node IP (primary subnet), not the pods CIDR.
    {{- range .Values.config.probeSourceCIDRs }}
    - from:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
{{- end }}
{{- end }}

