{{- if include "cloud-workstations-core.mainEnv" . | eq "true" }}
{{- $project := required "config.projectID is required" .Values.config.projectID }}
{{- $region := required "config.region is required" .Values.config.region }}
{{- $prefix := printf "%s-docker.pkg.dev/%s/" $region $project }}
---
# Enforce the spec.container.image registry at admission (CRD cannot embed project id in OpenAPI pattern).
# An unchanged image is allowed on UPDATE so objects created before this policy can still be
# edited, have finalizers removed and be drained.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: cloud-workstations-workstationconfig-image
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["workstations.horizon-sdv.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["workstationconfigs"]
  validations:
    - expression: >-
        has(object.spec) && (
        (has(object.spec.container) && has(object.spec.container.image) &&
        object.spec.container.image.startsWith('{{ $prefix }}')) ||
        (oldObject != null && has(oldObject.spec) &&
        ((has(oldObject.spec.container) && has(oldObject.spec.container.image))
        ? (has(object.spec.container) && has(object.spec.container.image) &&
        object.spec.container.image == oldObject.spec.container.image)
        : (!has(object.spec.container) || !has(object.spec.container.image))))
        )
      message: >-
        spec.container.image must be set to an image in this environment's Artifact Registry ({{ $prefix }}...)
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: cloud-workstations-workstationconfig-image
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  policyName: cloud-workstations-workstationconfig-image
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: cloud-workstations
{{- end }}
