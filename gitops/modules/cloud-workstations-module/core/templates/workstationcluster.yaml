# One workstation cluster for the module. Created when the module is enabled and removed by the
# existing child-first drain on disable. Jenkins keeps sdv-cloud-ws-cluster.
{{- if include "cloud-workstations-core.mainEnv" . | eq "true" }}
{{- $cw := .Values.config.cloudWorkstations | default dict }}
{{- $clusterId := required "config.cloudWorkstations.clusterId is required" $cw.clusterId }}
{{- $network := required "config.cloudWorkstations.network is required" $cw.network }}
{{- $subnetwork := required "config.cloudWorkstations.subnetwork is required" $cw.subnetwork }}
{{- $project := required "config.projectID is required" .Values.config.projectID }}
{{- $location := required "config.region is required" .Values.config.region }}
{{- if eq $clusterId "sdv-cloud-ws-cluster" }}
{{- fail "config.cloudWorkstations.clusterId must not be the Jenkins-owned cluster sdv-cloud-ws-cluster" }}
{{- end }}
{{- if not (regexMatch "^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$" $clusterId) }}
{{- fail "config.cloudWorkstations.clusterId must match ^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$" }}
{{- end }}
{{- $networkRef := $network }}
{{- if not (hasPrefix "projects/" $network) }}
{{- $networkRef = printf "projects/%s/global/networks/%s" $project $network }}
{{- end }}
{{- $subnetworkRef := $subnetwork }}
{{- if not (hasPrefix "projects/" $subnetwork) }}
{{- $subnetworkRef = printf "projects/%s/regions/%s/subnetworks/%s" $project $location $subnetwork }}
{{- end }}
apiVersion: workstations.horizon-sdv.io/v1alpha1
kind: WorkstationCluster
metadata:
  name: {{ $clusterId | quote }}
  namespace: cloud-workstations
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | default "cloud-workstations" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: {{ $project | quote }}
  location: {{ $location | quote }}
  network: {{ $networkRef | quote }}
  subnetwork: {{ $subnetworkRef | quote }}
  resourceID: {{ $clusterId | quote }}
{{- end }}
