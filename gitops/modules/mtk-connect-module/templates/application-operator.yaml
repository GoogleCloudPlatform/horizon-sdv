# Child Application: MTK Connect controller (Deployment, RBAC, NetworkPolicies, CRD in the main environment).
# Runs in every environment, in that environment's <prefix>mtk-connect namespace.
{{- if and .Values.repo.url .Values.repo.revision }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-operator
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: mtk-connect-module
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/mtk-connect-module/operator
    helm:
      values: |
        parentModuleName: {{ .Values.moduleName | quote }}
        config:
{{ .Values.config | toYaml | nindent 10 }}
        credentialDistribution:
{{ .Values.credentialDistribution | toYaml | nindent 10 }}
        kubeApiServerCIDRs:
{{ .Values.kubeApiServerCIDRs | toYaml | nindent 10 }}
        testbenchNamespaceSuffixes:
{{ .Values.testbenchNamespaceSuffixes | toYaml | nindent 10 }}
        testbenchPolicy:
{{ .Values.testbenchPolicy | toYaml | nindent 10 }}
        testbenchURLPath: {{ .Values.testbenchURLPath | default "" | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.config.namespacePrefix }}mtk-connect
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      # Module Manager pauses this Application during disable, then turns self-heal off before
      # resuming it for parent-Application pruning. Outside that drain, repair manual changes.
      selfHeal: true
{{- end }}
