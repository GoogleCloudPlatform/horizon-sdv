# Child Application: the MTKConnectInstance custom resource that tells the controller how to
# integrate the MTK Connect server with Keycloak and distribute its API key.
{{- if and .Values.repo.url .Values.repo.revision }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-integration
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: mtk-connect-module
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/mtk-connect-module/integration
    helm:
      values: |
        parentModuleName: {{ .Values.moduleName | quote }}
        config:
{{ .Values.config | toYaml | nindent 10 }}
        keyRotation:
{{ .Values.keyRotation | toYaml | nindent 10 }}
        credentialDistribution:
{{ .Values.credentialDistribution | toYaml | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.config.namespacePrefix }}mtk-connect
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # The CRD is installed by the operator Application of the main environment.
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
{{- end }}
