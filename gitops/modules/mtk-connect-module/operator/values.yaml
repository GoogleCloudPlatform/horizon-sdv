# Module name, passed by the parent Application (injected by Module Manager).
parentModuleName: ""

# Passed by the parent Application (MODULE_CONFIG from Module Manager).
config:
  namespacePrefix: ""
  isSubEnvironment: false
  enableNetworkPolicies: true
  probeSourceCIDRs: []
  # Module-specific MODULE_CONFIG (docs/architecture/06_interfaces.md); containerImage is a full image ref.
  modules:
    mtk-connect:
      containerImage: ""

# Secrets that receive the service-account credentials (same list as the integration chart).
# namespaceSuffix is appended to config.namespacePrefix.
credentialDistribution: []

# Address(es) of the Kubernetes API server, reached by the controller (GKE private control plane:
# master_ipv4_cidr_block in terraform/modules/sdv-gke-cluster/main.tf). Kept outside `config` because
# MODULE_CONFIG replaces the whole `config` map.
kubeApiServerCIDRs:
  - 10.0.0.0/28

# Namespaces (appended to config.namespacePrefix) where MTKConnectTestbench resources are watched. The controller
# gets a Role in each of them and the admission policy applies to them.
testbenchNamespaceSuffixes:
  - workflows
  - jenkins

# Limits enforced by the ValidatingAdmissionPolicy when a testbench is created.
# allowedSubmittedFrom is the platform set (docs/architecture/06_interfaces.md).
testbenchPolicy:
  allowPublicAccess: true
  # Highest device index per testbench, and the range tunnel ports must be in.
  maxDevices: 8
  tunnelPortMin: 1024
  tunnelPortMax: 65535
  allowedPermissions:
    - book
  allowedSubmittedFrom:
    - api
    - developer-portal
    - horizon-cli
    - custom

# Portal path reported in status.url; {id} is replaced by the agent id. Empty uses the portal root /mtk-connect/.
testbenchURLPath: ""
