{{- /* The hyphen in the module name needs `index`; MODULE_CONFIG supplies config.modules.mtk-connect.containerImage. */ -}}
{{- $mod := index (default dict .Values.config.modules) "mtk-connect" | default dict }}
{{- $image := required "config.modules.mtk-connect.containerImage is required" $mod.containerImage }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtk-connect-module
  namespace: {{ include "mtk-connect-operator.namespace" . }}
  labels:
    app.kubernetes.io/name: mtk-connect-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mtk-connect-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mtk-connect-operator
    spec:
      serviceAccountName: mtk-connect-module-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ $image | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          ports:
            - name: metrics
              containerPort: 8080
            - name: healthz
              containerPort: 8081
          env:
            - name: MANAGER_NAMESPACE
              value: {{ include "mtk-connect-operator.namespace" . | quote }}
            - name: WATCH_NAMESPACES
              value: {{ include "mtk-connect-operator.watchNamespaces" . | quote }}
            - name: JENKINS_NAMESPACE
              value: {{ printf "%sjenkins" .Values.config.namespacePrefix | quote }}
            {{- with .Values.testbenchURLPath }}
            - name: TESTBENCH_URL_PATH
              value: {{ . | quote }}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
