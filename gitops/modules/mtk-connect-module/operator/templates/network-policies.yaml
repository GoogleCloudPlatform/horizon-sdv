{{- if .Values.config.enableNetworkPolicies }}
{{- $ns := include "mtk-connect-operator.namespace" . }}
# DNS is allowed namespace-wide by the platform's allow-dns policy, and the server accepts ingress on
# 8081 from any source (allow-mtk-connect-ingress-from-gateway). Keycloak already admits this namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mtk-connect-module-egress
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mtk-connect-operator
  policyTypes:
    - Egress
  egress:
    # Kubernetes API (secrets, pods/exec, deployments, events, leases). The GKE private control plane is
    # not a Pod in kube-system, so it is matched by address (terraform sdv-gke-cluster master_ipv4_cidr_block).
    - to:
        {{- range .Values.kubeApiServerCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # Keycloak admin API
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.config.namespacePrefix }}keycloak
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloakx
      ports:
        - protocol: TCP
          port: 8080
    # MTK Connect router (REST API)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mtk-connect
      ports:
        - protocol: TCP
          port: 8081
---
# Kubelet HTTP probes originate from the node IP (primary subnet), not the pod CIDR.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mtk-connect-module-ingress
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mtk-connect-operator
  policyTypes:
    - Ingress
  ingress:
    {{- range .Values.config.probeSourceCIDRs }}
    - from:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 8081
    {{- end }}
{{- end }}
