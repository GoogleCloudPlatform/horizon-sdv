moduleName: ""
moduleManagerNamespace: module-manager
argocd:
  namespace: argocd
  project: horizon-sdv
repo:
  url: ""
  revision: HEAD
# Developer Portal overview (Module Manager GET /modules/{name}/overview).
# overviewNamespace is overridden by Module Manager with the catalog value (<prefix>mtk-connect-overview).
overviewServiceName: mod-mtk-connect-overview
overviewNamespace: mtk-connect-overview
# Module Manager replaces this entire map with MODULE_CONFIG, which includes nginx.
# These values exist so `helm template` can render the chart on its own.
config:
  namespacePrefix: ""
  nginx:
    image: nginx
    tag: 1.31.2-alpine3.23

softFeaturesEnabled: {}
