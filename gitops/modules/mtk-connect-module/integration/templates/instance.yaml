{{- $prefix := .Values.config.namespacePrefix }}
{{- $ns := printf "%smtk-connect" $prefix }}
{{- $domain := required "config.domain is required" .Values.config.domain }}
apiVersion: mtkconnect.horizon-sdv.io/v1alpha1
kind: MTKConnectInstance
metadata:
  name: default
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # The CRD is installed by the operator Application; do not fail the dry run before it exists.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  domain: {{ $domain | quote }}
  serviceAccountUser: mtk-connect-admin
  keycloak:
    url: {{ printf "http://%skeycloak-keycloakx-http.%skeycloak.svc.cluster.local:8080/auth" $prefix $prefix | quote }}
    realm: horizon
    adminUser: admin
    adminSecretRef:
      namespace: {{ printf "%skeycloak" $prefix | quote }}
      name: keycloak-initial-creds
      key: password
    samlClientId: mtk-connect
  server:
    # No /mtk-connect prefix: the gateway strips it (URLRewrite) before the request reaches the router.
    url: {{ printf "http://mtk-connect-router.%s.svc.cluster.local:8081" $ns | quote }}
    deployment: mtk-connect
    podSelector: app.kubernetes.io/name=mtk-connect
    container: authenticator
    keycloakSecret: mtk-connect-keycloak
    apiKeySecret: mtk-connect-apikey
  keyRotation:
    interval: {{ .Values.keyRotation.interval | quote }}
    keyLifetime: {{ .Values.keyRotation.keyLifetime | quote }}
    overlap: {{ .Values.keyRotation.overlap | quote }}
  credentialDistribution:
    {{- range .Values.credentialDistribution }}
    - namespace: {{ printf "%s%s" $prefix .namespaceSuffix | quote }}
      secretName: {{ .secretName | quote }}
      {{- if .jenkinsCredential }}
      jenkinsCredential: true
      {{- end }}
      {{- with .labels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
