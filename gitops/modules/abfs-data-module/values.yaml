# Parent chart defaults for abfs-data-module. Module Manager injects moduleName,
# repo, and config when enabling the module from the Developer Portal.

# Module name (e.g. abfs-data) — used for child Application names mod-<name>-*.
moduleName: ""

# Namespace where Module Manager / ModuleCatalog runs.
moduleManagerNamespace: module-manager

# Argo CD target for parent and child Applications.
argocd:
  namespace: argocd
  project: horizon-sdv

# Git source for child Applications (set by Module Manager on enable).
repo:
  url: ""
  revision: HEAD

# In-cluster overview Service. A small Python server injects live status on each request.
overviewServiceName: mod-abfs-data-overview
overviewNamespace: abfs-data-overview
overview:
  image: python:3.12-alpine@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a

# Namespace of the ABFS data plane / ContainerNodePool (license WTs may recreate it).
abfsNamespace: abfs

# google-cloud-cli image for every abfs-data job and workflow (abfs-license-sa,
# license-workflows, spanner-workflows, uploader-config).
# Pinned by digest (SDK 591.0.0): newer builds of this tag have no python3 on PATH, which the ABFS scripts need. Bump digest and re-test before changing.
cloudSdkImage: gcr.io/google.com/cloudsdktool/google-cloud-cli:debian_component_based@sha256:f455f6bfd3d66abe3131ddff47d95c5f01061e8e91937285adcf2a86b5c82e48

# Platform config from Module Manager (projectID, region, storageLocation,
# namespacePrefix, isSubEnvironment, …). Empty here; filled at enable time.
config: {}
