# PostSync Job (wave 1): after IAMServiceAccount is applied, write uniqueId + email
# into ConfigMap abfs-license-sa-identity via kubectl apply (not Helm-owned), so the
# ConfigMap survives module disable/prune. The PreSync undelete Job reads it on
# re-enable. projectID is not stored — use Module Manager config.projectID.
# HookSucceeded deletes this Job after sync so Argo does not stay Missing/OutOfSync.

apiVersion: batch/v1
kind: Job
metadata:
  name: abfs-license-sa-persist-uniqueid
  namespace: {{ .Values.workflowsNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
    app.kubernetes.io/name: abfs-license-sa-persist-uniqueid
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: abfs-license-sa-persist-uniqueid
        horizon-sdv.io/module: abfs-data
    spec:
      serviceAccountName: {{ .Values.jobServiceAccountName }}
      restartPolicy: Never
      containers:
        - name: persist
          image: {{ .Values.cloudSdkImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PROJECT_ID
              value: {{ .Values.projectID | quote }}
            - name: SA_ID
              value: {{ .Values.serviceAccountId | quote }}
            - name: HORIZON_NS
              value: {{ .Values.horizonNamespace | quote }}
            - name: IDENTITY_CM
              value: {{ .Values.identityConfigMapName | quote }}
          command: [bash, -euo, pipefail, -c]
          args:
            - |
              set -euo pipefail
              {{ include "abfsLicenseSa.ensureKubectl" . | nindent 14 }}
              email="${SA_ID}@${PROJECT_ID}.iam.gserviceaccount.com"
              echo "Waiting for IAMServiceAccount ${SA_ID} / GCP SA ${email}..."

              for i in $(seq 1 90); do
                ready="$(kubectl get iamserviceaccount "${SA_ID}" -n "${HORIZON_NS}" \
                  -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
                if [[ "${ready}" == "True" ]]; then
                  break
                fi
                if gcloud iam service-accounts describe "${email}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done

              unique_id="$(gcloud iam service-accounts describe "${email}" \
                --project="${PROJECT_ID}" --format='value(uniqueId)')"
              if [[ -z "${unique_id}" ]]; then
                echo "ERROR: could not read UniqueID for ${email}" >&2
                exit 1
              fi

              echo "Persisting uniqueId=${unique_id} email=${email} to ConfigMap ${IDENTITY_CM} in ${HORIZON_NS}"
              # Not owned by this Application so disable/prune keeps it.
              # uniqueId + email only — do not store projectID.
              kubectl create configmap "${IDENTITY_CM}" \
                --namespace="${HORIZON_NS}" \
                --from-literal=uniqueId="${unique_id}" \
                --from-literal=email="${email}" \
                --dry-run=client -o yaml | kubectl apply -f -
              kubectl label configmap "${IDENTITY_CM}" -n "${HORIZON_NS}" \
                "horizon-sdv.io/module=abfs-data" \
                "app.kubernetes.io/name=abfs-license-sa-identity" \
                --overwrite
              # Drop legacy projectID key if an older ConfigMap still has it.
              kubectl patch configmap "${IDENTITY_CM}" -n "${HORIZON_NS}" --type json \
                -p '[{"op":"remove","path":"/data/projectID"}]' \
                2>/dev/null || true

              stored_uid="$(kubectl get configmap "${IDENTITY_CM}" -n "${HORIZON_NS}" \
                -o jsonpath='{.data.uniqueId}')"
              stored_email="$(kubectl get configmap "${IDENTITY_CM}" -n "${HORIZON_NS}" \
                -o jsonpath='{.data.email}')"
              if [[ "${stored_uid}" != "${unique_id}" ]]; then
                echo "ERROR: ConfigMap uniqueId mismatch stored=${stored_uid} expected=${unique_id}" >&2
                exit 1
              fi
              if [[ "${stored_email}" != "${email}" ]]; then
                echo "ERROR: ConfigMap email mismatch stored=${stored_email} expected=${email}" >&2
                exit 1
              fi
              echo "Identity persisted (uniqueId + email)."
