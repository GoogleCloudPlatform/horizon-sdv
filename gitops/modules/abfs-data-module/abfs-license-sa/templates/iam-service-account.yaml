# Normal delete on module disable (GCP soft-delete).
# UniqueID continuity relies on undelete.

apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: {{ .Values.serviceAccountId }}
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
    app.kubernetes.io/name: abfs-license
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    cnrm.cloud.google.com/project-id: {{ .Values.projectID | quote }}
spec:
  displayName: ABFS license
  description: ABFS license service account owned by abfs-data-module
