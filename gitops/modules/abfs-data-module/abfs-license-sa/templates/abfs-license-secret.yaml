# Placeholder for the Google-issued ABFS license JSON. Owned by this Argo child
# Application (Helm), so it is created when abfs-data is enabled and pruned when
# the module is disabled. Filled later via license WorkflowTemplates
# (import / clear).

apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.licenseSecretName }}
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
    app.kubernetes.io/name: abfs-license
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  # Empty until import/change workflows write the license payload.
  license: ""
