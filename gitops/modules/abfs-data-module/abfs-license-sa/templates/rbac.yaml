# Role/RoleBinding for the UniqueID Jobs (undelete PreSync + persist PostSync).
#
# Those Jobs run in the workflows namespace as workflow-executor-elevated (Workload
# Identity + roles/iam.serviceAccountAdmin for gcloud SA undelete), but they also
# need Kubernetes access in the horizon namespace: ConfigMaps (read/write identity)
# and IAMServiceAccount CRs (read).
#
# Applied as an Argo PreSync hook at wave -5 so this RBAC exists before the
# undelete Job (wave -2). hook-delete-policy is BeforeHookCreation only — not
# HookSucceeded — so the Role stays for the PostSync persist Job (wave 1).

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-data-sa-jobs
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["iam.cnrm.cloud.google.com"]
    resources: ["iamserviceaccounts"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-data-sa-jobs
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-data-sa-jobs
subjects:
  - kind: ServiceAccount
    name: {{ .Values.jobServiceAccountName }}
    namespace: {{ .Values.workflowsNamespace }}
