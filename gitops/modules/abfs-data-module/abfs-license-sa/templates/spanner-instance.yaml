# KCC SpannerInstance for ABFS persistent data.
# Created when abfs-data is enabled. On disable the CR is pruned; deletion-policy
# abandon leaves the GCP instance (and its data) in place — still billed until
# deleted in GCP. Must abandon the instance too: deleting it would wipe databases
# even if SpannerDatabase is abandoned. GCP instance id is "abfs"; config is
# regional-<region> from Module Manager config.region. Sync-wave 2 so the
# instance exists before SpannerDatabase (wave 3).

apiVersion: spanner.cnrm.cloud.google.com/v1beta1
kind: SpannerInstance
metadata:
  name: {{ .Values.spanner.instanceId }}
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
    app.kubernetes.io/name: abfs-spanner
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cnrm.cloud.google.com/project-id: {{ .Values.projectID | quote }}
    cnrm.cloud.google.com/deletion-policy: "abandon"
spec:
  resourceID: {{ .Values.spanner.instanceId | quote }}
  config: {{ printf "regional-%s" .Values.spanner.region | quote }}
  displayName: {{ .Values.spanner.displayName | quote }}
  numNodes: {{ .Values.spanner.numNodes }}
