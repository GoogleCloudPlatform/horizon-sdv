# KCC StorageBucket for ABFS underlying object storage (not storage-gcs-module /
# GCSBucket). Kubernetes name is typically "abfs"; GCP bucket name is
# <projectID>-abfs (resourceID). On disable the CR is pruned; deletion-policy
# abandon leaves the GCP bucket and objects in place (still billed until deleted
# in GCP). force-destroy:false is a second guard if abandon is ever removed.
# Sync-wave 2 (same wave as SpannerInstance).

apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: {{ .Values.gcs.bucketName }}
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
    app.kubernetes.io/name: abfs-gcs
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    cnrm.cloud.google.com/project-id: {{ .Values.projectID | quote }}
    cnrm.cloud.google.com/deletion-policy: "abandon"
    cnrm.cloud.google.com/force-destroy: "false"
spec:
  resourceID: {{ .Values.gcs.bucketResourceID | quote }}
  location: {{ .Values.gcs.location | quote }}
  uniformBucketLevelAccess: true
  storageClass: STANDARD
