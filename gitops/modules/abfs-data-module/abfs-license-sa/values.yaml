# Defaults for abfs-license-sa (parent Application overrides from Module Manager).

# Target namespaces (parent sets {namespacePrefix}horizon / workflows).
horizonNamespace: horizon
workflowsNamespace: workflows

# GCP project — from Module Manager config.projectID (not stored in identity ConfigMap).
projectID: ""

# KCC IAMServiceAccount id → abfs-license@<project>.iam.gserviceaccount.com
serviceAccountId: abfs-license

# Job-applied ConfigMap: uniqueId + email only; survives prune; used by undelete Job.
identityConfigMapName: abfs-license-sa-identity

# Helm-owned Secret placeholder (key license); created on enable, deleted on disable.
licenseSecretName: abfs-license

# Jobs need gcloud + kubectl. Use debian_component_based so kubectl can be
# installed at runtime (google-cloud-cli:stable does not ship kubectl).
jobServiceAccountName: workflow-executor-elevated
cloudSdkImage: gcr.io/google.com/cloudsdktool/google-cloud-cli:debian_component_based

# KCC StorageBucket — parent sets bucketResourceID (<projectID>-abfs) and location.
gcs:
  bucketName: abfs
  # Globally unique GCS bucket name (resourceID).
  bucketResourceID: ""
  location: ""

# KCC Spanner — parent sets region from config.region.
spanner:
  instanceId: abfs
  databaseId: abfs
  displayName: ABFS Spanner
  region: ""
  numNodes: 1
