# Lets workflow-executor-elevated (workflows namespace) rewrite ConfigMap
# abfs-uploader-config in horizon. Sync-wave 6, before the WorkflowTemplate.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-data-uploader-config
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.uploaderConfigMapName | quote }}]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-data-uploader-config
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-data-uploader-config
subjects:
  - kind: ServiceAccount
    name: {{ .Values.jobServiceAccountName }}
    namespace: {{ .Values.workflowNamespace }}
---
# Restart the uploader StatefulSet after the active row changes. Pod 0 then
# runs the pusher-config Job, which exits 0 when that row is already in ABFS.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-data-uploader-config-restart
  namespace: {{ .Values.abfsNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: [{{ .Values.uploaderStatefulSetName | quote }}]
    verbs: ["get", "patch"]
  # list/watch cannot be limited by resourceNames: kubectl rollout status watches the collection.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["{{ .Values.uploaderStatefulSetName }}-0"]
    verbs: ["get", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: [{{ .Values.pusherSyncJobName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-data-uploader-config-restart
  namespace: {{ .Values.abfsNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-data-uploader-config-restart
subjects:
  - kind: ServiceAccount
    name: {{ .Values.jobServiceAccountName }}
    namespace: {{ .Values.workflowNamespace }}
---
# Copy the AndroidCustom repo just written onto the WorkflowTemplate so the
# next form open shows it before the following Helm render.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-data-uploader-config-template
  namespace: {{ .Values.workflowNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtemplates"]
    resourceNames: ["abfs-uploader-config-select"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-data-uploader-config-template
  namespace: {{ .Values.workflowNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-data-uploader-config-template
subjects:
  - kind: ServiceAccount
    name: {{ .Values.jobServiceAccountName }}
    namespace: {{ .Values.workflowNamespace }}
