# Workflow template for selecting an android version for uploader seeding.
# Each dropdown label is the stored row name. The branch rides along in parentheses
# so the portal can show it; the selection script keeps only the name.
#
# Configuration is the one form box. AndroidCustom can edit it, and the saved
# repo is shown the next time that row is opened. A predefined version shows
# the same box read-only: its own branch, and the shared manifest url, file,
# and fetch-ref-spec from uploader values.

{{- $customBranch := "" }}
{{- $activeName := "" }}
{{- $activeChoice := "" }}
{{- range .Values.uploaderConfig.entries }}
{{- if eq .name "AndroidCustom" }}
{{- $customBranch = .branch }}
{{- end }}
{{- if .active }}
{{- $activeName = .name }}
{{- $activeChoice = printf "%s (%s)" .name .branch }}
{{- end }}
{{- end }}
{{- if not $customBranch }}
{{- fail "uploaderConfig.entries must include AndroidCustom" }}
{{- end }}
{{- if not $activeName }}
{{- fail "uploaderConfig.entries must mark one row active" }}
{{- end }}
{{- $savedRepo := dict }}
{{- $found := lookup "v1" "ConfigMap" .Values.horizonNamespace .Values.uploaderConfigMapName }}
{{- $tableText := "" }}
{{- if $found.data }}
{{- $tableText = index $found.data "table" | default "" }}
{{- end }}
{{- if $tableText }}
{{- range fromYamlArray $tableText }}
{{- if eq .name "AndroidCustom" }}
{{- $repo := .repo }}
{{- if and $repo (index $repo "url") (index $repo "branch") (index $repo "file") (index $repo "fetch-ref-spec") }}
{{- $savedRepo = $repo }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $showURL := .Values.uploaderConfig.manifestUrl }}
{{- $showBranch := $customBranch }}
{{- $showFile := .Values.uploaderConfig.manifestFile }}
{{- $showSpec := .Values.uploaderConfig.fetchRefSpec }}
{{- if index $savedRepo "url" }}
{{- $showURL = index $savedRepo "url" }}
{{- $showBranch = index $savedRepo "branch" }}
{{- $showFile = index $savedRepo "file" }}
{{- $showSpec = index $savedRepo "fetch-ref-spec" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: abfs-uploader-config-select
  namespace: {{ .Values.workflowNamespace }}
  labels:
    app.kubernetes.io/name: abfs-uploader-config-select
    horizon-sdv.io/module: abfs-data
    horizon-sdv.io/expose: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  entrypoint: select-uploader-config
  serviceAccountName: {{ .Values.jobServiceAccountName }}
  arguments:
    parameters:
      - name: Android_Versions
        description: "Android manifest row to seed. AndroidCustom edits Configuration."
        value: {{ $activeChoice | quote }}
        enum:
{{- range .Values.uploaderConfig.entries }}
          - {{ printf "%s (%s)" .name .branch | quote }}
{{- end }}
        
      - name: Configuration
        description: |
          Read-only unless Android_Versions is AndroidCustom.
          # predefined-template
          - name: AndroidCustom
            repo:
              url: {{ .Values.uploaderConfig.manifestUrl }}
              branch: {{ $customBranch }}
              file: {{ .Values.uploaderConfig.manifestFile }}
              fetch-ref-spec:
{{- range .Values.uploaderConfig.fetchRefSpec }}
              - {{ . }}
{{- end }}
        value: |
          - name: AndroidCustom
            repo:
              url: {{ $showURL }}
              branch: {{ $showBranch }}
              file: {{ $showFile }}
              fetch-ref-spec:
{{- range $showSpec }}
                - {{ . }}
{{- end }}
  templates:
    - name: select-uploader-config
      inputs:
        parameters:
          - name: Android_Versions
            value: "{{ "{{workflow.parameters.Android_Versions}}" }}"
          - name: Configuration
            value: "{{ "{{workflow.parameters.Configuration}}" }}"
      container:
        image: {{ .Values.cloudSdkImage | quote }}
        imagePullPolicy: IfNotPresent
        env:
          - name: HORIZON_NAMESPACE
            value: {{ .Values.horizonNamespace | quote }}
          - name: UPLOADER_CONFIGMAP
            value: {{ .Values.uploaderConfigMapName | quote }}
          - name: SELECTION
            value: "{{ "{{inputs.parameters.Android_Versions}}" }}"
          - name: CUSTOM_CONFIG
            value: "{{ "{{inputs.parameters.Configuration}}" }}"
          - name: DEFAULT_CUSTOM_CONFIG
            value: |
              - name: AndroidCustom
                repo:
                  url: {{ .Values.uploaderConfig.manifestUrl }}
                  branch: {{ $customBranch }}
                  file: {{ .Values.uploaderConfig.manifestFile }}
                  fetch-ref-spec:
{{- range .Values.uploaderConfig.fetchRefSpec }}
                    - {{ . }}
{{- end }}
          - name: WORKFLOW_TEMPLATE
            value: abfs-uploader-config-select
          - name: ABFS_NAMESPACE
            value: {{ .Values.abfsNamespace | quote }}
          - name: UPLOADER_STATEFULSET
            value: {{ .Values.uploaderStatefulSetName | quote }}
          - name: SYNC_JOB
            value: {{ .Values.pusherSyncJobName | quote }}
          - name: SYNC_TIMEOUT_SECONDS
            value: {{ .Values.syncTimeoutSeconds | quote }}
        command: [bash, -euo, pipefail, -c]
        args:
          - |
            set -euo pipefail
            if ! command -v kubectl >/dev/null 2>&1; then
              echo "Installing kubectl (gcloud components)..."
              gcloud components install kubectl --quiet
            fi
            if ! python3 -c "import yaml" >/dev/null 2>&1; then
              python3 -m pip install --quiet --break-system-packages pyyaml
            fi
            if ! kubectl get configmap "${UPLOADER_CONFIGMAP}" -n "${HORIZON_NAMESPACE}" -o jsonpath='{.data.table}' > /tmp/table.yaml; then
              echo "ERROR: ConfigMap ${HORIZON_NAMESPACE}/${UPLOADER_CONFIGMAP} not found (enable abfs-data uploader-config)" >&2
              exit 1
            fi
            python3 - << 'PY'
{{ .Files.Get "scripts/set_active_uploader_config.py" | nindent 12 }}
            PY
            kubectl patch configmap "${UPLOADER_CONFIGMAP}" -n "${HORIZON_NAMESPACE}" --type merge --patch-file /tmp/uploader-config-patch.json
            if [[ -s /tmp/android-custom-saved.yaml ]]; then
              kubectl get workflowtemplate "${WORKFLOW_TEMPLATE}" -o json > /tmp/wft.json
              python3 - << 'PY'
            import json
            wft = json.load(open("/tmp/wft.json"))
            text = open("/tmp/android-custom-saved.yaml").read()
            if not text.endswith("\n"):
                text += "\n"
            params = wft.get("spec", {}).get("arguments", {}).get("parameters", [])
            index = next((i for i, item in enumerate(params) if item.get("name") == "Configuration"), None)
            if index is None:
                raise SystemExit("ERROR: WorkflowTemplate is missing the Configuration parameter")
            json.dump(
                [{"op": "replace", "path": "/spec/arguments/parameters/%d/value" % index, "value": text}],
                open("/tmp/wft-configuration.patch.json", "w"),
            )
            print("patch Configuration index=%d chars=%d" % (index, len(text)))
            PY
              kubectl patch workflowtemplate "${WORKFLOW_TEMPLATE}" --type json --patch-file /tmp/wft-configuration.patch.json
            fi
            if [[ "$(tr -d '[:space:]' < /tmp/uploader-restart)" != "true" ]]; then
              echo "Selected row is already active; uploaders were not restarted"
              exit 0
            fi
            if ! kubectl get statefulset "${UPLOADER_STATEFULSET}" -n "${ABFS_NAMESPACE}" >/dev/null 2>&1; then
              echo "Updated ${HORIZON_NAMESPACE}/${UPLOADER_CONFIGMAP}; ${ABFS_NAMESPACE}/${UPLOADER_STATEFULSET} is absent, so uploaders were not restarted"
              exit 0
            fi

            # Pod 0 publishes the new ABFS ref through Job ${SYNC_JOB}. The pod is
            # deleted by the restart, so wait on that Job (a new one, by UID) and
            # then on the rollout, not on the pod.
            old_uid="$(kubectl get job "${SYNC_JOB}" -n "${ABFS_NAMESPACE}" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
            echo "Recreating ${UPLOADER_STATEFULSET}-0 so it publishes the new ABFS ref"
            kubectl delete pod "${UPLOADER_STATEFULSET}-0" -n "${ABFS_NAMESPACE}" --ignore-not-found --wait=false
            echo "Restarting ${UPLOADER_STATEFULSET} for all uploaders to pick up new ABFS ref"
            kubectl rollout restart "statefulset/${UPLOADER_STATEFULSET}" -n "${ABFS_NAMESPACE}"

            deadline=$(( $(date +%s) + SYNC_TIMEOUT_SECONDS ))
            echo "Waiting for ${ABFS_NAMESPACE}/${SYNC_JOB} to write the ABFS ref (timeout ${SYNC_TIMEOUT_SECONDS}s)"
            while :; do
              if (( $(date +%s) >= deadline )); then
                echo "ERROR: ${SYNC_JOB} did not complete within ${SYNC_TIMEOUT_SECONDS}s; check ${UPLOADER_STATEFULSET}-0 init container select-uploader-config" >&2
                exit 1
              fi
              uid="$(kubectl get job "${SYNC_JOB}" -n "${ABFS_NAMESPACE}" -o jsonpath='{.metadata.uid}' 2>/dev/null || true)"
              if [[ -n "${uid}" && "${uid}" != "${old_uid}" ]]; then
                complete="$(kubectl get job "${SYNC_JOB}" -n "${ABFS_NAMESPACE}" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)"
                failed="$(kubectl get job "${SYNC_JOB}" -n "${ABFS_NAMESPACE}" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
                if [[ "${complete}" == "True" ]]; then
                  echo "${SYNC_JOB} completed: ABFS ref matches the active row"
                  break
                fi
                if [[ "${failed}" == "True" ]]; then
                  echo "ERROR: ${SYNC_JOB} failed; see: kubectl logs -n ${ABFS_NAMESPACE} job/${SYNC_JOB}" >&2
                  exit 1
                fi
              fi
              sleep 10
            done

            # Uploaders become Ready only once the ABFS ref matches the active row.
            remaining=$(( deadline - $(date +%s) ))
            (( remaining > 0 )) || remaining=1
            kubectl rollout status "statefulset/${UPLOADER_STATEFULSET}" -n "${ABFS_NAMESPACE}" --timeout="${remaining}s"
            echo "Uploaders restarted and seeding the active row"
