# Portal submit for abfs-uploader-config-select. Sensor lives in argo-events.

apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-abfs-uploader-config-select
  namespace: {{ .Values.eventsNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - "abfs-uploader-config-select"
  triggers:
    - template:
        name: submit-abfs-uploader-config-select
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: abfs-uploader-config-select-
                namespace: {{ .Values.workflowNamespace }}
                labels:
                  horizon-sdv.io/module: abfs-data
              spec:
                workflowTemplateRef:
                  name: abfs-uploader-config-select
                arguments:
                  parameters:
                    - name: Android_Versions
                    - name: Configuration
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
            - src:
                dependencyName: webhook-dep
                dataKey: body.Android_Versions
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.Configuration
              dest: spec.arguments.parameters.1.value
