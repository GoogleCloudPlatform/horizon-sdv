# Uploader manifest table. Owned by abfs-data (this chart, horizon namespace),
# so it remains when abfs-service is disabled. Key "table" is a YAML list of entries.
# Exactly one is active at first enable, and that same row is synced.
# A selection workflow will rewrite this data; the parent Application ignores /data so sync does not revert that write.

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.uploaderConfigMapName }}
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
    app.kubernetes.io/name: abfs-uploader-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  table: |
{{- range .Values.uploaderConfig.entries }}
    - name: {{ .name | quote }}
{{- if not (eq .storeRepo false) }}
      repo:
        url: {{ $.Values.uploaderConfig.manifestUrl | quote }}
        branch: {{ .branch | quote }}
        file: {{ $.Values.uploaderConfig.manifestFile | quote }}
        fetch-ref-spec:
{{- range $.Values.uploaderConfig.fetchRefSpec }}
          - {{ . | quote }}
{{- end }}
{{- end }}
      active: {{ .active }}
      synced: {{ .active }}
{{- end }}
