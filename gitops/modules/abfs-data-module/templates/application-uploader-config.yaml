# Child Argo CD Application: mod-<module>-uploader-config
# Deploys the uploader manifest table into horizon, plus the selection
# WorkflowTemplate (workflows) and its Sensor (argo-events).

{{- if not (default false .Values.config.isSubEnvironment) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-uploader-config
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.moduleName }}
    horizon-sdv.io/module: {{ .Values.moduleName }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/abfs-data-module/uploader-config
    helm:
      values: |
        horizonNamespace: {{ .Values.config.namespacePrefix }}horizon
        workflowNamespace: {{ .Values.config.namespacePrefix }}workflows
        eventsNamespace: {{ .Values.config.namespacePrefix }}argo-events
        uploaderConfigMapName: abfs-uploader-config
        jobServiceAccountName: workflow-executor-elevated
        abfsNamespace: {{ .Values.abfsNamespace | default "abfs" | quote }}
        uploaderStatefulSetName: abfs-gerrit-uploader
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.config.namespacePrefix }}horizon
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated: {}
  # A selection writes the ConfigMap table and the Configuration value.
  # Ignore both so a dropdown submit stays Synced and does not revert the saved repo.
  ignoreDifferences:
    - kind: ConfigMap
      name: abfs-uploader-config
      namespace: {{ .Values.config.namespacePrefix }}horizon
      jsonPointers:
        - /data
    - group: argoproj.io
      kind: WorkflowTemplate
      name: abfs-uploader-config-select
      namespace: {{ .Values.config.namespacePrefix }}workflows
      jsonPointers:
        - /spec/arguments/parameters/1/value
      jqPathExpressions:
        - '.spec.arguments.parameters[] | select(.name == "Configuration") | .value'
{{- end }}
