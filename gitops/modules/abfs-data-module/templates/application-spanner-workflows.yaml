# Spanner backup schedules. Lives in abfs-data-module because that module owns
# the Spanner instance and database; the schedules are created against them.

{{- if not (default false .Values.config.isSubEnvironment) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-spanner-workflows
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.moduleName }}
    horizon-sdv.io/module: {{ .Values.moduleName }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/abfs-data-module/spanner-workflows
    helm:
      values: |
        workflowNamespace: {{ .Values.config.namespacePrefix }}workflows
        eventsNamespace: {{ .Values.config.namespacePrefix }}argo-events
        horizonNamespace: {{ .Values.config.namespacePrefix }}horizon
        projectID: {{ .Values.config.projectID | quote }}
        jobServiceAccountName: workflow-executor-elevated
        spanner:
          instanceId: abfs
          databaseId: abfs
        mainEnv: {{ not (default false .Values.config.isSubEnvironment) }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.config.namespacePrefix }}workflows
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
{{- end }}
