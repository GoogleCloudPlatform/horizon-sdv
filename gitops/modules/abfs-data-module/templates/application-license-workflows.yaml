# Child Argo CD Application: mod-<module>-license-workflows
# Deploys license-workflows/ (WorkflowTemplates + Argo Events Sensors + RBAC).
#
# Sensors are required for Developer Portal / Horizon API submit (webhook →
# Workflow). Kept as a separate Application from abfs-license-sa so Argo CD only
# validates WorkflowTemplate CRDs after Argo Workflows is installed.
#
# Skipped for sub-environments (config.isSubEnvironment). Destination namespace
# is workflows; Sensors are rendered into argo-events via Helm values.

{{- if not (default false .Values.config.isSubEnvironment) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-license-workflows
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.moduleName }}
    horizon-sdv.io/module: {{ .Values.moduleName }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/abfs-data-module/license-workflows
    helm:
      values: |
        workflowNamespace: {{ .Values.config.namespacePrefix }}workflows
        eventsNamespace: {{ .Values.config.namespacePrefix }}argo-events
        horizonNamespace: {{ .Values.config.namespacePrefix }}horizon
        licenseSecretName: abfs-license
        projectID: {{ .Values.config.projectID | quote }}
        serviceAccountId: abfs-license
        identityConfigMapName: abfs-license-sa-identity
        abfsNamespace: {{ .Values.abfsNamespace | default "abfs" | quote }}
        dataNodePoolNames:
          - abfs-data-server-node-pool
          - abfs-data-uploader-node-pool
        mainEnv: {{ not (default false .Values.config.isSubEnvironment) }}
        jobServiceAccountName: workflow-executor-elevated
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.config.namespacePrefix }}workflows
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated: {}
{{- end }}
