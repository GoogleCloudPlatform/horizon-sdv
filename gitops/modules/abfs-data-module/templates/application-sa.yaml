# Child Argo CD Application: mod-<module>-sa
# Deploys abfs-license-sa/ into the horizon namespace:
#   - KCC IAMServiceAccount abfs-license (+ UniqueID undelete/persist Jobs)
#   - Secret abfs-license (license placeholder)
#   - KCC Spanner instance/database abfs
#   - KCC StorageBucket <projectID>-abfs
#
# Skipped for sub-environments. ignoreDifferences + RespectIgnoreDifferences
# keep workflow-written Secret data.license from being wiped on auto-sync.

{{- if not (default false .Values.config.isSubEnvironment) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName }}-sa
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.moduleName }}
    horizon-sdv.io/module: {{ .Values.moduleName }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/abfs-data-module/abfs-license-sa
    helm:
      values: |
        horizonNamespace: {{ .Values.config.namespacePrefix }}horizon
        workflowsNamespace: {{ .Values.config.namespacePrefix }}workflows
        projectID: {{ .Values.config.projectID | quote }}
        serviceAccountId: abfs-license
        identityConfigMapName: abfs-license-sa-identity
        licenseSecretName: abfs-license
        gcs:
          bucketName: abfs
          bucketResourceID: {{ .Values.config.projectID }}-abfs
          location: {{ .Values.config.storageLocation | quote }}
        spanner:
          instanceId: abfs
          databaseId: abfs
          displayName: ABFS Spanner
          region: {{ .Values.config.region | quote }}
          numNodes: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.config.namespacePrefix }}horizon
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated: {}
  # License workflows patch data.license; ignore drift so sync does not clear it.
  ignoreDifferences:
    - kind: Secret
      name: abfs-license
      namespace: {{ .Values.config.namespacePrefix }}horizon
      jsonPointers:
        - /data
        - /stringData
{{- end }}
