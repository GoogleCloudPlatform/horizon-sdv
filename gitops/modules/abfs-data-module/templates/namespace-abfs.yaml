# ABFS namespace (abfsNamespace, default "abfs").
#
# The child Applications license-workflows and uploader-config deploy RBAC into this
# namespace (pool recreate, uploader restart) while their destination is workflows/horizon,
# so CreateNamespace=true on them never creates it. Without it their sync fails with
# "error running rbacReconcile: ... namespaces \"abfs\" not found" (TAA-2383).
# abfs-data is the first ABFS module to be enabled, so it creates the namespace here, synced
# with the parent module Application before the child Applications (sync-wave -1).
#
# The namespace is shared with abfs-service-module (ABFS server, uploaders, ContainerNodePool
# CRs). Prune=false,Delete=false: disabling abfs-data, or dropping this file, must never delete
# the namespace and with it the ABFS service and its GKE node pools.

{{- if not (default false .Values.config.isSubEnvironment) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.abfsNamespace | default "abfs" }}
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | default "abfs-data" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
{{- end }}
