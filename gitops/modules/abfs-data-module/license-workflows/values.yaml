# Defaults for license-workflows (parent Application overrides from Module Manager).

# Where WorkflowTemplates and submitted Workflows run.
workflowNamespace: workflows

# Where Argo Events Sensors are installed (must match platform EventSource/EventBus).
eventsNamespace: argo-events

# Namespace of Secret abfs-license (patched by the workflows).
horizonNamespace: horizon
licenseSecretName: abfs-license

# ABFS data plane namespace + KCC ContainerNodePool names (optional recreate after Secret write).
# Both ABFS Server and ABFS Uploader pools carry the licence metadata; a missing pool is skipped.
abfsNamespace: abfs
dataNodePoolNames:
  - abfs-data-server-node-pool
  - abfs-data-uploader-node-pool

# Used when Apply verifies the pasted licence.
projectID: ""
serviceAccountId: abfs-license
identityConfigMapName: abfs-license-sa-identity

# Main environment only — parent sets false for sub-environments (skip WTs/Sensors).
mainEnv: true

# WI → gke-argo-workflows-elevated-sa (kubectl delete ContainerNodePool; Secret patch).
jobServiceAccountName: workflow-executor-elevated

# google-cloud-cli image (gcloud + kubectl via debian_component_based).
cloudSdkImage: gcr.io/google.com/cloudsdktool/google-cloud-cli:debian_component_based
