# RBAC for license WorkflowTemplates (import / clear).
# Workflow pods run as workflow-executor-elevated in the workflows namespace.
# Sync-wave 6 — before WorkflowTemplates (wave 7).

{{- if .Values.mainEnv }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-data-license-workflows
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.licenseSecretName | quote }}]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.identityConfigMapName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-data-license-workflows
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-data-license-workflows
subjects:
  - kind: ServiceAccount
    name: {{ .Values.jobServiceAccountName }}
    namespace: {{ .Values.workflowNamespace }}
---
# Optional: delete the ABFS Server/Uploader ContainerNodePools in abfs so Argo recreates them with licence metadata.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: abfs-data-license-workflows-pool
  namespace: {{ .Values.abfsNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
rules:
  - apiGroups: ["container.cnrm.cloud.google.com"]
    resources: ["containernodepools"]
    resourceNames: {{ .Values.dataNodePoolNames | default list | toJson }}
    verbs: ["get", "delete", "list", "watch"]
  - apiGroups: ["container.cnrm.cloud.google.com"]
    resources: ["containernodepools"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: abfs-data-license-workflows-pool
  namespace: {{ .Values.abfsNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: abfs-data-license-workflows-pool
subjects:
  - kind: ServiceAccount
    name: {{ .Values.jobServiceAccountName }}
    namespace: {{ .Values.workflowNamespace }}
{{- end }}
