# Argo Events Sensors for license WorkflowTemplates (import / clear).
#
# Flow: Developer Portal or Horizon API POST → EventSource "webhook" /
# workflow-dispatch → matching Sensor → submit Workflow in workflows namespace.
# Without these Sensors, Portal Configure & submit never creates a run.
#
# Installed in eventsNamespace (argo-events). Sync-wave 8 — after WorkflowTemplates
# (wave 7). Each Sensor filters on body.workflowTemplateName.
# Submit-source / submitter are stamped from the webhook body onto Workflow
# metadata (label / annotation), not as WorkflowTemplate parameters.

{{- if .Values.mainEnv }}
# --- import: map licensePayload from webhook body ---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-abfs-license-import
  namespace: {{ .Values.eventsNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - "abfs-license-import"
  triggers:
    - template:
        name: submit-abfs-license-import
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: abfs-license-import-
                namespace: {{ .Values.workflowNamespace }}
                labels:
                  horizon-sdv.io/module: abfs-data
              spec:
                workflowTemplateRef:
                  name: abfs-license-import
                arguments:
                  parameters:
                    - name: licensePayload
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
            - src:
                dependencyName: webhook-dep
                dataKey: body.licensePayload
              dest: spec.arguments.parameters.0.value
---
# --- clear: confirm defaults to yes (Portal needs a non-null parameter list) ---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-abfs-license-clear
  namespace: {{ .Values.eventsNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - "abfs-license-clear"
  triggers:
    - template:
        name: submit-abfs-license-clear
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: abfs-license-clear-
                namespace: {{ .Values.workflowNamespace }}
                labels:
                  horizon-sdv.io/module: abfs-data
              spec:
                workflowTemplateRef:
                  name: abfs-license-clear
                arguments:
                  parameters:
                    - name: confirm
                      value: "yes"
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
{{- end }}
