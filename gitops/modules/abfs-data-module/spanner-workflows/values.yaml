# Namespaces; the parent Application prefixes these for sub-environments.
workflowNamespace: workflows
horizonNamespace: horizon
# Where the Argo Events Sensor is installed (platform EventSource/EventBus).
eventsNamespace: argo-events

# Empty here; the parent Application fills it from config.projectID.
projectID: ""

# -- spanner -- the instance and database this module owns. Backup schedules are
# created only against these; the Jenkins job this replaces iterated every
# Spanner instance in the project, which meant CREATE and DELETE reached
# instances that have nothing to do with ABFS.
spanner:
  instanceId: abfs
  databaseId: abfs

# -- jobServiceAccountName -- the KSA the workflow pod runs as. Same account as
# the other abfs-data workflows (license-workflows): it is bound through Workload
# Identity in Terraform to gke-argo-workflows-elevated-sa, which already holds
# roles/spanner.admin, as the Jenkins job's account did. A dedicated account
# needs its Workload Identity binding in Terraform: Config Connector cannot set
# IAM policy on a service account or a Spanner instance.
jobServiceAccountName: workflow-executor-elevated

cloudSdkImage: gcr.io/google.com/cloudsdktool/google-cloud-cli:debian_component_based

# Sub-environments reuse the main environment's account and workflows.
mainEnv: true
