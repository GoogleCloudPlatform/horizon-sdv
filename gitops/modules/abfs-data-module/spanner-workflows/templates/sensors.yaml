# Argo Events Sensor for the abfs-spanner-backup-schedule WorkflowTemplate.
#
# Flow: Developer Portal or Horizon API POST → EventSource "webhook" /
# workflow-dispatch → this Sensor → submit Workflow in workflows namespace.
# Without it, Portal Configure & submit never creates a run.
#
# Installed in eventsNamespace (argo-events), after the WorkflowTemplate. Filters
# on body.workflowTemplateName. Submit-source / submitter are stamped from the
# webhook body onto Workflow metadata (label / annotation), as the license
# Sensors do.

{{- if .Values.mainEnv }}
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-abfs-spanner-backup-schedule
  namespace: {{ .Values.eventsNamespace }}
  labels:
    horizon-sdv.io/module: abfs-data
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - "^abfs-spanner-backup-schedule$"
  triggers:
    - template:
        name: submit-abfs-spanner-backup-schedule
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: abfs-spanner-backup-schedule-
                namespace: {{ .Values.workflowNamespace }}
                labels:
                  horizon-sdv.io/module: abfs-data
              spec:
                workflowTemplateRef:
                  name: abfs-spanner-backup-schedule
                arguments:
                  parameters:
                    - name: backupScheduleAction
                    - name: backupScheduleId
                    - name: cron
                    - name: retentionDuration
                    - name: confirm
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
            - src:
                dependencyName: webhook-dep
                dataKey: body.backupScheduleAction
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.backupScheduleId
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.cron
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.retentionDuration
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.confirm
                value: "no"
              dest: spec.arguments.parameters.4.value
{{- end }}
