# Spanner backup schedules for the ABFS database.
#
# Same parameters and actions as the former update_spanner_backups Jenkins
# job, with two deliberate differences:
#
#   - it acts only on the instance and database this module owns, where the
#     Jenkins job looped over every Spanner instance in the project, so CREATE,
#     UPDATE and DELETE reached unrelated instances
#   - DATABASE is used consistently; the Jenkins job listed schedules against
#     the supplied name but described them against one derived from the last
#     backup it happened to find

{{- if .Values.mainEnv }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: abfs-spanner-backup-schedule
  namespace: {{ .Values.workflowNamespace }}
  labels:
    app.kubernetes.io/name: abfs-spanner-backup-schedule
    horizon-sdv.io/module: abfs-data
    horizon-sdv.io/expose: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  entrypoint: backup-schedule
  serviceAccountName: {{ .Values.jobServiceAccountName }}
  arguments:
    parameters:
      - name: backupScheduleAction
        value: DETAILS
        description: "DETAILS, CREATE, UPDATE or DELETE."
      - name: backupScheduleId
        value: ""
        description: "Schedule identifier. Leave empty for DETAILS to list every schedule; required otherwise."
      - name: cron
        value: "0 23 * * *"
        description: "Backup schedule in crontab format. CREATE and UPDATE only. Default is daily at 23:00."
      - name: retentionDuration
        value: "604800"
        description: "Retention in seconds. CREATE and UPDATE only. Default is 7 days."
      - name: confirm
        value: "no"
        description: "Type yes to delete the backup schedule. Ignored by DETAILS, CREATE and UPDATE."
  templates:
    - name: backup-schedule
      inputs:
        parameters:
          - name: backupScheduleAction
            value: "{{ "{{workflow.parameters.backupScheduleAction}}" }}"
          - name: backupScheduleId
            value: "{{ "{{workflow.parameters.backupScheduleId}}" }}"
          - name: cron
            value: "{{ "{{workflow.parameters.cron}}" }}"
          - name: retentionDuration
            value: "{{ "{{workflow.parameters.retentionDuration}}" }}"
          - name: confirm
            value: "{{ "{{workflow.parameters.confirm}}" }}"
      container:
        image: {{ .Values.cloudSdkImage | quote }}
        imagePullPolicy: IfNotPresent
        env:
          - name: PROJECT_ID
            value: {{ .Values.projectID | quote }}
          - name: SPANNER_INSTANCE
            value: {{ .Values.spanner.instanceId | quote }}
          - name: DATABASE
            value: {{ .Values.spanner.databaseId | quote }}
          - name: ACTION
            value: "{{ "{{inputs.parameters.backupScheduleAction}}" }}"
          - name: SCHEDULE_ID
            value: "{{ "{{inputs.parameters.backupScheduleId}}" }}"
          - name: CRON
            value: "{{ "{{inputs.parameters.cron}}" }}"
          - name: RETENTION_DURATION
            value: "{{ "{{inputs.parameters.retentionDuration}}" }}"
          - name: CONFIRM
            value: "{{ "{{inputs.parameters.confirm}}" }}"
        command: [bash, -euo, pipefail, -c]
        args:
          - |
            set -euo pipefail

            # Values typed into the Portal can carry stray spaces: a pasted
            # " 172800" reached gcloud as " 172800s" and UPDATE failed.
            trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; printf '%s' "${v%"${v##*[![:space:]]}"}"; }
            ACTION="$(trim "${ACTION}")"
            # Accept 'delete' or 'Delete' as DELETE.
            ACTION="${ACTION^^}"
            SCHEDULE_ID="$(trim "${SCHEDULE_ID}")"
            CRON="$(trim "${CRON}")"
            RETENTION_DURATION="$(trim "${RETENTION_DURATION}")"
            CONFIRM="$(trim "${CONFIRM}")"

            # Run gcloud and stop on failure with what was being done and gcloud's
            # own error, so a permission error is not reported as a missing
            # instance and nothing after it assumes success. stdout is passed
            # through for the callers that read it.
            GCLOUD_ERR="$(mktemp)"
            gcloud_or_fail() {
              local what="$1" rc=0
              shift
              gcloud "$@" 2>"${GCLOUD_ERR}" || rc=$?
              if (( rc != 0 )); then
                echo "ERROR: cannot ${what} (gcloud exit ${rc}):" >&2
                cat "${GCLOUD_ERR}" >&2
                exit "${rc}"
              fi
              cat "${GCLOUD_ERR}" >&2
            }

            gcloud_or_fail "set project ${PROJECT_ID}" config set project "${PROJECT_ID}" --quiet

            # The instance and database must exist before anything is scheduled
            # against them; abfs-data-module creates both.
            gcloud_or_fail "read Spanner instance ${SPANNER_INSTANCE} in ${PROJECT_ID} (if NOT_FOUND, enable abfs-data first)" \
              spanner instances describe "${SPANNER_INSTANCE}" >/dev/null
            gcloud_or_fail "read database ${DATABASE} in instance ${SPANNER_INSTANCE}" \
              spanner databases describe "${DATABASE}" --instance="${SPANNER_INSTANCE}" >/dev/null

            require_schedule_id() {
              if [[ -z "${SCHEDULE_ID}" ]]; then
                echo "ERROR: backupScheduleId is required for ${ACTION}" >&2
                exit 1
              fi
            }

            # The 's' suffix is added below; '3d' or '78s' would reach gcloud
            # as '3ds' or '78ss'.
            require_retention_seconds() {
              if [[ ! "${RETENTION_DURATION}" =~ ^[0-9]+$ ]]; then
                echo "ERROR: retentionDuration must be a number of seconds, got '${RETENTION_DURATION}'" >&2
                exit 1
              fi
            }

            case "${ACTION}" in
              DETAILS)
                if [[ -n "${SCHEDULE_ID}" ]]; then
                  schedules="${SCHEDULE_ID}"
                else
                  schedules="$(gcloud_or_fail "list backup schedules on ${SPANNER_INSTANCE}/${DATABASE}" \
                    spanner backup-schedules list \
                    --instance="${SPANNER_INSTANCE}" --database="${DATABASE}" \
                    --format='value(name)')"
                fi
                if [[ -z "${schedules}" ]]; then
                  echo "No backup schedules on ${SPANNER_INSTANCE}/${DATABASE}"
                  exit 0
                fi
                while IFS= read -r schedule; do
                  [[ -z "${schedule}" ]] && continue
                  # Describe outside echo: inside "$(...)" a failed describe (an
                  # unknown ID) was swallowed and DETAILS still succeeded.
                  details="$(gcloud_or_fail "read backup schedule ${schedule} on ${SPANNER_INSTANCE}/${DATABASE}" \
                    spanner backup-schedules describe "${schedule}" \
                    --instance="${SPANNER_INSTANCE}" --database="${DATABASE}" \
                    --format='value(spec.cronSpec.text,retentionDuration)')"
                  IFS=$'\t' read -r schedule_cron schedule_retention <<< "${details}"
                  echo "Backup schedule: ${schedule}"
                  echo "  cron:      ${schedule_cron}"
                  echo "  retention: ${schedule_retention}"
                done <<< "${schedules}"
                ;;

              CREATE)
                require_schedule_id
                require_retention_seconds
                gcloud_or_fail "create backup schedule ${SCHEDULE_ID} on ${SPANNER_INSTANCE}/${DATABASE}" \
                  spanner backup-schedules create "${SCHEDULE_ID}" \
                  --instance="${SPANNER_INSTANCE}" \
                  --database="${DATABASE}" \
                  --cron="${CRON}" \
                  --retention-duration="${RETENTION_DURATION}s" \
                  --encryption-type=USE_DATABASE_ENCRYPTION \
                  --backup-type=full-backup
                echo "Created ${SCHEDULE_ID} on ${SPANNER_INSTANCE}/${DATABASE}"
                ;;

              UPDATE)
                require_schedule_id
                require_retention_seconds
                gcloud_or_fail "update backup schedule ${SCHEDULE_ID} on ${SPANNER_INSTANCE}/${DATABASE}" \
                  spanner backup-schedules update "${SCHEDULE_ID}" \
                  --instance="${SPANNER_INSTANCE}" \
                  --database="${DATABASE}" \
                  --cron="${CRON}" \
                  --retention-duration="${RETENTION_DURATION}s" \
                  --encryption-type=USE_DATABASE_ENCRYPTION
                echo "Updated ${SCHEDULE_ID} on ${SPANNER_INSTANCE}/${DATABASE}"
                ;;

              DELETE)
                require_schedule_id
                if [[ "${CONFIRM,,}" != "yes" ]]; then
                  echo "ERROR: not deleting ${SCHEDULE_ID}: set confirm to yes to delete it" >&2
                  exit 1
                fi
                gcloud_or_fail "delete backup schedule ${SCHEDULE_ID} on ${SPANNER_INSTANCE}/${DATABASE}" \
                  spanner backup-schedules delete "${SCHEDULE_ID}" \
                  --instance="${SPANNER_INSTANCE}" \
                  --database="${DATABASE}" \
                  --quiet
                echo "Deleted ${SCHEDULE_ID} from ${SPANNER_INSTANCE}/${DATABASE}"
                ;;

              *)
                echo "ERROR: unsupported backupScheduleAction '${ACTION}' (DETAILS, CREATE, UPDATE, DELETE)" >&2
                exit 1
                ;;
            esac
{{- end }}
