# WorkflowTemplates for module sample (Horizon catalog: exposed). Argo Events: templates/sensors.yaml.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sample-smoke-test
  namespace: {{ .Values.workflowNamespace }}
  labels:
    app.kubernetes.io/name: smoke-test
    horizon-sdv.io/expose: "true"
    horizon-sdv.io/module: sample
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  entrypoint: run-smoke-test
  serviceAccountName: workflow-executor
  arguments:
    parameters:
      - name: horizonSubmittedFrom
        value: ""
      - name: sampleEnv
        value: ""
      - name: sampleBuildId
        value: ""
      - name: sampleNote
        value: ""
      # GCS bucket for smoke uploads (owned by sample-data; overridable at submit). Default from Helm.
      - name: gcsBucket
        value: {{ .Values.sampleWorkloadsDataBucket | default "" | quote }}
        description: "GCS bucket for upload phase (sample-data default: {projectID}-sample-workloads-data)."
      # Optional resumable chunked upload test (MiB). Set to "0" to skip; e.g. "5120" for 5 GiB (~5.37 GB).
      - name: largeUploadSizeMiB
        value: "0"
        description: "Optional resumable upload size in MiB (0 = skip). Example 5120 ≈ 5.37 GB."
      # Chunk size for large upload (MiB). Minimum effective chunk is 0.25 MiB (256 KiB).
      - name: largeUploadChunkMiB
        value: "32"
      # Optional pauses during resumable test: delayCount delays spread evenly (totalChunks ÷ delayCount).
      - name: largeUploadDelayCount
        value: "5"
      - name: largeUploadDelaySeconds
        value: "60"
  templates:
    - name: run-smoke-test
      dag:
        tasks:
          - name: log-parameters
            template: log-parameters
{{- if .Values.referenceSampleSoftWorkflowTemplate }}
          - name: sample-soft-stage
            template: sample-soft-stage
            depends: log-parameters
            # Soft stage is deploy-time controlled by referenceSampleSoftWorkflowTemplate.
{{- end }}
          - name: echo-and-artifact
            template: echo-and-artifact
{{- if .Values.referenceSampleSoftWorkflowTemplate }}
            depends: "log-parameters && sample-soft-stage"
{{- else }}
            depends: log-parameters
{{- end }}
{{- if .Values.referenceGcsEnabled }}
          - name: push-gcs-smoke-artifact
            templateRef:
              name: storage-gcs-upload
              template: upload
            depends: echo-and-artifact
            arguments:
              parameters:
                - name: bucket
                  value: "{{ "{{workflow.parameters.gcsBucket}}" }}"
                - name: objectPath
                  value: "sample-smoke-test/{{ "{{workflow.name}}" }}/smoke-test.tgz"
              artifacts:
                - name: file
                  from: "{{ "{{tasks.echo-and-artifact.outputs.artifacts.smoke-test}}" }}"
            # Upload via storage-gcs-upload (REST API not called directly from this chart).
          - name: large-file-resumable-upload
            templateRef:
              name: storage-gcs-upload
              template: resumable-upload
            depends: push-gcs-smoke-artifact
            arguments:
              parameters:
                - name: bucket
                  value: "{{ "{{workflow.parameters.gcsBucket}}" }}"
                - name: objectPath
                  value: "sample-smoke-test/{{ "{{workflow.name}}" }}/large-upload.bin"
                - name: totalSizeMiB
                  value: "{{ "{{workflow.parameters.largeUploadSizeMiB}}" }}"
                - name: chunkSizeMiB
                  value: "{{ "{{workflow.parameters.largeUploadChunkMiB}}" }}"
                - name: delayCount
                  value: "{{ "{{workflow.parameters.largeUploadDelayCount}}" }}"
                - name: delaySeconds
                  value: "{{ "{{workflow.parameters.largeUploadDelaySeconds}}" }}"
{{- end }}
          - name: verify-gcs
            template: verify-gcs
            # Same DAG must use only `depends` (not `dependencies`) once any task uses `depends` (Argo validation).
{{- if .Values.referenceGcsEnabled }}
            depends: "push-gcs-smoke-artifact && large-file-resumable-upload.Succeeded"
{{- else }}
            depends: echo-and-artifact
{{- end }}
    - name: log-parameters
      container:
        image: alpine:3.19
        # Parameters are passed as env vars and read as "$VAR" — never interpolated
        # into the script, so free-text values cannot break out into command execution.
        env:
          - name: SAMPLE_ENV
            value: '{{ "{{workflow.parameters.sampleEnv}}" }}'
          - name: SAMPLE_BUILD_ID
            value: '{{ "{{workflow.parameters.sampleBuildId}}" }}'
          - name: SAMPLE_NOTE
            value: '{{ "{{workflow.parameters.sampleNote}}" }}'
          - name: GCS_BUCKET
            value: '{{ "{{workflow.parameters.gcsBucket}}" }}'
          - name: LARGE_UPLOAD_SIZE_MIB
            value: '{{ "{{workflow.parameters.largeUploadSizeMiB}}" }}'
          - name: LARGE_UPLOAD_CHUNK_MIB
            value: '{{ "{{workflow.parameters.largeUploadChunkMiB}}" }}'
          - name: LARGE_UPLOAD_DELAY_COUNT
            value: '{{ "{{workflow.parameters.largeUploadDelayCount}}" }}'
          - name: LARGE_UPLOAD_DELAY_SECONDS
            value: '{{ "{{workflow.parameters.largeUploadDelaySeconds}}" }}'
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        command: [sh, -c]
        args:
          - |
            echo "WorkflowTemplate: smoke-test"
            echo "sampleEnv=${SAMPLE_ENV}"
            echo "sampleBuildId=${SAMPLE_BUILD_ID}"
            echo "sampleNote=${SAMPLE_NOTE}"
            echo "gcsBucket=${GCS_BUCKET} (sample-data owned bucket; overridable at submit)"
            echo "largeUploadSizeMiB=${LARGE_UPLOAD_SIZE_MIB} (optional; 0, empty, or invalid = skip resumable test)"
            echo "largeUploadChunkMiB=${LARGE_UPLOAD_CHUNK_MIB}"
            echo "largeUploadDelayCount=${LARGE_UPLOAD_DELAY_COUNT} (delays spread evenly; 0 = none)"
            echo "largeUploadDelaySeconds=${LARGE_UPLOAD_DELAY_SECONDS}"
            awk -v m="${LARGE_UPLOAD_SIZE_MIB}" 'BEGIN {
              if (m == "" || m !~ /^[0-9]+([.][0-9]+)?$/ || m + 0 <= 0) exit
              bytes = m * 1048576
              gb = bytes / 1000000000
              printf "Large upload enabled: %.2f MiB (%d bytes, %.3f GB)\n", m + 0, bytes, gb
            }'
            echo "at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
{{- if .Values.referenceSampleSoftWorkflowTemplate }}
    - name: sample-soft-stage
      steps:
        - - name: invoke-sample-soft-smoke-test
            templateRef:
              name: sample-soft-smoke-test
              template: run-smoke-test
            arguments:
              parameters:
                - name: horizonSubmittedFrom
                  value: "{{ "{{workflow.parameters.horizonSubmittedFrom}}" }}"
                - name: sampleEnv
                  value: "{{ "{{workflow.parameters.sampleEnv}}" }}"
                - name: sampleBuildId
                  value: "{{ "{{workflow.parameters.sampleBuildId}}" }}"
                - name: sampleNote
                  value: "{{ "{{workflow.parameters.sampleNote}}" }}"
{{- end }}
    - name: echo-and-artifact
      container:
        image: alpine:3.19
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        command: [sh, -c]
        args:
          - |
            echo "Smoke test running at $(date)"
            echo "SA: $(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)/$(cat /var/run/secrets/kubernetes.io/serviceaccount/..data/namespace 2>/dev/null || echo 'n/a')"
            echo "Smoke test passed - $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/result.txt
            cat /tmp/result.txt
            tar czf /tmp/smoke-test.tgz -C /tmp result.txt
            ls -la /tmp/smoke-test.tgz
      outputs:
        artifacts:
          - name: smoke-result
            path: /tmp/result.txt
          - name: smoke-test
            path: /tmp/smoke-test.tgz
    - name: verify-gcs
      container:
        image: alpine:3.19
        env:
          # Parameter via env var, not interpolated into the script.
          - name: LARGE_UPLOAD_SIZE_MIB
            value: '{{ "{{workflow.parameters.largeUploadSizeMiB}}" }}'
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        command: [sh, -c]
        args:
          - |
            echo "Artifact upload verified by reaching this step."
{{- if .Values.referenceGcsEnabled }}
            if awk -v m="${LARGE_UPLOAD_SIZE_MIB}" 'BEGIN {
              exit (m == "" || m !~ /^[0-9]+([.][0-9]+)?$/ || m + 0 <= 0)
            }'; then
              echo "Large resumable object: sample-smoke-test/{{ "{{workflow.name}}" }}/large-upload.bin"
            fi
{{- end }}
            echo "All checks passed."
---
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: sample-smoke-test-alt
  namespace: {{ .Values.workflowNamespace }}
  labels:
    app.kubernetes.io/name: smoke-test
    horizon-sdv.io/expose: "true"
    horizon-sdv.io/module: sample
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  entrypoint: run-smoke-test
  serviceAccountName: workflow-executor
  arguments:
    parameters:
      - name: horizonSubmittedFrom
        value: ""
      - name: releaseChannel
        value: ""
      - name: ticketId
        value: ""
      - name: owner
        value: ""
  templates:
    - name: run-smoke-test
      dag:
        tasks:
          - name: log-parameters
            template: log-parameters
          - name: echo-and-artifact
            template: echo-and-artifact
            dependencies: [log-parameters]
          - name: verify-gcs
            template: verify-gcs
            dependencies: [echo-and-artifact]
    - name: log-parameters
      container:
        image: alpine:3.19
        # Parameters via env vars, never interpolated into the script.
        env:
          - name: RELEASE_CHANNEL
            value: '{{ "{{workflow.parameters.releaseChannel}}" }}'
          - name: TICKET_ID
            value: '{{ "{{workflow.parameters.ticketId}}" }}'
          - name: OWNER
            value: '{{ "{{workflow.parameters.owner}}" }}'
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        command: [sh, -c]
        args:
          - |
            echo "WorkflowTemplate: smoke-test-alt (variant)"
            echo "releaseChannel=${RELEASE_CHANNEL}"
            echo "ticketId=${TICKET_ID}"
            echo "owner=${OWNER}"
            echo "at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - name: echo-and-artifact
      container:
        image: alpine:3.19
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        command: [sh, -c]
        args:
          - |
            echo "Smoke test running at $(date)"
            echo "SA: $(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)/$(cat /var/run/secrets/kubernetes.io/serviceaccount/..data/namespace 2>/dev/null || echo 'n/a')"
            echo "Smoke test passed - $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/result.txt
            cat /tmp/result.txt
      outputs:
        artifacts:
          - name: smoke-result
            path: /tmp/result.txt
    - name: verify-gcs
      container:
        image: alpine:3.19
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        command: [sh, -c]
        args:
          - |
            echo "Artifact upload verified by reaching this step."
            echo "All checks passed."
