#
# Step scripts for the aaos-sdv-dev-env pipeline, mounted at /scripts by the
# workflow templates.
#
# The scripts live as real files under files/ rather than as inline `args:`
# blocks so that they can be read, diffed, shell-linted and executed locally.
# This follows the same pattern as workloads-common's
# prepare-github-app-git-creds, which mounts files/github_app_installation_token.py
# the same way.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.parentModuleName }}-scripts
  namespace: {{ .Values.workflowNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: {{ .Values.parentModuleName }}
data:
  build-snapshot.sh: |
{{ .Files.Get "files/build-snapshot.sh" | indent 4 }}
  test-artifacts.sh: |
{{ .Files.Get "files/test-artifacts.sh" | indent 4 }}
  promote-snapshot.sh: |
{{ .Files.Get "files/promote-snapshot.sh" | indent 4 }}
  test_artifacts.bats: |
{{ .Files.Get "files/test_artifacts.bats" | indent 4 }}
