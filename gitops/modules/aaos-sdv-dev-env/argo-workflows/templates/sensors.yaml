#
# Argo Events Sensors for module aaos-sdv-dev-env (pair with workflowtemplates.yaml).
#
# NOTE: parameters are mapped POSITIONALLY onto spec.arguments.parameters.N.value,
# so the ordering below must stay in lock-step with the parameter list declared in
# workflowtemplates.yaml:
#   0 = horizonSubmittedFrom
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-{{ .Values.parentModuleName }}-init
  namespace: {{ .Values.eventsNamespace }}
  labels:
    app.kubernetes.io/name: init
    horizon-sdv.io/module: {{ .Values.parentModuleName }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - "{{ .Values.parentModuleName }}-init"
  triggers:
    - template:
        name: submit-{{ .Values.parentModuleName }}-init
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: {{ .Values.parentModuleName }}-init-
                namespace: {{ .Values.workflowNamespace }}
                labels:
                  horizon-sdv.io/module: {{ .Values.parentModuleName }}
              spec:
                workflowTemplateRef:
                  name: {{ .Values.parentModuleName }}-init
                arguments:
                  parameters:
                    - name: horizonSubmittedFrom
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: spec.arguments.parameters.0.value
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-{{ .Values.parentModuleName }}-execute
  namespace: {{ .Values.eventsNamespace }}
  labels:
    app.kubernetes.io/name: execute
    horizon-sdv.io/module: {{ .Values.parentModuleName }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            value:
              - "{{ .Values.parentModuleName }}-execute"
  triggers:
    - template:
        name: submit-{{ .Values.parentModuleName }}-execute
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: {{ .Values.parentModuleName }}-execute-
                namespace: {{ .Values.workflowNamespace }}
                labels:
                  horizon-sdv.io/module: {{ .Values.parentModuleName }}
              spec:
                workflowTemplateRef:
                  name: {{ .Values.parentModuleName }}-execute
                arguments:
                  parameters:
                    - name: horizonSubmittedFrom
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: spec.arguments.parameters.0.value
