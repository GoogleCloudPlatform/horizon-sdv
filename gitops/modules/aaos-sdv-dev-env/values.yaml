# Module name (injected by Module Manager when enabling). Derives child Application names.
moduleName: ""

# Namespace where Module Manager runs; the overview Service is created here so the
# Developer Portal can reach it (matches catalog overviewServiceNamespace).
moduleManagerNamespace: module-manager

# ArgoCD namespace and project for the child Application (passed by Module Manager).
argocd:
  namespace: argocd
  project: horizon-sdv

# Repo URL and revision for the child Application (passed by Module Manager).
repo:
  url: ""
  revision: HEAD

# Environment config injected by Module Manager (projectID, region, zone, namespacePrefix, ...).
config: {}

# Service backing the Developer Portal overview page (must match catalog overviewService).
overviewServiceName: mod-aaos-sdv-dev-env-overview

# Per soft-dependency module name -> enabled. Unused by this module; kept for Module Manager.
softFeaturesEnabled: {}
