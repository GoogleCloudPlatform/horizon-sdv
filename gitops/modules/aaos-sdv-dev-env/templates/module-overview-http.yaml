apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.overviewServiceName }}-html
  namespace: {{ .Values.moduleManagerNamespace }}
data:
  overview.html: |
{{ .Files.Get "portal/overview.html" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.overviewServiceName }}
  namespace: {{ .Values.moduleManagerNamespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.overviewServiceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.overviewServiceName }}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/portal/overview.html
              subPath: overview.html
      volumes:
        - name: html
          configMap:
            name: {{ .Values.overviewServiceName }}-html
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.overviewServiceName }}
  namespace: {{ .Values.moduleManagerNamespace }}
spec:
  selector:
    app: {{ .Values.overviewServiceName }}
  ports:
    - port: 80
      targetPort: 80
