apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.overviewServiceName }}-html
  namespace: {{ .Values.moduleManagerNamespace }}
data:
  index.html: |-
{{ .Files.Get "portal/overview.html" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.overviewServiceName }}
  namespace: {{ .Values.moduleManagerNamespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.overviewServiceName }}
  template:
    metadata:
      annotations:
        checksum/html: {{ .Files.Get "portal/overview.html" | sha256sum }}
      labels:
        app: {{ .Values.overviewServiceName }}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: html
          configMap:
            name: {{ .Values.overviewServiceName }}-html
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.overviewServiceName }}
  namespace: {{ .Values.moduleManagerNamespace }}
spec:
  selector:
    app: {{ .Values.overviewServiceName }}
  ports:
    - port: 80
      targetPort: 80
