# Owned by sample-data; reconciled by storage-gcs operator (enable storage-gcs first).
# deletionPolicy: Delete — disabling this module empties and deletes the GCP bucket.
apiVersion: gcsmanager.horizon.io/v1alpha1
kind: GCSBucket
metadata:
  name: sample-workloads-data
  namespace: {{ .Values.horizonNamespace }}
  labels:
    horizon-sdv.io/module: sample-data
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  bucketName: {{ .Values.bucketName | quote }}
  location: {{ .Values.storageLocation | quote }}
  uniformBucketLevelAccess: true
  deletionPolicy: Delete
