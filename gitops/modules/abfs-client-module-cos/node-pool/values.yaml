# This chart creates a KCC ContainerNodePool CR; platform Config Connector
# provisions the GCP pool (not Terraform). Created when the module is enabled.

namespace: abfs-client-module-cos-overview
parentModuleName: abfs-client-module-cos
gcpProjectId: ""
clusterName: sdv-cluster
location: ""
nodeLocations: []
# Must be injected (MODULE_CONFIG config.gcpComputeSaEmail ← Terraform sdv_gcp_compute_sa_email).
# Empty fails helm render (required in containernodepool.yaml) — do not use project default compute SA.
gcpComputeSaEmail: ""
# From MODULE_CONFIG (Terraform sdv_cluster_release_channel). Empty/non-UNSPECIFIED => autoUpgrade true
# (safe on channel-enrolled clusters). Set explicitly to UNSPECIFIED only to pin version / disable autoUpgrade.
# nodePool.version is applied only when releaseChannel is UNSPECIFIED; otherwise it is omitted (no false pin).
#
# COS 129 LTS (casfs in image) needs GKE >= 1.36 — confirm the cluster release channel / version
# before enabling this module on older Horizon clusters.
releaseChannel: ""
nodePool:
  # GCP node pool name / KCC resourceID
  name: abfs-build-node-pool-cos
  version: ""
  machineType: c2d-highcpu-112
  diskSizeGb: 500
  # COS with containerd — matches reference casfs.provider=image (CASFS in the node image).
  imageType: COS_CONTAINERD
  initialNodeCount: 0
  minNodeCount: 0
  maxNodeCount: 20
  workloadLabel: android-abfs-build
  workloadType: android-abfs-build
