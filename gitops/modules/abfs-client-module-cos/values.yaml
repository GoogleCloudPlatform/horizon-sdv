moduleName: ""
moduleManagerNamespace: module-manager
argocd:
  namespace: argocd
  project: horizon-sdv
repo:
  url: ""
  revision: HEAD
overviewServiceName: mod-abfs-client-module-cos-overview
overviewNamespace: abfs-client-module-cos-overview
# Defaults for KCC abfs-build-node-pool-cos (version / locations / SA from MODULE_CONFIG).
# COS 129 LTS (casfs baked into the node image) requires GKE >= 1.36 on the cluster /
# matching release channel. imageType COS_CONTAINERD reflects casfs.provider=image.
nodePool:
  name: abfs-build-node-pool-cos
  machineType: c2d-highcpu-112
  diskSizeGb: 500
  imageType: COS_CONTAINERD
  initialNodeCount: 0
  minNodeCount: 0
  maxNodeCount: 20
  workloadLabel: android-abfs-build
  workloadType: android-abfs-build
# Orphan GKE node-pool cleanup hooks of the node-pool child Application (see node-pool/templates/orphan-cleanup-hooks.yaml).
cleanup:
  # -- cleanup.image -- google-cloud-cli used by the PreSync/PostDelete jobs (gcloud + kubectl).
  # Debian google-cloud-cli 591.0.0, which includes kubectl. The
  # debian_component_based tag does not, and the Jobs must not install it at runtime.
  # Same digest in both client modules, abfs-service-module and abfs-data-module.
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:591.0.0@sha256:321817fbd59629f12034d736d78b0067ae19f25494c8554f0462de320c2f1eac
config: {}
