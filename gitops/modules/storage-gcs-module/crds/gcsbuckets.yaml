apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gcsbuckets.gcsmanager.horizon.io
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  group: gcsmanager.horizon.io
  scope: Namespaced
  names:
    plural: gcsbuckets
    singular: gcsbucket
    kind: GCSBucket
    shortNames:
      - gcsb
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                bucketName:
                  type: string
                  description: Global GCS bucket name; must be "{projectId}-..."
                  minLength: 3
                  maxLength: 63
                location:
                  type: string
                  description: GCS location or region
                uniformBucketLevelAccess:
                  type: boolean
                  description: When omitted, defaults to true
                labels:
                  type: object
                  additionalProperties:
                    type: string
                  description: Optional GCP labels on the bucket
                deletionPolicy:
                  type: string
                  enum:
                    - Retain
                    - Delete
                  default: Retain
                  description: Retain keeps the GCP bucket on CR delete; Delete empties then deletes it
              required:
                - bucketName
                - location
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: GS URI
          type: string
          jsonPath: .status.gsUri
