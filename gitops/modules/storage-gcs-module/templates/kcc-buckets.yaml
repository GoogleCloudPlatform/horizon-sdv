#
# Project buckets {project}-aaos and {project}-openbsw, moved from Terraform (terraform/modules/base/main.tf
# module.sdv_gcs / module.sdv_gcs_openbsw, now `removed` with destroy = false). Config Connector (roles/editor) acquires
# the existing buckets by resourceID. deletion-policy abandon and Delete=false keep the buckets and their data when the
# CR or the module goes away. IAM for these buckets stays in Terraform.
{{- if and (include "storage-gcs-module.mainEnv" . | eq "true") .Values.config.projectBuckets.manage }}
{{- range .Values.config.projectBuckets.names }}
---
apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: {{ . }}
  namespace: {{ $.Values.config.namespacePrefix }}horizon
  labels:
    app.kubernetes.io/name: storage-gcs-module
    app.kubernetes.io/component: project-bucket
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Delete=false,Prune=false,SkipDryRunOnMissingResource=true
    cnrm.cloud.google.com/project-id: {{ $.Values.config.projectID | quote }}
    cnrm.cloud.google.com/deletion-policy: "abandon"
spec:
  resourceID: {{ $.Values.config.projectID }}-{{ . }}
  location: {{ required "config.storageLocation is required for the project buckets" $.Values.config.storageLocation | quote }}
  uniformBucketLevelAccess: true
{{- end }}
{{- end }}
