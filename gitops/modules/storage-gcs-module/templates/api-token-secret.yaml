{{- if include "storage-gcs-module.mainEnv" . | eq "true" }}
{{- $secretName := .Values.config.apiToken.secretName | default "storage-gcs-module-api-token" }}
{{- $horizonNS := printf "%shorizon" .Values.config.namespacePrefix }}
{{- $workflowsNS := printf "%sworkflows" .Values.config.namespacePrefix }}
{{- $horizonAPINS := printf "%shorizon-api" .Values.config.namespacePrefix }}
{{- $existing := lookup "v1" "Secret" $horizonNS $secretName }}
{{- $existingData := dict }}
{{- if and $existing $existing.data }}
{{- $existingData = $existing.data }}
{{- end }}
{{- /* Preserve current tokens across syncs. New caller keys are minted once. */}}
{{- $defaultToken := "" }}
{{- if index $existingData "token" }}
{{- $defaultToken = index $existingData "token" }}
{{- else }}
{{- $defaultToken = randAlphaNum 48 | b64enc }}
{{- end }}
{{- $internalToken := "" }}
{{- if index $existingData "storage-gcs-internal" }}
{{- $internalToken = index $existingData "storage-gcs-internal" }}
{{- else if index $existingData "token" }}
{{- /* Upgrade from shared token: keep the old value so existing clients still work. */}}
{{- $internalToken = $defaultToken }}
{{- else }}
{{- $internalToken = randAlphaNum 48 | b64enc }}
{{- end }}
{{- $defaultPrev := index $existingData "token-previous" | default "" }}
{{- $internalPrev := index $existingData "storage-gcs-internal-previous" | default "" }}
{{- $callers := dict "default" (dict "current" ($defaultToken | b64dec)) "storage-gcs-internal" (dict "current" ($internalToken | b64dec)) }}
{{- if $defaultPrev }}
{{- $_ := set (index $callers "default") "previous" ($defaultPrev | b64dec) }}
{{- end }}
{{- if $internalPrev }}
{{- $_ := set (index $callers "storage-gcs-internal") "previous" ($internalPrev | b64dec) }}
{{- end }}
{{- $tokensJSON := $callers | toJson | b64enc }}
---
# Per-caller Bearer tokens for the in-cluster REST API.
# Optional *-previous keys are accepted during rotation (copy current → *-previous, then mint a new current).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $horizonNS }}
  labels:
    app.kubernetes.io/name: storage-gcs-module
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  tokens.json: {{ $tokensJSON }}
  token: {{ $defaultToken }}
  storage-gcs-internal: {{ $internalToken }}
  {{- if $defaultPrev }}
  token-previous: {{ $defaultPrev }}
  {{- end }}
  {{- if $internalPrev }}
  storage-gcs-internal-previous: {{ $internalPrev }}
  {{- end }}
---
# Workflows get caller storage-gcs-internal only (not the horizon default key).
# Key "token" is an alias of storage-gcs-internal for older templates.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $workflowsNS }}
  labels:
    app.kubernetes.io/name: storage-gcs-module
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  storage-gcs-internal: {{ $internalToken }}
  # Alias of storage-gcs-internal so older templates that still mount key "token" keep working.
  token: {{ $internalToken }}
  {{- if $internalPrev }}
  storage-gcs-internal-previous: {{ $internalPrev }}
  {{- end }}
---
# horizon-api lists objects as caller default (key token).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $horizonAPINS }}
  labels:
    app.kubernetes.io/name: storage-gcs-module
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  token: {{ $defaultToken }}
{{- end }}
