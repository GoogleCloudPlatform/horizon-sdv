{{- if include "storage-gcs-module.mainEnv" . | eq "true" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-gcs-module
  namespace: {{ .Values.config.namespacePrefix }}horizon
  labels:
    app.kubernetes.io/name: storage-gcs-module
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-gcs-module
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-gcs-module
      annotations:
        checksum/api-token: {{ include (print $.Template.BasePath "/api-token-secret.yaml") . | sha256sum }}
        checksum/api-tls: {{ include (print $.Template.BasePath "/api-tls-secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: storage-gcs-module
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ .Values.config.containerImages.storageGcsModule | quote }}
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          env:
            - name: MANAGER_NAMESPACE
              value: {{ .Values.config.namespacePrefix }}horizon
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEFAULT_ARTIFACT_BUCKET
              value: {{ .Values.config.projectID }}-aaos
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ .Values.config.projectID | quote }}
            {{- $apiTok := .Values.config.apiToken | default dict }}
            - name: API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ $apiTok.secretName | default "storage-gcs-module-api-token" | quote }}
                  key: tokens.json
                  optional: true
            - name: API_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $apiTok.secretName | default "storage-gcs-module-api-token" | quote }}
                  key: token
                  optional: true
            {{- $prefix := "" }}
            {{- if .Values.config.allowedBucketsUseProjectPrefix | default true }}
            {{- $prefix = printf "%s-" .Values.config.projectID }}
            {{- end }}
            {{- $allowed := list }}
            {{- range (.Values.config.allowedBuckets | default list) }}
            {{- if . }}
            {{- $allowed = append $allowed (printf "%s%s" $prefix .) }}
            {{- end }}
            {{- end }}
            - name: ALLOWED_BUCKETS
              value: {{ join "," $allowed | quote }}
            {{- $su := .Values.config.signedUrl | default dict }}
            - name: GCS_SIGNED_URL_DEFAULT_EXPIRY
              value: {{ $su.defaultExpiry | default "48h" | quote }}
            - name: GCS_SIGNED_URL_MAX_EXPIRY
              value: {{ $su.maxExpiry | default "168h" | quote }}
            {{- if $su.serviceAccount }}
            - name: GCS_SIGNED_URL_SERVICE_ACCOUNT
              value: {{ $su.serviceAccount | quote }}
            {{- end }}
            - name: API_TLS_CERT_FILE
              value: /etc/storage-gcs/tls/tls.crt
            - name: API_TLS_KEY_FILE
              value: /etc/storage-gcs/tls/tls.key
            - name: API_TLS_ADDR
              value: ":8443"
            - name: API_HTTP_ADDR
              value: ":8080"
          # Use /health for probes: /ready hits GCS and can exceed kubelet timeouts; leader election
          # can delay full readiness of the reconciler without blocking the HTTP server.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: api-tls
              mountPath: /etc/storage-gcs/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: api-tls
          secret:
            secretName: storage-gcs-module-api-tls
{{- end }}