{{- if include "storage-gcs-module.mainEnv" . | eq "true" }}
{{- $secretName := "storage-gcs-module-api-tls" }}
{{- $horizonNS := printf "%shorizon" .Values.config.namespacePrefix }}
{{- $workflowsNS := printf "%sworkflows" .Values.config.namespacePrefix }}
{{- $horizonAPINS := printf "%shorizon-api" .Values.config.namespacePrefix }}
{{- $svcHost := printf "storage-gcs-module.%s.svc.cluster.local" $horizonNS }}
{{- $existing := lookup "v1" "Secret" $horizonNS $secretName }}
{{- $existingData := dict }}
{{- if and $existing $existing.data }}
{{- $existingData = $existing.data }}
{{- end }}
{{- $tlsCert := index $existingData "tls.crt" | default "" }}
{{- $tlsKey := index $existingData "tls.key" | default "" }}
{{- $caCert := index $existingData "ca.crt" | default "" }}
{{- if not $tlsCert }}
{{- $ca := genCA "storage-gcs-module-ca" 8250 }}
{{- $gen := genSignedCert $svcHost nil (list $svcHost "storage-gcs-module" (printf "storage-gcs-module.%s" $horizonNS)) 8250 $ca }}
{{- $tlsCert = b64enc $gen.Cert }}
{{- $tlsKey = b64enc $gen.Key }}
{{- $caCert = b64enc $ca.Cert }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $horizonNS }}
  labels:
    app.kubernetes.io/name: storage-gcs-module
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
type: kubernetes.io/tls
data:
  tls.crt: {{ $tlsCert }}
  tls.key: {{ $tlsKey }}
  ca.crt: {{ $caCert }}
---
# Workflows mount ca.crt to verify the in-cluster HTTPS API (port 8443).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $workflowsNS }}
  labels:
    app.kubernetes.io/name: storage-gcs-module
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  ca.crt: {{ $caCert }}
---
# horizon-api verifies the in-cluster HTTPS API (port 8443) with the same CA.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $horizonAPINS }}
  labels:
    app.kubernetes.io/name: storage-gcs-module
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  ca.crt: {{ $caCert }}
{{- end }}
