# Module-owned openbsw namespace.
# Created at Sync Wave 0 so that it exists before child applications sync.
# Main environment only: the OpenBSW node pool is cluster-scoped.
{{- if not (default false .Values.config.isSubEnvironment) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    horizon-sdv.io/module: {{ .Values.moduleName | default "openbsw-module" | quote }}
    horizon-sdv.io/module-managed: "true"
    # CAN DaemonSet is privileged (host PID namespace + modprobe).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    horizon-sdv.io/node-pool: {{ .Values.nodePool.name | quote }}
{{- end }}
