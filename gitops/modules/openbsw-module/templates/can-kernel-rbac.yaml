# The CAN DaemonSet only calls modprobe on the node. It gets its own ServiceAccount
# and no Role, ClusterRole, or binding. The API token is not mounted.
{{- if not (default false .Values.config.isSubEnvironment) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbsw-can-kernel
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: openbsw-can-kernel
    horizon-sdv.io/module: {{ .Values.moduleName | default "openbsw-module" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
{{- end }}
