# Loads can, can-raw, and vcan on every node of sdv-openbsw-build-node-pool.
# privileged + hostPID are required: modprobe runs in the host mount namespace via nsenter.
# No hostNetwork, no hostPath, and no package install.
# Node labels and the taint come from Terraform (google_container_node_pool.sdv_openbsw_build_node_pool)
# and are not changed here. GKE adds cloud.google.com/gke-nodepool.
{{- if not (default false .Values.config.isSubEnvironment) }}
{{- if not .Values.canKernel.modules }}
{{- fail "canKernel.modules must list the kernel modules to load" }}
{{- end }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: openbsw-can-kernel
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: openbsw-can-kernel
    horizon-sdv.io/module: {{ .Values.moduleName | default "openbsw-module" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: openbsw-can-kernel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbsw-can-kernel
        horizon-sdv.io/module: {{ .Values.moduleName | default "openbsw-module" | quote }}
    spec:
      hostPID: true
      serviceAccountName: openbsw-can-kernel
      automountServiceAccountToken: false
      nodeSelector:
        workloadLabel: {{ .Values.nodeSelector.workloadLabel | quote }}
        cloud.google.com/gke-nodepool: {{ .Values.nodePool.name | quote }}
      tolerations:
{{ .Values.tolerations | toYaml | nindent 8 }}
      containers:
        - name: can-kernel
          image: {{ .Values.canKernel.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
{{- range .Values.canKernel.modules }}
              nsenter -t 1 -m -p -- modprobe '{{ . }}'
              nsenter -t 1 -m -p -- grep -q '^{{ . | replace "-" "_" }} ' /proc/modules
{{- end }}
              sleep infinity
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
{{- end }}
