# Child Application: OpenBSW WorkflowTemplates.
# Templates live in the platform workflows namespace. Their pods schedule onto
# sdv-openbsw-build-node-pool via openbsw.templateDefaults.
# Main environment only. workflows is unprefixed there (namespacePrefix is empty).
{{- if not (default false .Values.config.isSubEnvironment) }}
{{- if and .Values.repo.url .Values.repo.revision }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mod-{{ .Values.moduleName | default "openbsw-module" }}-argo-workflows
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: openbsw-module
    horizon-sdv.io/module: {{ .Values.moduleName | default "openbsw-module" }}
    horizon-sdv.io/app-role: child
    horizon-sdv.io/module-manager-managed: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.argocd.project }}
  source:
    repoURL: {{ .Values.repo.url | quote }}
    targetRevision: {{ .Values.repo.revision | quote }}
    path: gitops/modules/openbsw-module/argo-workflows
    helm:
      values: |
        workflowNamespace: {{ .Values.config.namespacePrefix }}workflows
        moduleName: {{ .Values.moduleName | default "openbsw-module" | quote }}
        nodePool:
          name: {{ .Values.nodePool.name | quote }}
        nodeSelector:
          workloadLabel: {{ .Values.nodeSelector.workloadLabel | quote }}
        tolerations:
{{ .Values.tolerations | toYaml | nindent 10 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.config.namespacePrefix }}workflows
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
{{- end }}
{{- end }}
