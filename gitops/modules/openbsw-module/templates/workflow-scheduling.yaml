# Scheduling contract for OpenBSW WorkflowTemplates.
# Pods must set templateDefaults from this ConfigMap so they land on the OpenBSW node pool.
# Do not add the Jenkins label openbsw_pod: Jenkins anti-affinity matches that label.
{{- if not (default false .Values.config.isSubEnvironment) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbsw-workflow-scheduling
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: openbsw-workflow-scheduling
    horizon-sdv.io/module: {{ .Values.moduleName | default "openbsw-module" | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  nodePool: {{ .Values.nodePool.name | quote }}
  nodeSelector: |
    workloadLabel: {{ .Values.nodeSelector.workloadLabel | quote }}
    cloud.google.com/gke-nodepool: {{ .Values.nodePool.name | quote }}
  tolerations: |
{{ .Values.tolerations | toYaml | nindent 4 }}
{{- end }}
