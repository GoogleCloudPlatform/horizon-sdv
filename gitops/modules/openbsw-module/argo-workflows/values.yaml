# Platform workflows namespace (Horizon API and the Argo controller watch this namespace).
workflowNamespace: workflows

moduleName: openbsw-module

# Kept in step with the parent chart. The parent Application overwrites these on deploy.
nodePool:
  name: sdv-openbsw-build-node-pool

nodeSelector:
  workloadLabel: openbsw

tolerations:
  - key: workloadType
    operator: Equal
    value: openbsw
    effect: NoSchedule
