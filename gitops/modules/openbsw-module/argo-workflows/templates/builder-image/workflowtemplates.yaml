# Description:
# Argo WorkflowTemplate for the OpenBSW builder image (Jenkins: OpenBSW/Environment/Docker Image Template).
# Builds workloads/openbsw/pipelines/environment/docker_image_template/Dockerfile and pushes it to
# <region>-docker.pkg.dev/<project>/horizon-sdv/openbsw-builder:<imageTag>.
# Also called by openbsw-bsw-builder (template build-defaults) when the builder image is missing.
# Argo Events: Sensor webhook-<workflowTemplateName> (sensors.yaml).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ .Values.builderImage.workflowTemplateName | quote }}
  namespace: {{ .Values.workflowNamespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.builderImage.workflowTemplateName | quote }}
    horizon-sdv.io/expose: "true"
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  entrypoint: build
{{- include "openbsw.workflowSpecCommon" . | nindent 2 }}
{{- if .Values.builderImage.concurrencyMutexName }}
  synchronization:
    mutex:
      name: {{ .Values.builderImage.concurrencyMutexName | quote }}
{{- end }}
  workflowMetadata:
    annotations:
      workflows.argoproj.io/title: 'OpenBSW Docker Image Template ({{ "{{" }}workflow.parameters.imageTag{{ "}}" }})'
      workflows.argoproj.io/description: 'dryRun={{ "{{" }}workflow.parameters.dryRun{{ "}}" }}'
  templateDefaults:
{{- include "openbsw.templateDefaults" . | nindent 4 }}
  arguments:
    parameters:
{{- include "openbsw.workflowParameters" .Values.builderImage.parameters | nindent 6 }}
  templates:
{{- include "openbsw.builderImage.templates" . | nindent 4 }}
