# Description:
# Argo WorkflowTemplate for the OpenBSW POSIX test (Jenkins: OpenBSW/Tests/POSIX).
# Downloads the POSIX application stored by openbsw-bsw-builder and exposes the host through an
# MTK Connect testbench for posixKeepAliveTime minutes, then removes the testbench.
# Argo Events: Sensor webhook-<workflowTemplateName> (sensors.yaml).
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ .Values.posixTest.workflowTemplateName | quote }}
  namespace: {{ .Values.workflowNamespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.posixTest.workflowTemplateName | quote }}
    horizon-sdv.io/expose: "true"
    horizon-sdv.io/module: {{ .Values.moduleName | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  entrypoint: main
  onExit: exit-handler
{{- include "openbsw.workflowSpecCommon" . | nindent 2 }}
  workflowMetadata:
    annotations:
      workflows.argoproj.io/title: 'OpenBSW POSIX Test ({{ "{{" }}workflow.parameters.numHostInstances{{ "}}" }} devices, {{ "{{" }}workflow.parameters.posixKeepAliveTime{{ "}}" }} min)'
      workflows.argoproj.io/description: '{{ "{{" }}workflow.parameters.openbswDownloadUrl{{ "}}" }}'
  templateDefaults:
{{- include "openbsw.templateDefaults" . | nindent 4 }}
  arguments:
    parameters:
{{- include "openbsw.workflowParameters" .Values.posixTest.parameters | nindent 6 }}
  volumes:
    - name: host-lib-modules
      hostPath:
        path: /lib/modules
        type: Directory
  templates:
{{- include "openbsw.posixTest.templates" . | nindent 4 }}
