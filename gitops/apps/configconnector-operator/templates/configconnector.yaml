# Cluster-mode Config Connector. Same Application as the ConfigConnector CRD
# (configconnector-operator.yaml), so Argo CD skips dry-run without
# SkipDryRunOnMissingResource. Identity is Terraform WI (env sa11).
# Cluster-scoped; destination namespace configconnector-operator-system does not apply.
apiVersion: core.cnrm.cloud.google.com/v1beta1
kind: ConfigConnector
metadata:
  name: configconnector.core.cnrm.cloud.google.com
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Cluster-wide singleton. Keep it if this object drops out of the chart.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  mode: cluster
  googleServiceAccount: gke-config-connector-sa@{{ required "config.projectID is required" .Values.config.projectID }}.iam.gserviceaccount.com
  stateIntoSpec: Absent
