apiVersion: apps/v1
kind: Deployment
metadata:
  name: horizon-api
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: horizon-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: horizon-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: horizon-api
    spec:
      serviceAccountName: horizon-api
      containers:
        - name: horizon-api
          image: {{ .Values.image | quote }}
          imagePullPolicy: Always
          args:
            - "--namespace={{ .Values.namespace }}"
            - "--module-manager-namespace={{ .Values.moduleManagerNamespace }}"
            {{- $gcsNs := .Values.gcsBucketsNamespace | default "horizon" }}
            - "--gcs-buckets-namespace={{ $gcsNs }}"
            - "--module-manager-state-name={{ .Values.moduleManagerStateName }}"
            - "--module-manager-catalog-name={{ .Values.moduleManagerCatalogName }}"
            {{- $wfNs := .Values.workflowsNamespace | default "workflows" }}
            - "--workflows-namespace={{ $wfNs }}"
            - "--oidc-issuer-url={{ .Values.oidcIssuerUrl }}"
            {{- if .Values.oidcClientId }}
            - "--oidc-client-id={{ .Values.oidcClientId }}"
            {{- end }}
            - "--oidc-skip-client-id-check={{ .Values.oidcSkipClientIdCheck }}"
            - "--events-webhook-url={{ .Values.eventsWebhookUrl }}"
            # API lives at /api/v1/... ; /workflows/ is only the UI baseHref (requests under /workflows/api/... return HTML SPA).
            # Default namespace when parent Application omits argoWorkflowsNamespace (empty → broken host ..svc).
            {{- $argoNs := .Values.argoWorkflowsNamespace | default "argo-workflows" }}
            - "--argo-base-url=http://argo-workflows-server.{{ $argoNs }}.svc.cluster.local:2746"
            {{- if .Values.gcsArtifactBucket }}
            - "--gcs-artifact-bucket={{ .Values.gcsArtifactBucket }}"
            {{- end }}
            {{- if .Values.gcsSigningServiceAccount }}
            - "--gcs-signing-service-account={{ .Values.gcsSigningServiceAccount }}"
            {{- end }}
            - "--workflow-ttl-seconds-after-success={{ .Values.workflowTtlSecondsAfterSuccess }}"
            - "--workflow-ttl-seconds-after-failure={{ .Values.workflowTtlSecondsAfterFailure }}"
            - "--workflow-ttl-seconds-after-completion={{ .Values.workflowTtlSecondsAfterCompletion }}"
            {{- if .Values.workflowDeleteWaitTimeout }}
            - "--workflow-delete-wait-timeout={{ .Values.workflowDeleteWaitTimeout }}"
            {{- end }}
            - "--http-bind-address=:8082"
            - "--metrics-bind-address=:8080"
            - "--health-probe-bind-address=:8081"
            {{- if .Values.artifactsModuleUrl }}
            - "--artifacts-module-url={{ .Values.artifactsModuleUrl }}"
            {{- end }}
            {{- if .Values.artifactsGcsProjectId }}
            - "--artifacts-gcs-project-id={{ .Values.artifactsGcsProjectId }}"
            {{- end }}
            {{- if .Values.artifactsAllowedBuckets }}
            - "--artifacts-allowed-buckets={{ .Values.artifactsAllowedBuckets }}"
            {{- end }}
          env:
            # File, not secretKeyRef. An env value is fixed when the container
            # starts: this Deployment syncs before storage-gcs-module creates
            # the secret, and a later rotation would keep the old token until
            # the pod is restarted. Kubelet refreshes a directory secret mount.
            - name: ARTIFACTS_MODULE_TOKEN_FILE
              value: /etc/storage-gcs-token/horizon-api
            - name: ARTIFACTS_MODULE_CA_FILE
              value: /etc/storage-gcs/ca.crt
            {{- if .Values.gceMetadataHost }}
            - name: GCE_METADATA_HOST
              value: {{ .Values.gceMetadataHost | quote }}
            {{- end }}
          volumeMounts:
            - name: storage-gcs-api-ca
              mountPath: /etc/storage-gcs
              readOnly: true
            # Directory mount (not subPath) so kubelet can update the file
            # after the secret is created or rotated.
            - name: storage-gcs-api-token
              mountPath: /etc/storage-gcs-token
              readOnly: true
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: http
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: storage-gcs-api-ca
          secret:
            secretName: storage-gcs-module-api-tls
            optional: true
            items:
              - key: ca.crt
                path: ca.crt
        # Optional: storage-gcs-module may be installed after horizon-api.
        - name: storage-gcs-api-token
          secret:
            secretName: storage-gcs-module-api-token
            optional: true
            items:
              - key: horizon-api
                path: horizon-api
