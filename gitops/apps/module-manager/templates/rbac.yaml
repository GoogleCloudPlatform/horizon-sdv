# Module Manager: Role in its namespace (ModuleManagerState, ModuleCatalog) and Role in argocd (Applications, platform drain gate).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: module-manager
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: module-manager
rules:
  - apiGroups: ["horizon-sdv.io"]
    resources:
      - modulemanagerstates
      - modulemanagerstates/status
      - modulecatalogs
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: module-manager
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: module-manager
subjects:
  - kind: ServiceAccount
    name: module-manager
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: module-manager-applications
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: module-manager
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications", "applications/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Platform drain gate (gitops/templates/platform-drain-gate.yaml): read it and release its finalizer.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["platform-drain-gate"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: module-manager-applications
  namespace: {{ .Values.argocd.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: module-manager-applications
subjects:
  - kind: ServiceAccount
    name: module-manager
    namespace: {{ .Values.namespace }}
---
# workloads-android disable: remove Cuttlefish KCC ComputeInstanceTemplate CRs in {prefix}workflows
# before / while tearing down the child Argo Application so ConfigConnectorContext is not blocked
# (Addon/controller: "cannot finalize deletion until all Config Connector resources… have been removed").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: module-manager-cnrm-computeinstancetemplates
  labels:
    app.kubernetes.io/name: module-manager
rules:
  - apiGroups: ["compute.cnrm.cloud.google.com"]
    resources: ["computeinstancetemplates"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: module-manager-cnrm-computeinstancetemplates
  labels:
    app.kubernetes.io/name: module-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module-manager-cnrm-computeinstancetemplates
subjects:
  - kind: ServiceAccount
    name: module-manager
    namespace: {{ .Values.namespace }}
---
# workloads-android disable: delete workflows-namespace ConfigConnectorContext when still live
# (EnsureWorkflowsConfigConnectorContextRemoved after child Application and ComputeInstanceTemplate CRs).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: module-manager-cnrm-configconnectorcontext
  labels:
    app.kubernetes.io/name: module-manager
rules:
  - apiGroups: ["core.cnrm.cloud.google.com"]
    resources: ["configconnectorcontexts"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: module-manager-cnrm-configconnectorcontext
  labels:
    app.kubernetes.io/name: module-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module-manager-cnrm-configconnectorcontext
subjects:
  - kind: ServiceAccount
    name: module-manager
    namespace: {{ .Values.namespace }}
---
# cloud-workstations disable: DrainCloudWorkstationsModule deletes Horizon Workstation, WorkstationConfig and
# WorkstationCluster CRs (child first) before the parent Application is removed, and RemoveCloudWorkstationsCRDs
# then deletes the module's three Horizon CRDs. KCC object reads are covered by module-manager-kcc-drain.
# CRD access is restricted by resourceNames so no other CRD (including Config Connector's) can be deleted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: module-manager-horizon-workstations
  labels:
    app.kubernetes.io/name: module-manager
rules:
  - apiGroups: ["workstations.horizon-sdv.io"]
    resources: ["workstations", "workstationconfigs", "workstationclusters"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - workstationclusters.workstations.horizon-sdv.io
      - workstationconfigs.workstations.horizon-sdv.io
      - workstations.workstations.horizon-sdv.io
    verbs: ["get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: module-manager-horizon-workstations
  labels:
    app.kubernetes.io/name: module-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module-manager-horizon-workstations
subjects:
  - kind: ServiceAccount
    name: module-manager
    namespace: {{ .Values.namespace }}
---
# KCC finalizer stripper: Module Manager needs to list and patch KCC-managed resources in module
# destination namespaces during platform drain so that cnrm.cloud.google.com/finalizers on
# objects stuck in DeleteFailed do not block namespace termination.
# The apiGroup wildcard covers all *.cnrm.cloud.google.com groups (pubsub, iam, storage, etc.)
# without enumerating them, since RBAC does not support suffix wildcards.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: module-manager-kcc-drain
  labels:
    app.kubernetes.io/name: module-manager
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: module-manager-kcc-drain
  labels:
    app.kubernetes.io/name: module-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module-manager-kcc-drain
subjects:
  - kind: ServiceAccount
    name: module-manager
    namespace: {{ .Values.namespace }}
---
# Soft-features ConfigMap mode: Module Manager upserts ConfigMaps in workload namespaces (see ModuleCatalog softFeaturesPropagation).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: module-manager-soft-features
  labels:
    app.kubernetes.io/name: module-manager
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: module-manager-soft-features
  labels:
    app.kubernetes.io/name: module-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: module-manager-soft-features
subjects:
  - kind: ServiceAccount
    name: module-manager
    namespace: {{ .Values.namespace }}
