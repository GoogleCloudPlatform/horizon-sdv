# Singleton ModuleCatalog CR — module list is defined here (not in values.yaml).
# overviewServiceNamespace is the source of truth for Module Manager and for parent Helm overviewNamespace (injected by MM).
# Workloads: parent module charts (mod-workloads-*) deploy to the same namespace as Module Manager (.Values.namespace),
# so overview Services live there—not in {prefix}workflows (that namespace is for child Argo Applications only).
apiVersion: horizon-sdv.io/v1alpha1
kind: ModuleCatalog
metadata:
  name: {{ .Values.catalogCRName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: module-manager
spec:
  modules:
    - name: sample-hard
      path: gitops/modules/sample-hard-module
      overviewPath: portal/overview.html
      overviewService: mod-sample-hard-overview
      overviewServiceNamespace: sample-hard-module-hello
      # Demo: auto-disable when no enabled module lists sample-hard as a hard dependency.
      autoDisableWhenUnused: true
    - name: sample-soft
      path: gitops/modules/sample-soft-module
      overviewPath: portal/overview.html
      overviewService: mod-sample-soft-overview
      overviewServiceNamespace: sample-soft-module-hello
      # Demo: auto-disable when no enabled module depends on sample-soft (hard or soft).
      autoDisableWhenUnused: true
    - name: storage-gcs
      path: gitops/modules/storage-gcs-module
      overviewPath: portal/overview.html
      overviewService: mod-storage-gcs-overview
      overviewServiceNamespace: storage-gcs-overview
    - name: sample-data
      path: gitops/modules/sample-data-module
      overviewPath: portal/overview.html
      overviewService: mod-sample-data-overview
      overviewServiceNamespace: sample-data-overview
      hardDependencies:
        - storage-gcs
      # GCSBucket CR reconciled by storage-gcs-module operator; CR deletion empties and deletes the GCP bucket.
    - name: sample
      path: gitops/modules/sample-module
      overviewPath: portal/overview.html
      overviewService: mod-sample-overview
      overviewServiceNamespace: sample-module-hello
      hardDependencies:
        - sample-hard
      softDependencies:
        - sample-soft
        - sample-data
        - storage-gcs
      softFeaturesPropagation: HelmValuesAndConfigMap
      softFeaturesConfigMapNamespaces:
        - sample-module-hello
    - name: workloads-common
      path: gitops/modules/workloads-common
      overviewPath: portal/overview.html
      overviewService: mod-workloads-common-overview
      overviewServiceNamespace: {{ .Values.namespace | quote }}
    - name: workloads-android
      path: gitops/modules/workloads-android
      overviewPath: portal/overview.html
      overviewService: mod-workloads-android-overview
      overviewServiceNamespace: {{ .Values.namespace | quote }}
      hardDependencies:
        - workloads-common
    - name: remotive-topology
      path: gitops/modules/remotive-topology
      overviewPath: portal/overview.html
      overviewService: mod-remotive-topology-overview
      overviewServiceNamespace: {{ .Values.namespace | quote }}
      hardDependencies:
        - workloads-common
    - name: abfs-data
      path: gitops/modules/abfs-data-module
      overviewPath: portal/overview.html
      overviewService: mod-abfs-data-overview
      overviewServiceNamespace: abfs-data-overview
      # Owns ABFS persistent data (license SA + Secret, Spanner, GCS, license workflows). Do not auto-disable when unused.
      autoDisableWhenUnused: false
    - name: abfs-service-module
      path: gitops/modules/abfs-service-module
      overviewPath: portal/overview.html
      overviewService: mod-abfs-service-module-overview
      overviewServiceNamespace: abfs
    - name: abfs-client-ubuntu
      path: gitops/modules/abfs-client-module-ubuntu
      overviewPath: portal/overview.html
      overviewService: mod-abfs-client-module-ubuntu-overview
      overviewServiceNamespace: abfs-client-module-ubuntu-overview
      hardDependencies:
        - workloads-android
        - abfs-service-module
