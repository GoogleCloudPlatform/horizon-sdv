apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .Values.config.namespacePrefix }}horizon-dev-portal-control-room-egress
  namespace: {{ .Values.config.namespacePrefix }}horizon-dev-portal
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Allow GKE Workload Identity metadata server for read-only GCP Control Room queries
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
        - ipBlock:
            cidr: 169.254.169.252/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 988
    # Allow querying the read-only Jenkins builds exporter in the jenkins namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.config.namespacePrefix }}jenkins
          podSelector:
            matchLabels:
              app.kubernetes.io/name: jenkins-builds-exporter
      ports:
        - protocol: TCP
          port: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.config.namespacePrefix }}jenkins-builds-exporter
  namespace: {{ .Values.config.namespacePrefix }}jenkins
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins-builds-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins-builds-exporter
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: jenkins
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: jenkins-builds-exporter
          image: {{ .Values.config.gitops.horizonDevPortal }}
          imagePullPolicy: Always
          env:
            - name: JENKINS_EXPORTER_LISTEN_ADDR
              value: ":8085"
            - name: JENKINS_HOME_DIR
              value: "/var/jenkins_home"
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
              readOnly: true
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: {{ .Values.config.namespacePrefix }}jenkins-home-volume
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.config.namespacePrefix }}jenkins-builds-exporter
  namespace: {{ .Values.config.namespacePrefix }}jenkins
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8085
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: jenkins-builds-exporter
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .Values.config.namespacePrefix }}jenkins-builds-exporter-ingress
  namespace: {{ .Values.config.namespacePrefix }}jenkins
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jenkins-builds-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.config.namespacePrefix }}horizon-dev-portal
      ports:
        - protocol: TCP
          port: 8085
