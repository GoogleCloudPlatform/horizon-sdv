{{- if not (default false .Values.config.isSubEnvironment) }}
# Git-pinned Config Connector operator (main environment only).
# Helm chart: vendored operator + NetworkPolicy + cluster-mode ConfigConnector CR
# (same sync as the ConfigConnector CRD; no SkipDryRunOnMissingResource on that CR).
# Wave -1 so this Application exists before parent StorageBucket (wave 5).
# Discovery RBAC and webhook monitor stay in gitops/templates/config-connector-init.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: configconnector-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: horizon-sdv
  source:
    repoURL: {{ .Values.spec.source.repoURL }}
    targetRevision: {{ .Values.spec.source.targetRevision }}
    helm:
      values: |
        config:
          projectID: {{ .Values.config.projectID | quote }}
    path: gitops/apps/configconnector-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: configconnector-operator-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    automated:
      prune: false
      selfHeal: true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: configconnector-operator
      jqPathExpressions:
        - .spec.template.spec.containers[].resources
{{- end }}
