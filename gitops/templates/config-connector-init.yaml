#
# Cluster-mode ConfigConnector CR, discovery RBAC, readiness gates and webhook cert monitor
# for Config Connector (platform GitOps). The operator and its CRDs are the
# configconnector-operator child Application (gitops/apps/configconnector-operator).
# The operator is Git-pinned, not the GKE add-on.
# The CR stays in this root Application: releases before the Git-pinned operator rendered
# it here too, so moving it to another Application would let this one prune it on upgrade,
# which uninstalls Config Connector.
# Do not create ConfigConnectorContext when mode is cluster: the operator rejects CCC as unnecessary.
# configconnector-operator-cnrm-discovery grants the operator read access to CNRM API groups (e.g. edgenetwork).
# Ref: https://cloud.google.com/config-connector/docs/how-to/install-upgrade-uninstall
#
# Main environment only. Every resource below is cluster-scoped (ClusterRole/ClusterRoleBinding) or lives
# in an unprefixed, shared namespace (gcp, cnrm-system). The Config Connector operator itself only runs on
# the main environment (gitops/templates/configconnector-operator.yaml is isSubEnvironment-gated), so a
# sub-environment never needs these; without this guard every sub-environment's root Application would
# also "own" these same globally-named resources and could prune them on its own teardown.
{{- if not (default false .Values.config.isSubEnvironment) }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: configconnector-operator-cnrm-discovery
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups:
      - edgenetwork.cnrm.cloud.google.com
    resources:
      - "*"
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: configconnector-operator-cnrm-discovery
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: configconnector-operator-cnrm-discovery
subjects:
  - kind: ServiceAccount
    name: configconnector-operator
    namespace: configconnector-operator-system
---
# Centralized KCC webhook TLS monitor:
# periodically verifies that the certificate served by cnrm-validating-webhook
# chains to the CA bundle configured in ValidatingWebhookConfiguration.
# The same identity runs the readiness gates below, so it is in wave 0.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kcc-webhook-cert-monitor
  namespace: gcp
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kcc-webhook-cert-monitor
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    resourceNames: ["validating-webhook.cnrm.cloud.google.com"]
    verbs: ["get"]
  - apiGroups: ["core.cnrm.cloud.google.com"]
    resources: ["configconnectors"]
    resourceNames: ["configconnector.core.cnrm.cloud.google.com"]
    verbs: ["get"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - configconnectors.core.cnrm.cloud.google.com
      - storagebuckets.storage.cnrm.cloud.google.com
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["cnrm-system"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kcc-webhook-cert-monitor
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kcc-webhook-cert-monitor
subjects:
  - kind: ServiceAccount
    name: kcc-webhook-cert-monitor
    namespace: gcp
---
# CRD gate. The root Application does not wait on child Application health, and on
# greenfield the ConfigConnector CRD comes from the configconnector-operator child
# Application (wave -1). A Job hook is a real wave barrier, so the CR below (wave 1)
# is applied only after the CRD is established.
apiVersion: batch/v1
kind: Job
metadata:
  name: kcc-crd-gate
  namespace: gcp
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: kcc-webhook-cert-monitor
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: wait-for-configconnector-crd
          image: {{ .Values.config.containerImages.kccWebhookCertMonitor | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              API_SERVER="https://kubernetes.default.svc"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              CA_CERT_PATH="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              while :; do
                CRD="$(curl -fsS --cacert "${CA_CERT_PATH}" -H "Authorization: Bearer ${TOKEN}" \
                  "${API_SERVER}/apis/apiextensions.k8s.io/v1/customresourcedefinitions/configconnectors.core.cnrm.cloud.google.com" 2>/dev/null \
                  | jq -r '[.status.conditions[]? | select(.type=="Established") | .status][0] // ""' 2>/dev/null || true)"
                echo "configconnector-crd=${CRD:-absent}"
                if [ "${CRD}" = "True" ]; then
                  echo "OK: ConfigConnector CRD is established"
                  exit 0
                fi
                sleep 5
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# Cluster-wide singleton. Prune=false keeps it if it ever drops out of the chart.
# Identity is Terraform WI (env sa11).
apiVersion: core.cnrm.cloud.google.com/v1beta1
kind: ConfigConnector
metadata:
  name: configconnector.core.cnrm.cloud.google.com
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
spec:
  mode: cluster
  googleServiceAccount: gke-config-connector-sa@{{ required "config.projectID is required" .Values.config.projectID }}.iam.gserviceaccount.com
  stateIntoSpec: Absent
---
# Readiness gate, same wave as the CR above; it polls until the operator has reconciled
# it. Later waves reach cnrm-system and storage.cnrm resources only after it succeeds.
apiVersion: batch/v1
kind: Job
metadata:
  name: kcc-readiness-gate
  namespace: gcp
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: kcc-webhook-cert-monitor
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: wait-for-config-connector
          image: {{ .Values.config.containerImages.kccWebhookCertMonitor | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              API_SERVER="https://kubernetes.default.svc"
              TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              CA_CERT_PATH="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              get() {
                curl -fsS --cacert "${CA_CERT_PATH}" -H "Authorization: Bearer ${TOKEN}" "${API_SERVER}$1" 2>/dev/null || true
              }
              while :; do
                CC="$(get /apis/core.cnrm.cloud.google.com/v1beta1/configconnectors/configconnector.core.cnrm.cloud.google.com | jq -r '.status.healthy // false' 2>/dev/null || echo false)"
                NS="$(get /api/v1/namespaces/cnrm-system | jq -r '.status.phase // ""' 2>/dev/null || true)"
                CRD="$(get /apis/apiextensions.k8s.io/v1/customresourcedefinitions/storagebuckets.storage.cnrm.cloud.google.com \
                  | jq -r '[.status.conditions[]? | select(.type=="Established") | .status][0] // ""' 2>/dev/null || true)"
                TLS=false
                if echo | openssl s_client -connect cnrm-validating-webhook.cnrm-system.svc:443 \
                  -servername cnrm-validating-webhook.cnrm-system.svc >/dev/null 2>&1; then
                  TLS=true
                fi
                echo "configConnector.healthy=${CC} cnrm-system=${NS:-absent} storagebucket-crd=${CRD:-absent} webhook-tls=${TLS}"
                if [ "${CC}" = "true" ] && [ "${NS}" = "Active" ] && [ "${CRD}" = "True" ] && [ "${TLS}" = "true" ]; then
                  echo "OK: Config Connector is ready"
                  exit 0
                fi
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
# Wave 2, after the readiness gate, because cnrm-system is created by the operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kcc-webhook-cert-monitor
  namespace: cnrm-system
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["cnrm-webhook-manager"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kcc-webhook-cert-monitor
  namespace: cnrm-system
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kcc-webhook-cert-monitor
subjects:
  - kind: ServiceAccount
    name: kcc-webhook-cert-monitor
    namespace: gcp
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kcc-webhook-cert-monitor
  namespace: gcp
  labels:
    app.kubernetes.io/name: horizon-sdv
    app.kubernetes.io/component: config-connector
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 600
      template:
        spec:
          serviceAccountName: kcc-webhook-cert-monitor
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: verify-webhook-tls
              image: {{ .Values.config.containerImages.kccWebhookCertMonitor | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  THRESHOLD_SECONDS={{ int .Values.config.configConnector.webhookMonitor.thresholdSeconds }}
                  COOLDOWN_SECONDS={{ int .Values.config.configConnector.webhookMonitor.cooldownSeconds }}
                  API_SERVER="https://kubernetes.default.svc"
                  TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
                  CA_CERT_PATH="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  RESTART_KEY="kcc-webhook-cert-monitor/restarted-at"
                  LAST_RESTART_KEY="kcc-webhook-cert-monitor/last-auto-restart-epoch"
                  CA="$(curl -fsS \
                    --cacert "${CA_CERT_PATH}" \
                    -H "Authorization: Bearer ${TOKEN}" \
                    "${API_SERVER}/apis/admissionregistration.k8s.io/v1/validatingwebhookconfigurations/validating-webhook.cnrm.cloud.google.com" \
                    | jq -r '.webhooks[] | select(.name=="deny-unknown-fields.cnrm.cloud.google.com") | .clientConfig.caBundle')"
                  if [ -z "${CA:-}" ] || [ "$CA" = "null" ]; then
                    echo "ERROR: missing caBundle for deny-unknown-fields.cnrm.cloud.google.com"
                    exit 1
                  fi
                  printf '%s' "$CA" | base64 -d > /tmp/ca.pem
                  echo | openssl s_client -connect cnrm-validating-webhook.cnrm-system.svc:443 \
                    -servername cnrm-validating-webhook.cnrm-system.svc 2>/dev/null \
                    | openssl x509 -outform PEM > /tmp/leaf.pem
                  openssl verify -CAfile /tmp/ca.pem /tmp/leaf.pem
                  echo "OK: cnrm-validating-webhook certificate chains to configured CA bundle"

                  if openssl x509 -in /tmp/leaf.pem -checkend "${THRESHOLD_SECONDS}" -noout; then
                    echo "OK: webhook certificate is valid for more than ${THRESHOLD_SECONDS}s"
                    exit 0
                  fi

                  echo "WARN: webhook certificate expires within ${THRESHOLD_SECONDS}s"
                  DEPLOYMENT_JSON="$(curl -fsS \
                    --cacert "${CA_CERT_PATH}" \
                    -H "Authorization: Bearer ${TOKEN}" \
                    "${API_SERVER}/apis/apps/v1/namespaces/cnrm-system/deployments/cnrm-webhook-manager")"
                  NOW_EPOCH="$(date -u +%s)"
                  NOW_ISO="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  LAST_RESTART_EPOCH="$(printf '%s' "${DEPLOYMENT_JSON}" | jq -r --arg key "${LAST_RESTART_KEY}" '.metadata.annotations[$key] // "0"')"

                  case "${LAST_RESTART_EPOCH}" in
                    ''|*[!0-9]*)
                      echo "WARN: invalid ${LAST_RESTART_KEY}='${LAST_RESTART_EPOCH}', treating as 0"
                      LAST_RESTART_EPOCH=0
                      ;;
                  esac

                  ELAPSED_SECONDS=$((NOW_EPOCH - LAST_RESTART_EPOCH))
                  if [ "${ELAPSED_SECONDS}" -lt "${COOLDOWN_SECONDS}" ]; then
                    echo "INFO: restart skipped due to cooldown (${ELAPSED_SECONDS}s < ${COOLDOWN_SECONDS}s)"
                    exit 0
                  fi

                  PATCH_PAYLOAD="$(jq -nc \
                    --arg nowIso "${NOW_ISO}" \
                    --arg nowEpoch "${NOW_EPOCH}" \
                    --arg restartKey "${RESTART_KEY}" \
                    --arg lastRestartKey "${LAST_RESTART_KEY}" \
                    '{metadata:{annotations:{($lastRestartKey):$nowEpoch}},spec:{template:{metadata:{annotations:{($restartKey):$nowIso}}}}}')"

                  curl -fsS -X PATCH \
                    --cacert "${CA_CERT_PATH}" \
                    -H "Authorization: Bearer ${TOKEN}" \
                    -H "Content-Type: application/merge-patch+json" \
                    "${API_SERVER}/apis/apps/v1/namespaces/cnrm-system/deployments/cnrm-webhook-manager" \
                    -d "${PATCH_PAYLOAD}" >/dev/null

                  echo "INFO: auto-restart triggered for cnrm-webhook-manager at ${NOW_ISO}"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
{{- end }}
