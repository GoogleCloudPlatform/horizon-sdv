  # simple-theme-plugin accepts inline CSS but only a URL for JavaScript, so the
  # breadcrumb script is written into userContent and served from there.
  initScripts:
    breadcrumb-last-link: |-
      import jenkins.model.Jenkins

      // Core renders the breadcrumb segment matching the current request URI as
      // a plain <span> rather than an <a> (upstream 82e2830be, JENKINS-75851),
      // so the last entry in a folder path cannot be clicked to reload. Put the
      // link back client side. No-ops if upstream ever restores the anchor.
      def script = '''
      (function () {
        function restoreLastBreadcrumbLink() {
          var list = document.getElementById("breadcrumbs");
          if (!list) return;
          var items = list.querySelectorAll('li[data-type="breadcrumb-item"]');
          if (!items.length) return;
          var last = items[items.length - 1];
          if (last.querySelector("a")) return;
          var span = last.querySelector("span");
          if (!span) return;
          var link = document.createElement("a");
          link.href = window.location.pathname;
          link.textContent = span.textContent.trim();
          var tooltip = span.getAttribute("tooltip");
          if (tooltip) link.setAttribute("tooltip", tooltip);
          span.replaceWith(link);
        }
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", restoreLastBreadcrumbLink);
        } else {
          restoreLastBreadcrumbLink();
        }
      })();
      '''.stripIndent()

      try {
        def target = new File(Jenkins.get().rootDir, "userContent/horizon-breadcrumb-last-link.js")
        target.parentFile.mkdirs()
        if (!target.exists() || target.text != script) {
          target.text = script
        }
      } catch (Throwable t) {
        println("Could not write breadcrumb script, breadcrumbs stay as upstream: " + t)
      }
