# Description:
# Storage classes used for Jenkins build caches and Argo workflow volumes.
# Prefix reclaimable-storage-class is referenced in System Variables so
# jobs may choose the correct storage class based on Android version and
# target.
# pipeline-workspace-delete: single Delete reclaim class for aaos-builder shared monorepo PVC (any Android
# lunch/revision); disk removed when PVC is deleted. aaos-cache keeps per-version reclaimable Retain classes.
#
# volumeBindingMode is WaitForFirstConsumer: the disk is created in the zone of
# the node that runs the build pod. With Immediate the disk was created first,
# in any zone, and the pod had to follow it, also into a zone without capacity
# when the build node pools span several zones.
# The field cannot be changed on an existing StorageClass, so Argo CD replaces
# the classes (Replace=true,Force=true: delete and create). Existing volumes
# and claims are not touched by that; a retained cache disk stays usable in
# the zone it was created in.

kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: {{ .Values.config.namespacePrefix }}reclaimable-storage-class-android-14
  annotations:
    reclaimable-pv-releaser.kubernetes.io/controller-id: dynamic-reclaimable-pvc-controllers
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
provisioner: pd.csi.storage.gke.io
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: pd-balanced
  csi.storage.k8s.io/fstype: ext4
---
kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: {{ .Values.config.namespacePrefix }}pipeline-workspace-delete
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Replace=true,Force=true
provisioner: pd.csi.storage.gke.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: pd-balanced
  csi.storage.k8s.io/fstype: ext4
---
