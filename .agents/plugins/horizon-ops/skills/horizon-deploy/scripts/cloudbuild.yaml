# Description:
# Cloud Build pipeline for Horizon SDV Terraform deployment.
# Runs containerized Terraform plan, apply, or destroy directly in Google Cloud.

steps:
  # Step 1: Build the Horizon Deployer Image (same image as container-deploy.sh)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-deployer'
    args:
      - 'build'
      - '-t'
      - 'horizon-sdv-deployer:latest'
      - '-f'
      - 'tools/scripts/deployment/container/Dockerfile'
      - 'tools/scripts/deployment'

  # Step 2: Execute Deployment directly as a Cloud Build native container step
  - name: 'horizon-sdv-deployer:latest'
    id: 'run-deployment'
    entrypoint: 'bash'
    env:
      - 'SKIP_KMS=$_SKIP_KMS'
    args:
      - '/workspace/.agents/plugins/horizon-ops/skills/horizon-deploy/scripts/cloud-runner.sh'
      - '$_ACTION'

substitutions:
  _ACTION: ''
  _SKIP_KMS: 'false'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '7200s'
