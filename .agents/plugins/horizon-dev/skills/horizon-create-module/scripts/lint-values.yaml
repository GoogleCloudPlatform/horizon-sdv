# Description:
# Placeholder values for `helm lint` / `helm template` of a module's parent
# chart outside the cluster. Mirrors the `config` keys Module Manager injects
# (gitops/templates/module-manager.yaml). Lint only; never deploy with it.

moduleName: lint-test
repo:
  url: https://github.com/example/horizon-sdv.git
  revision: HEAD
config:
  domain: dev.example.com
  projectID: example-project
  region: europe-west1
  zone: europe-west1-d
  backendBucket: example-project-horizon-tfstate
  storageLocation: europe-west1
  namespacePrefix: ""
  isSubEnvironment: false
  environmentName: dev
  enableNetworkPolicies: true
  containerImages:
    storageGcsModule: example/storage-gcs-module:latest
  scm:
    authMethod: none
  workloads:
    android:
      url: https://github.com/example/horizon-sdv.git
      branch: main
  nginx:
    image: nginx
    tag: "1.27-alpine"
