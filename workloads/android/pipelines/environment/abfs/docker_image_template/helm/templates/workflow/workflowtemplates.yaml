# Description:
# Argo WorkflowTemplate for building ABFS docker images (Ubuntu/COS-tagged).
# Exposed for Developer Portal under workloads-android (horizon-sdv.io/expose=true).
# Requires ClusterWorkflowTemplate common-docker-image-build (workloads-common).
# Platform injects spec.cloudProject/Region/Zone via workloads-android Application Helm values
# (MODULE_CONFIG ← Terraform). Manual helm must --set them.
# Argo Events: Sensor webhook-abfs-builder-runtime-image (workflow/sensors.yaml).

{{ $_ := required "spec.cloudProject must be set (workloads-android MODULE_CONFIG / --set)" .Values.spec.cloudProject }}
{{ $_ := required "spec.cloudRegion must be set (workloads-android MODULE_CONFIG / --set)" .Values.spec.cloudRegion }}
{{ $_ := required "spec.cloudZone must be set (workloads-android MODULE_CONFIG / --set)" .Values.spec.cloudZone }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ .Values.workflowTemplateName | quote }}
  namespace: {{ include "abfs-builder-runtime-image.workflowNamespace" . | quote }}
  labels:
    app.kubernetes.io/name: abfs-builder-runtime-image
    horizon-sdv.io/expose: "true"
    horizon-sdv.io/module: workloads-android
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    workflows.argoproj.io/description: "Build the ABFS Jenkins builder image (Ubuntu or COS tag) via Portal or Argo."
spec:
  entrypoint: build
  archiveLogs: true
{{- if .Values.abfsBuilderRuntimeImageConcurrencyMutexName }}
  synchronization:
    mutex:
      name: {{ .Values.abfsBuilderRuntimeImageConcurrencyMutexName | quote }}
{{- end }}
  serviceAccountName: {{ include "abfs-builder-runtime-image.workflowServiceAccountName" . | quote }}
{{- if .Values.workflowTtlSecondsAfterCompletion }}
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.workflowTtlSecondsAfterCompletion }}
{{- end }}
{{- if .Values.podGcStrategy }}
  podGC:
    strategy: {{ .Values.podGcStrategy | quote }}
{{- end }}
  arguments:
    parameters:
      - name: horizonSubmittedFrom
        value: ""
        description: "Where the submit call originated (Horizon); mirrored on workflow label horizon-sdv.io/submitted-from."
      - name: dockerArtifactPathName
        value: {{ .Values.spec.dockerArtifactPathName | quote }}
        description: "Artifact registry image path (repo/name), e.g. horizon-sdv/aaos-abfs-builder."
      - name: NO_PUSH
        value: {{ .Values.spec.noPush | quote }}
        description: "Build only, do not push to the registry. Default true (same as Jenkins NO_PUSH). Set false to push."
      - name: imageTag
        value: {{ .Values.spec.imageTag | quote }}
        description: "Registry tag to push. Argo Ubuntu default argowf-latest; Argo COS default argowf-cos-latest (Jenkins uses latest / cos-latest). If templateFlavor=cos and this is still latest/argowf-latest, the workflow rewrites it to argowf-cos-latest. ubuntu + a COS tag fails."
      - name: templateFlavor
        value: {{ .Values.spec.templateFlavor | quote }}
        description: "ubuntu or cos. Selects the Argo default registry tag (argowf-latest vs argowf-cos-latest). Docker FROM is still linuxDistribution (Ubuntu/Debian userspace for both). Contradictory ubuntu+COS tags are rejected."
      - name: linuxDistribution
        value: {{ .Values.spec.linuxDistribution | quote }}
        description: "Docker FROM base for the builder container."
      - name: abfsRepository
        value: {{ .Values.spec.abfsRepository | quote }}
        description: "ABFS apt repository name (Seed ABFS_REPOSITORY)."
      - name: googleDistributionRegistry
        value: {{ .Values.spec.googleDistributionRegistry | quote }}
        description: "Google apt-transport-artifact-registry sources line."
      - name: abfsDistributionRegistry
        value: {{ include "abfs-builder-runtime-image.abfsDistributionRegistry" . | quote }}
        description: "Full ABFS apt sources line (default composed from abfsRepository)."
      - name: nodejsVersion
        value: {{ .Values.spec.nodejsVersion | quote }}
        description: "Node.js version to install."
      - name: gcloudCliVersion
        value: {{ .Values.spec.gcloudCliVersion | quote }}
        description: "gcloud CLI version to install."
      - name: kubectlVersion
        value: {{ .Values.spec.kubectlVersion | quote }}
        description: "kubectl version to install."
      - name: packerVersion
        value: {{ .Values.spec.packerVersion | quote }}
        description: "Packer version to install in the image."
      - name: enableGeminiAiAssistant
        value: {{ .Values.spec.enableGeminiAiAssistant | quote }}
        description: "Enable Gemini AI tooling in the image."
      - name: geminiCliVersion
        value: {{ .Values.spec.geminiCliVersion | quote }}
        description: "Gemini CLI version to install."
      - name: googleAdkVersion
        value: {{ .Values.spec.googleAdkVersion | quote }}
        description: "Google ADK version to install."
  templates:
{{- include "abfs-builder-runtime-image.templates" . | nindent 2 }}
