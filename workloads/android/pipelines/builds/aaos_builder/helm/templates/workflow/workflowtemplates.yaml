# Description:
# Argo WorkflowTemplate for the AAOS builder pipeline (Horizon catalog: exposed when module workloads-android is enabled).
# Argo Events: Sensor webhook-{{ .Values.workflowTemplateName }} filters body.workflowTemplateName == this metadata.name (workflow/sensors.yaml).

{{- /* With values-abfs.yaml (variant: abfs) this renders aaos-builder-abfs: same chart, ABFS mount, one build pod. */}}
{{- $abfs := eq (include "aaos-builder.isAbfs" .) "true" }}
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: {{ .Values.workflowTemplateName | quote }}
  namespace: {{ include "aaos-builder.workflowNamespace" . | quote }}
  labels:
    app.kubernetes.io/name: {{ .Values.workflowTemplateName }}
    horizon-sdv.io/expose: "true"
    horizon-sdv.io/module: workloads-android
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  entrypoint: main
  # Ensure main container logs are archived to the cluster artifact repo (GCS) per step; reinforces controller artifactRepository.archiveLogs.
  archiveLogs: true
  serviceAccountName: {{ include "aaos-builder.workflowServiceAccountName" . | quote }}
  # Argo UI list: title + description (https://argo-workflows.readthedocs.io/en/latest/title-and-description/)
  workflowMetadata:
    annotations:
      workflows.argoproj.io/title: '{{ "{{" }}workflow.parameters.lunchTarget{{ "}}" }}{{ if $abfs }} (ABFS){{ end }}'
      workflows.argoproj.io/description: '{{ "{{" }}workflow.parameters.androidRevision{{ "}}" }}'
{{- if .Values.podGcStrategy }}
  # podGC strategy per Argo (e.g., OnPodCompletion, OnWorkflowCompletion).
  podGC:
    strategy: {{ .Values.podGcStrategy | quote }}
{{- end }}
{{- if .Values.spec.workflowTtlSecondsAfterCompletion }}
  # TTL deletes workflow objects after completion (set via values).
  ttlStrategy:
    secondsAfterCompletion: {{ .Values.spec.workflowTtlSecondsAfterCompletion }}
{{- end }}
{{- if .Values.spec.volumeClaimGcStrategy }}
  # volumeClaimGC strategy per Argo (e.g., OnWorkflowCompletion).
  volumeClaimGC:
    strategy: {{ .Values.spec.volumeClaimGcStrategy | quote }}
{{- end }}
  arguments:
    parameters:
      - name: horizonSubmittedFrom
        value: ""
        description: "Where the submit call originated (Horizon); mirrored on workflow label horizon-sdv.io/submitted-from."
      - name: lunchTarget
        value: {{ .Values.spec.lunchTarget | quote }}
        description: "AAOS lunch target to build."
      - name: androidRevision
        value: {{ .Values.spec.androidRevision | quote }}
{{- if $abfs }}
        description: "AAOS branch, revision or tag to mount. Need to be seeded on the ABFS server."
{{- else }}
        description: "AAOS branch, revision or tag."
{{- end }}
      - name: manifestUrl
        value: {{ .Values.spec.manifestUrl | quote }}
        description: "Base manifest URL for repo init."
      - name: manifestName
        value: {{ .Values.spec.manifestName | quote }}
        description: "Android manifest filename."
      - name: cleanBuild
        value: {{ .Values.spec.cleanBuild | quote }}
        description: "Clean mode: NO_CLEAN, CLEAN_BUILD, or CLEAN_ALL."
      - name: buildCtsOnly
        value: {{ .Values.spec.buildCtsOnly | quote }}
        description: "When true, build CTS only."
      - name: forceImageBuild
        value: {{ .Values.spec.forceImageBuild | quote }}
        description: "When true, always rebuild the AAOS builder image."
      - name: storageLabels
        value: {{ .Values.spec.storageLabels | quote }}
        description: "Labels for storage metadata."
      - name: enableGeminiAiAssistant
        value: {{ .Values.spec.enableGeminiAiAssistant | quote }}
        description: "Enable Gemini AI review on failure (when build fails)."
      - name: parallelSyncJobs
        value: {{ .Values.spec.parallelSyncJobs | quote }}
        description: "Parallel repo sync jobs."
{{- if $abfs }}
      - name: abfsServer
        value: {{ .Values.spec.abfs.server | quote }}
        description: "ABFS gRPC endpoint (FQDN host:port)."
      - name: abfsCachedBuild
        value: {{ .Values.spec.abfs.cachedBuild | quote }}
        description: "When true, cacheman and the CASFS mount use /aaos-cache."
      - name: abfsVersion
        value: {{ .Values.spec.abfs.version | quote }}
        description: "abfs-client apt version (i.e. 0.1.14)."
      - name: abfsCasfsVersion
        value: {{ .Values.spec.abfs.casfsVersion | quote }}
        description: "casfs-kmod apt version."
      - name: abfsRepository
        value: {{ .Values.spec.abfs.repository | quote }}
        description: "ABFS apt Artifact Registry repository."
      - name: uploaderManifestServer
        value: {{ .Values.spec.abfs.uploaderManifestServer | quote }}
        description: "abfs --manifest-server host; must match the pusher Gerrit seed."
      # Appended, never inserted: sensors.yaml addresses these by position
      # (spec.arguments.parameters.<N>.value). Inserting above shifts every
      # later index and silently misroutes webhook values.
      - name: gerritTopic
        value: {{ .Values.spec.gerritTopic | quote }}
        description: "Optional Gerrit topic; fetches every change under it."
      - name: overrideMakeCommand
        value: {{ .Values.spec.overrideMakeCommand | quote }}
        description: "Optional override of the default make command (single line)."
      - name: abfsCleanCache
        value: {{ .Values.spec.abfs.cleanCache | quote }}
        description: "Clean the ABFS cache directory before the build."
      - name: abfsCachemanTimeout
        value: {{ .Values.spec.abfs.cachemanTimeout | quote }}
        description: "cacheman sync timeout in seconds; 0 disables the wait."
      - name: postRepoCommand
        value: {{ .Values.spec.postRepoCommand | quote }}
        description: "Optional commands run after the mount and before the build (Jenkins POST_REPO_COMMAND). The build/soong sandbox fix ABFS needs is applied automatically per Android version (A15 cherry-picks, A16 soong.go patch); leave empty unless extra commands are needed."
      - name: aaosParallelBuildJobs
        value: {{ .Values.spec.parallelBuildJobs | quote }}
        description: "Parallel build jobs (-j). Default: 16. Empty lets the build system decide. If the ABFS cacheman socket gets overloaded during the build, the value may be too high."
{{- end }}
      # Appended after the positional ABFS parameters so sensors.yaml can map it to index 11+len(abfs).
      - name: aiReviewRuntime
        value: {{ .Values.spec.aiReviewRuntime | default "agy" | quote }}
        enum:
          - agy
          - gemini-cli
        description: "AI review runtime: agy (Antigravity SDK, default) or gemini-cli."
{{- if $abfs }}
  templateDefaults:
    metadata:
      annotations:
        # ABFS builds run for hours. Evicting the pod loses the whole build,
        # so the autoscaler must leave it alone; the Jenkins job sets this to
        # "false" for the same reason.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
      labels:
        aaos_abfs_pod: "true"
    nodeSelector:
      workloadLabel: android-abfs-build
      # The COS build pool carries the same workloadLabel and taint. Pin to the
      # Ubuntu pool, the only one the casfs installer DaemonSet runs on
      # (abfs-client-module-ubuntu values.yaml uses the same selector).
      cloud.google.com/gke-nodepool: abfs-build-node-pool-ubuntu
    tolerations:
      - key: workloadType
        operator: Equal
        value: android-abfs-build
        effect: NoSchedule
{{- else }}
  templateDefaults:
    metadata:
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
      labels:
        aaos_pod: "true"
    nodeSelector:
      workloadLabel: android
    tolerations:
      - key: workloadType
        operator: Equal
        value: android
        effect: NoSchedule
{{- end }}
    # Pod anti-affinity is applied only to build templates.
  # Per-workflow PVC (one per workflow execution).
  # Per-workflow mode keeps different workflows isolated even on same node.
  volumeClaimTemplates:
    - metadata:
        name: aaos-cache
        labels:
          app.kubernetes.io/name: {{ .Values.workflowTemplateName | quote }}
          app.kubernetes.io/instance: {{ .Release.Name | quote }}
          aaos-cache-scope: "workflow"
          aaos-revision: {{ printf "{{=sprig.regexFind(\"android-[0-9]+\", workflow.parameters.androidRevision)}}" | quote }}
          aaos-lunch-target: {{ printf "{{=workflow.parameters.lunchTarget}}" | quote }}
          # View: kubectl get pvc -n <ns> -l aaos-cache-scope=workflow --show-labels
          # View: kubectl get pvc -n <ns> -o custom-columns=NAME:.metadata.name,SCOPE:.metadata.labels.aaos-cache-scope,REV:.metadata.labels.aaos-revision,LUNCH:.metadata.labels.aaos-lunch-target
      spec:
        accessModes:
          - {{ .Values.spec.aaosCacheAccessMode | default "ReadWriteOnce" | quote }}
        storageClassName: {{ include "aaos-builder.cacheStorageClassName" . }}
        resources:
          requests:
            storage: {{ .Values.spec.aaosCacheStorageSize | default "1000Gi" | quote }}
{{- if and .Values.sharedPipelineWorkspace (not (or .Values.localRepoHostPath .Values.localRepoPvcName)) }}
    - metadata:
        name: pipeline-workspace
        labels:
          app.kubernetes.io/name: {{ .Values.workflowTemplateName | quote }}
          app.kubernetes.io/instance: {{ .Release.Name | quote }}
          aaos-pipeline-workspace: "workflow"
      spec:
        accessModes:
          - {{ .Values.spec.aaosCacheAccessMode | default "ReadWriteOnce" | quote }}
        # Delete reclaim policy: single class pipeline-workspace-delete (gitops dynpvc). Unlike aaos-cache Retain disks, PV is removed when PVC is deleted after the workflow.
        storageClassName: {{ .Values.spec.pipelineWorkspaceStorageClassName | default "pipeline-workspace-delete" | quote }}
        resources:
          requests:
            storage: {{ .Values.spec.pipelineWorkspaceStorageSize | quote }}
{{- end }}
  # local-repo is always defined so the gemini-review step can mount /workspace-local (PVC, hostPath, or emptyDir).
  volumes:
    - name: local-repo
{{- if .Values.localRepoHostPath }}
      # hostPath is for local clusters only (Docker Desktop/Kind). Leave localRepoHostPath empty for GKE.
      hostPath:
        path: {{ .Values.localRepoHostPath | quote }}
        type: Directory
{{- else if .Values.localRepoPvcName }}
      # PVC-backed repo (e.g. repo copied to PVC for GKE).
      persistentVolumeClaim:
        claimName: {{ .Values.localRepoPvcName | quote }}
{{- else }}
      # emptyDir when not using local repo; shared pipeline-workspace mounts at /horizon on WT steps only (not on gemini-review).
      emptyDir: {}
{{- end }}
  templates:
{{- include "aaos-builder.templates" . | nindent 2 }}
