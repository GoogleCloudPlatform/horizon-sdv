# Argo Events Sensor for this chart's WorkflowTemplate (same EventSource `webhook` / `workflow-dispatch`).
{{- /*
ABFS variant: its extra parameters follow parallelSyncJobs (index 10), in the same order as in
workflowtemplates.yaml, so each one maps to spec.arguments.parameters.<11 + position>.
aiReviewRuntime is appended after that list (index 11 + len of the ABFS list; 11 when the list is empty).
*/}}
{{- $abfsParams := list }}
{{- if eq (include "aaos-builder.isAbfs" .) "true" }}
{{- $abfsParams = list "abfsServer" "abfsCachedBuild" "abfsVersion" "abfsCasfsVersion" "abfsRepository" "uploaderManifestServer" "gerritTopic" "overrideMakeCommand" "abfsCleanCache" "abfsCachemanTimeout" "postRepoCommand" "aaosParallelBuildJobs" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: webhook-{{ .Values.workflowTemplateName }}
  namespace: {{ .Values.namespacePrefix }}argo-events
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  eventBusName: default
  template:
    serviceAccountName: sensor-submit-workflow
  dependencies:
    - name: webhook-dep
      eventSourceName: webhook
      eventName: workflow-dispatch
      filters:
        data:
          - path: body.workflowTemplateName
            type: string
            # Argo Events matches string filters as regular expressions, so an
            # unanchored "aaos-builder" also matches "aaos-builder-abfs" and
            # "aaos-builder-runtime-image" and starts this build for those too.
            value:
              - {{ printf "^%s$" .Values.workflowTemplateName | quote }}
  triggers:
    - template:
        name: submit-{{ .Values.workflowTemplateName }}
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: webhook-{{ .Values.workflowTemplateName }}-
                namespace: {{ include "aaos-builder.workflowNamespace" . | quote }}
              spec:
                workflowTemplateRef:
                  name: {{ .Values.workflowTemplateName | quote }}
                arguments:
                  parameters:
                    - name: horizonSubmittedFrom
                    - name: lunchTarget
                    - name: androidRevision
                    - name: manifestUrl
                    - name: manifestName
                    - name: cleanBuild
                    - name: buildCtsOnly
                    - name: forceImageBuild
                    - name: storageLabels
                    - name: enableGeminiAiAssistant
                    - name: parallelSyncJobs
{{- range $abfsParams }}
                    - name: {{ . }}
{{- end }}
                    - name: aiReviewRuntime
                      value: {{ .Values.spec.aiReviewRuntime | default "gemini-cli" | quote }}
          parameters:
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedBy
              dest: metadata.annotations.horizon-sdv\.io/submitted-by
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: metadata.labels.horizon-sdv\.io/submitted-from
            - src:
                dependencyName: webhook-dep
                dataKey: body.horizonSubmittedFrom
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.lunchTarget
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.androidRevision
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.manifestUrl
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.manifestName
              dest: spec.arguments.parameters.4.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.cleanBuild
              dest: spec.arguments.parameters.5.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.buildCtsOnly
              dest: spec.arguments.parameters.6.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.forceImageBuild
              dest: spec.arguments.parameters.7.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.storageLabels
              dest: spec.arguments.parameters.8.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.enableGeminiAiAssistant
              dest: spec.arguments.parameters.9.value
            - src:
                dependencyName: webhook-dep
                dataKey: body.parallelSyncJobs
              dest: spec.arguments.parameters.10.value
{{- range $i, $p := $abfsParams }}
            - src:
                dependencyName: webhook-dep
                dataKey: body.{{ $p }}
              dest: spec.arguments.parameters.{{ add 11 $i }}.value
{{- end }}
            - src:
                dependencyName: webhook-dep
                dataKey: body.aiReviewRuntime
                value: {{ .Values.spec.aiReviewRuntime | default "gemini-cli" | quote }}
              dest: spec.arguments.parameters.{{ add 11 (len $abfsParams) }}.value
