# Minimal values to render the platform root chart (gitops/) for its NetworkPolicies only (run.sh platform_policies).
spec: {source: {repoURL: https://x, targetRevision: main}}
config:
  domain: d.example
  projectID: proj
  region: europe-west1
  zone: europe-west1-d
  enableNetworkPolicies: true
  postjobs: {mtkconnect: i, mtkconnectkey: i, keycloak: i, keycloakmtkconnect: i, keycloakjenkins: i, keycloakargocd: i, keycloakheadlamp: i, keycloakgerrit: i, keycloakgrafana: i, keycloakMcpGatewayRegistry: i, keycloakArgoWorkflows: i, keycloakhorizonapi: i, grafana: i, gerrit: i}
  apps: {kccWebhookCertMonitor: i, horizonPortal: i, horizondevelopmentportal: i, gerritMcpServer: i, moduleManager: i, horizonApi: i}
  containerImages: {kccWebhookCertMonitor: i, horizondevelopmentportal: i, gerritMcpServer: i, moduleManager: i, storageGcsModule: i, cloudWorkstationsModule: i, horizonApi: i}
  nginx: {image: nginx, tag: "1"}
  workloads: {android: {url: u, branch: b}}
scm: {authMethod: app, type: github, repoUrl: https://x, branch: main, username: u, repoOwner: o, repoName: r}
