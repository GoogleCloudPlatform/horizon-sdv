# Values for gitops/modules/storage-mirror-module and its argo-workflows child chart in the kind harness.
moduleName: storage-mirror
config:
  namespacePrefix: ""
  projectID: e2e-project
  zone: e2e-zone
  isSubEnvironment: false
  # kindnet does not enforce NetworkPolicy; rendering them still exercises the templates.
  enableNetworkPolicies: true
  probeSourceCIDRs: ["172.18.0.0/16"]
  storageMirror:
    network: e2e-network
  containerImages:
    storageMirrorModule: storage-mirror-module-app:e2e
    storageMirrorSync: storage-mirror-sync:e2e
mirror:
  volume:
    capacityGb: 1024
  defaults:
    repo:
      manifestUrl: https://gitea.e2e.svc.cluster.local:3000/e2e/manifest
      manifestRef: main
      manifestFile: default.xml
      syncJobs: 2
      syncTimeout: 30m
    git:
      syncTimeout: 30m
  retention:
    gc: Auto
  consumers:
    jenkins:
      enabled: true
      readOnly: true
workflows:
  resources:
    repo: {cpu: "1", memory: 1Gi}
    git: {cpu: "1", memory: 1Gi}
    light: {cpu: 200m, memory: 256Mi}
  activeDeadlineSeconds:
    repo: 3600
    git: 3600
    delete: 1800
