# Dedicated kind cluster for the Storage Mirror end-to-end harness. The API server listens on 127.0.0.1 only;
# run.sh refuses to apply anything when the kubeconfig points elsewhere.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
  - role: worker
    labels:
      # The repo sync template schedules onto the android pool (workloadLabel=android) with a toleration.
      workloadLabel: android
