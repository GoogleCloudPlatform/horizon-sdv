# The slice of the Horizon platform the module depends on, copied from gitops/templates (namespaces.yaml,
# argo-workflows-init.yaml, argo-events.yaml) and gitops/apps/argo-events-resources, without prefixes.
apiVersion: v1
kind: Namespace
metadata:
  name: horizon
---
apiVersion: v1
kind: Namespace
metadata:
  name: horizon-api
---
apiVersion: v1
kind: Namespace
metadata:
  name: workflows
---
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-workflowtaskresults
  namespace: workflows
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "get", "list", "patch", "update"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sensor-submit-workflow
  namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argo-events-sensor-workflows
  namespace: workflows
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtemplates"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argo-events-sensor-workflows
  namespace: workflows
subjects:
  - kind: ServiceAccount
    name: sensor-submit-workflow
    namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argo-events-sensor-workflows
---
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: default
  namespace: argo-events
spec:
  nats:
    native:
      replicas: 1
      auth: token
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: webhook
  namespace: argo-events
spec:
  eventBusName: default
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    workflow-dispatch:
      port: "12000"
      endpoint: /events/workflow
      method: POST
